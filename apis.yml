aid: avetta

name: Avetta

description: Avetta operates a cloud-based supply chain risk management (SCRM) and contractor compliance platform, Avetta One, used by more than
  360,000 businesses across 120+ countries to prequalify, audit, and continuously monitor contractors and suppliers. The platform spans health
  and safety compliance, prequalification, worker management, sustainability and ESG (GHG reporting, supplier diversity, supplier ESG due diligence),
  and business risk (financial, cybersecurity, and insurance verification). Avetta exposes an Open API and ERP connectors through a developer
  portal (docs.api.avetta.com) so client organizations can synchronize contractor and supplier data into Salesforce, Oracle, Workday, ServiceNow,
  and internal systems. Avetta is a portfolio company of Norwest Venture Partners.

