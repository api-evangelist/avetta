components:
  schemas:
    3.29.14_NaturalKeyResource:
      type: object
      properties:
        extSysKey:
          type: string
        idKey:
          type: string
    3.29.14_ClientSingleCompetencyUpdateResource:
      required:
      - clientExtSysKey
      - clientIdKey
      - description
      - duration
      - durationUnit
      - globalId
      - levelId
      - mandatoryCompetencySteps
      - scopeId
      - suffix
      - verifiedDocument
      - verifiedDocumentExpiryMandatory
      - verifiedDocumentIssueMandatory
      - verifiedDocumentPrivateFile
      type: object
      properties:
        id:
          type: integer
          format: int32
        scopeId:
          type: integer
          format: int32
        globalId:
          type: integer
          format: int32
        levelId:
          type: integer
          format: int32
        suffix:
          maxLength: 100
          minLength: 0
          type: string
        description:
          type: string
        duration:
          type: integer
          format: int32
        durationUnit:
          type: string
          enum:
          - Days
          - Weeks
          - Months
          - Years
        verifiedDocument:
          type: boolean
        verifiedDocumentPrivateFile:
          type: boolean
        verifiedDocumentSensitiveFile:
          type: boolean
        verifiedDocumentIssueMandatory:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        verifiedDocumentExpiryMandatory:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        nonVerifiedDocumentIssueMandatory:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        nonVerifiedDocumentExpiryMandatory:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        printOnSticker:
          type: boolean
        hideFileUpload:
          type: boolean
        mandatoryCompetencySteps:
          type: array
          items:
            type: string
            enum:
            - PERMIT_TO_TRAIN
            - TRAINED
            - TRAINED_TT
            - TRAINED_TP
            - TRAINED_TE
            - ASSESSED
            - AUTHORISED
            - APPOINTED
        active:
          type: boolean
        clientExtSysKey:
          maxLength: 255
          minLength: 0
          type: string
        clientIdKey:
          maxLength: 255
          minLength: 0
          type: string
    3.29.14_CompetencyLevelResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    3.29.14_StatusType:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        reasonPhrase:
          type: string
    3.29.14_FileUploadRequirementResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        mandatoryStatus:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - CONDITIONAL
        mandatoryConditionalText:
          type: string
        requirementsDescription:
          type: string
        helpLinkUrl:
          type: string
        fileType:
          type: string
        fileSizeBytes:
          type: integer
          format: int32
        mimetypes:
          uniqueItems: true
          type: array
          items:
            type: string
        downloadableDocId:
          type: integer
          format: int32
        allowOnlineAssessment:
          type: boolean
        issueDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        expiryDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
    3.29.14_ScopeDetailResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        timezone:
          type: string
        fatigueLimit:
          type: integer
          format: int32
        siteId:
          type: integer
          format: int32
        realmId:
          type: integer
          format: int32
        concoId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - SYSTEM
          - REALM
          - SITE
          - LOCATION
          - CONCO_WEB
          - EMPLOYEE
          - UNKNOWN
        typeDisplayName:
          type: string
        ownerName:
          type: string
        connectAccountId:
          type: string
        connectClient:
          type: boolean
        parentId:
          type: integer
          format: int32
        realm:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        site:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        conco:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        topLevel:
          type: boolean
    3.29.14_KeyedIntegerResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    3.29.14_FullErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
        errorDetail:
          type: string
    3.29.14_CompetencyGlobalResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_CompetencyLevelResource'
    3.29.14_CompetencyResource:
      type: object
      properties:
        stubId:
          type: integer
          format: int32
        competencyId:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        duration:
          type: integer
          format: int32
        durationUnit:
          type: string
          enum:
          - Days
          - Weeks
          - Months
          - Years
        groupCompetency:
          type: boolean
        verifiedDocument:
          type: boolean
        allowTrainingBookings:
          type: boolean
        external:
          type: boolean
        active:
          type: boolean
        hideFileUpload:
          type: boolean
        externalId:
          $ref: '#/components/schemas/3.29.14_KeyedStringResource'
        clientKey:
          $ref: '#/components/schemas/3.29.14_NaturalKeyResource'
        scope:
          $ref: '#/components/schemas/3.29.14_ScopeDetailResource'
        suffix:
          type: string
        level:
          type: string
        global:
          type: string
        verifiedDocumentIssueMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        verifiedDocumentExpiryMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        nonVerifiedDocumentIssueMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        nonVerifiedDocumentExpiryMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        scopeId:
          type: integer
          format: int32
        fileUploadRequirement:
          $ref: '#/components/schemas/3.29.14_FileUploadRequirementResource'
        members:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_CompetencyResource'
        competencyRequirement:
          type: string
          enum:
          - MANDATORY
          - OPTIONAL
          - CONDITIONAL
        uploadAllowed:
          type: boolean
        deliveredByTraining:
          type: boolean
        issueDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        expiryDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        minimumValidityDaysBeforeRenewal:
          type: integer
          format: int32
    3.29.14_ErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
