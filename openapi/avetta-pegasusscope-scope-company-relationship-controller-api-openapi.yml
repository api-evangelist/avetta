components:
  schemas:
    3.29.14_NaturalKeyResource:
      type: object
      properties:
        extSysKey:
          type: string
        idKey:
          type: string
    3.29.14_StatusType:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        reasonPhrase:
          type: string
    3.29.14_RelatedCompanyResource:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/3.29.14_CompanyResource'
        relationshipType:
          type: string
          enum:
          - PRIMARY
          - SUB_CONTRACTOR
    3.29.14_KeyedIntegerResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    3.29.14_CreateCompanyRelationshipResource:
      required:
      - companyId
      - subContractorId
      type: object
      properties:
        companyId:
          type: integer
          format: int32
        subContractorId:
          type: integer
          format: int32
    3.29.14_CompanyRegistrationResource:
      required:
      - contactEmail
      - contactFirstName
      - contactLastName
      - countryId
      - name
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          maxLength: 185
          minLength: 0
          type: string
        address:
          $ref: '#/components/schemas/3.29.14_AddressResource'
        deliveryAddress:
          $ref: '#/components/schemas/3.29.14_DeliveryAddressResource'
        phone:
          maxLength: 20
          minLength: 0
          type: string
        mobilePhone:
          maxLength: 20
          minLength: 0
          type: string
        fax:
          maxLength: 20
          minLength: 0
          type: string
        contactFirstName:
          maxLength: 30
          minLength: 0
          type: string
        contactLastName:
          maxLength: 30
          minLength: 0
          type: string
        contactEmail:
          maxLength: 80
          minLength: 0
          type: string
        countryId:
          maxLength: 2
          minLength: 0
          type: string
        locale:
          type: string
        extSysKey:
          type: string
        idKey:
          type: string
        connectStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - REJECTED
          - PENDING
        abn:
          maxLength: 14
          minLength: 0
          type: string
        businessNo:
          maxLength: 20
          minLength: 0
          type: string
        webAddress:
          maxLength: 64
          minLength: 0
          type: string
        createdBy:
          maxLength: 60
          minLength: 0
          type: string
        integrationSource:
          type: string
        state:
          type: string
        town:
          type: string
        postCode:
          type: string
        deliveryTown:
          type: string
        deliveryState:
          type: string
        deliveryPostCode:
          type: string
        streetAddress:
          type: string
        deliveryStreetAddress:
          type: string
    3.29.14_PortalCompanyInvitationCommunicationLogResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        companyContact:
          $ref: '#/components/schemas/3.29.14_UserResource'
        createdBy:
          $ref: '#/components/schemas/3.29.14_UserResource'
        createdDate:
          type: string
    3.29.14_PortalCompanyInvitationResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        company:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        invitationType:
          type: string
          enum:
          - NEW_COMPANY
          - EXISTING_COMPANY
        communicationLogs:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_PortalCompanyInvitationCommunicationLogResource'
        companyRelationshipId:
          type: integer
          format: int32
        createdBy:
          $ref: '#/components/schemas/3.29.14_UserResource'
        createdDate:
          type: string
        accepted:
          type: boolean
        acceptedDate:
          type: string
    3.29.14_CreateCompanyAndCompanyRelationshipResource:
      required:
      - newCompany
      - relationshipType
      type: object
      properties:
        relationshipType:
          type: string
          enum:
          - PRIMARY
          - SUB_CONTRACTOR
        newCompany:
          $ref: '#/components/schemas/3.29.14_CompanyRegistrationResource'
    3.29.14_FullErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
        errorDetail:
          type: string
    3.29.14_DeliveryAddressResource:
      required:
      - country
      type: object
      properties:
        id:
          type: integer
          format: int32
        address:
          maxLength: 200
          minLength: 0
          type: string
        town:
          maxLength: 50
          minLength: 0
          type: string
        state:
          maxLength: 50
          minLength: 0
          type: string
        postcode:
          maxLength: 15
          minLength: 0
          type: string
        country:
          maxLength: 2
          minLength: 0
          type: string
    3.29.14_RegisterCompanyAndCreateRelationshipResultResource:
      type: object
      properties:
        companyRelationship:
          $ref: '#/components/schemas/3.29.14_CompanyRelationshipResource'
        company:
          $ref: '#/components/schemas/3.29.14_CompanyResource'
        user:
          $ref: '#/components/schemas/3.29.14_UserResource'
    3.29.14_CompanyResource:
      required:
      - name
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          maxLength: 185
          minLength: 0
          type: string
        nameWithQualifier:
          type: string
        qualifier:
          type: string
        address:
          $ref: '#/components/schemas/3.29.14_AddressResource'
        deliveryAddress:
          $ref: '#/components/schemas/3.29.14_DeliveryAddressResource'
        phone:
          maxLength: 20
          minLength: 0
          type: string
        mobilePhone:
          maxLength: 20
          minLength: 0
          type: string
        fax:
          maxLength: 20
          minLength: 0
          type: string
        contactFirstName:
          maxLength: 30
          minLength: 0
          type: string
        contactLastName:
          maxLength: 30
