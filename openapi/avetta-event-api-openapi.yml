openapi: 3.2.0
info:
  title: Avetta Event API
  version: '2026-05-08'
  license:
    name: Trade secret
    url: https://avetta.com
  description: 'Operations tagged Event across 2 of this provider''s published API definitions: avetta-worker-v1.json, avetta-worker-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{environment}.avetta.com/api/v1
  variables:
    environment:
      default: worker
      enum:
      - worker
      - au-worker
security:
- ApiKeyAuth: []
tags:
- name: Event
  description: The Event API allows you to retrieve event / requirement information.
paths:
  /event/{id}:
    get:
      operationId: getEvent
      tags:
      - Event
      summary: List of events
      description: Returns responses of event
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulEvent'
        '201':
          $ref: '#/components/responses/badRequestMissingEventID'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /event/clearbookmark:
    post:
      operationId: clearEventBookmark
      tags:
      - Event
      summary: Clear the SCORM bookmarks
      description: This endpoint is used to clear the SCORM bookmarks.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/evtIDParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulClearBookmark'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /event/document/complete:
    post:
      operationId: viewDocumentID
      tags:
      - Event
      summary: Complete / Mark as Downloaded
      description: This endpoint is used to mark the requirement files as Viewed / Downloaded. The list of available files can be found under “links” array returned by the Event endpoint
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/fileNameParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulComplete'
        '201':
          $ref: '#/components/responses/badRequestComplete'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /event/document:
    post:
      operationId: uploadDocumentID
      tags:
      - Event
      summary: Upload a document (using form-data)
      description: This endpoint is used to upload a document for “Documents Review” section. The uploaded documents can be found in the “upload->files” array returned by the Event endpoint
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/docFileParam'
      - $ref: '#/components/parameters/fileNameBaseParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulUpDocument'
        '201':
          $ref: '#/components/responses/errorFile'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    delete:
      operationId: deleteDocument
      tags:
      - Event
      summary: Delete a document
      description: This endpoint is used to delete a document uploaded for “Documents Review”
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/docIDParam'
      - $ref: '#/components/parameters/uedIDParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulDelete'
        '201':
          $ref: '#/components/responses/badRequestDelete'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    get:
      operationId: getDocument
      tags:
      - Event
      summary: Get a document (using base64string)
      description: This is NOT a preferred method. Mobile team should NOT use this method This endpoint is used to get a document uploaded for “Documents Review” to download
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/docIDParam'
      - $ref: '#/components/parameters/uedIDParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulGetDocument'
        '201':
          $ref: '#/components/responses/badRequestGetDocument'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /event/review:
    post:
      operationId: reviewEvent
      tags:
      - Event
      summary: Event Review
      description: Endpoint to save the event for Credit/review
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/components-parameters-evtIDParam'
      - $ref: '#/components/parameters/postDataParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulReview'
        '201':
          $ref: '#/components/responses/badRequest'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
