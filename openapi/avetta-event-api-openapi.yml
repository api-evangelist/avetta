  schemas:
    messageSchema:
      type: object
      format: object
      properties:
        message:
          type: string
          description: Message of the response
        status:
          type: string
          description: Status of the response
        success:
          type: boolean
          description: Flag to show if the transaccion was successful
          enum:
          - true
          - false
        code:
          type: integer
          description: Code of the response
        detail:
          type: string
          description: Detail of the response
    schemas-propertiesSchema:
      type: object
      properties:
        id:
          type: integer
          description: Number of ID of the Event
          example: 1593
        type:
          type: integer
          description: Number of type of the EvtTypID of the Event, Requirement, Equivelancy, Track, etc
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          example: 1
        reqtype:
          type: integer
          description: Number of the EvtCrsTypID of the Event <scorm,aicc,download,external,run>
          enum:
          - 121
          - 122
          - 123
          - 124
          - 125
          - 126
          - 127
          - 128
          example: 121
        code:
          type: string
          description: Code of the Event
          example: 8407NEWREQ
        title:
          type: string
          description: Title of the Event
          example: 8407NEWREQ
        description:
          type: string
          description: Description of the Event
          example: null
        instructions:
          type: string
          description: Instructions of the Event
          example: null
        shortdescription:
          type: string
          description: Short description of the Event
          example: ''
        shortinstructions:
          type: string
          description: Short instructions of the Event
          example: ''
        requires_mfa:
          type: boolean
          description: Requires MFA (true or false)
          example: false
        acknowledgementrequired:
          type: boolean
          description: Acknowledgement required (true or false), do not send acknowledgement information for items in review
          example: false
        acknowledgementtext:
          type: string
          description: Acknowledgement text of the Event, do not send acknowledgement information for items in review
          example: ''
        upload:
          description: This field appears if the event has Documents Review
          type: object
          properties:
            revid:
              type: integer
              description: Revid of the upload
              example: 12332
            enabled:
              type: boolean
              description: Enabled of the upload
              example: true
            howmany:
              type: integer
              description: How many of the upload
              example: 0
            canview:
              type: boolean
              description: Can view of the upload
              example: true
            candedit:
              type: boolean
              description: Can delete of the upload
              example: false
            instructions:
              type: string
              description: Instructions of the upload
              example: ''
            files:
              description: Array of files of the upload
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Id of the file
                    example: 2345
                  docid:
                    type: integer
                    description: Docid of the file
                    example: 3540
                  title:
                    type: string
                    description: Title of the file
                    example: Something.jpg
                  type:
                    type: string
                    description: Type of the file
                    example: web
                  url:
                    type: string
                    description: Url of the file
                    example: ''
                  viewed:
                    type: boolean
                    description: Viewed of the file
                    example: false
        fields:
          description: Array of fields of the Event
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Key of the field
                example: UEDRevExpDate
                enum:
                - UEDRevEffectiveDate
                - UEDRevExpDate
                - UEHInstructor
                - CustomData001
                - NewUEDRevNotes
                - UEDRevNotes
              title:
                type: string
                description: Title of the field
                example: Review Expiration Date
                enum:
                - Review Effective Date
                - Review Expiration Date
                - Instructor
                - CustomData001
                - Notes
                - ''
              type:
                type: integer
                description: Number of the type of the field
                example: 506
                enum:
                - 506
                - 518
                - 501
                - 505
                - 502
              value:
                type: string
                description: Value of the field
                example: '2023-10-20'
              help:
                type: string
                description: information about the date, this fields appear when key is UEDRevEffectiveDate or UEDRevExpDate
                example: Date must not be after today
              readonly:
                type: boolean
                description: Readonly of the field
                example: false
              validation:
                type: object
                description: Validation of the field
                properties:
                  required:
                    type: boolean
                    description: Required of the field
                    example: true
                  minvalue:
                    type: string
                    description: Minvalue of the field
                    example: '2021-10-20'
                  maxvalue:
                    type: string
                    description: Maxvalue of the field
                    example: '2023-10-20'
                  maxlength:
                    type: string
                    description: Maxlength of the field
                    example: null
                  raw:
                    type: string
                    description: This field represents the raw associated with the 'CustomData001' key, It is applicable only when the key is 'CustomData001' and specifies a restriction on the permissible values for this field
                    example: null
                  limit:
                    type: integer
                    description: This field represents the limit associated with the 'UEDRevEffectiveDate' key. It is applicable only when the key is 'UEDRevEffectiveDate' and specifies a restriction on the permissible values for this field
                    example: 0
              cols:
                type: string
                description: Cols of the field, this fields appear when key is NewUEDRevNotes
                example: 50
              rows:
                type: integer
