openapi: 3.2.0
info:
  title: Avetta Credit API
  version: '2026-05-08'
  license:
    name: Trade secret
    url: https://avetta.com
  description: 'Operations tagged Credit across 2 of this provider''s published API definitions: avetta-worker-v1.json, avetta-worker-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{environment}.avetta.com/api/v1
  variables:
    environment:
      default: worker
      enum:
      - worker
      - au-worker
security:
- ApiKeyAuth: []
tags:
- name: Credit
  description: The endpoints to credit events.
paths:
  /events/credit/{EvtID}:
    get:
      operationId: getCreditForm
      tags:
      - Credit
      summary: Return the credit form for the event
      description: This endpoint will return a list of fields, prereqs or items to be filled in order to credit the event
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/credit_components-parameters-evtIDParam'
      - $ref: '#/components/parameters/userIDParam'
      responses:
        '200':
          $ref: '#/components/responses/eventsCredit'
        '201':
          $ref: '#/components/responses/eventsCreditEquiv'
        '202':
          $ref: '#/components/responses/eventsCreditOptin'
        '203':
          $ref: '#/components/responses/badEventResults'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    post:
      operationId: creditEvent
      tags:
      - Credit
      summary: Credit requirements
      description: Credits the user for the requirement
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/credit_components-parameters-evtIDParam'
      - $ref: '#/components/parameters/userIDParam'
      - $ref: '#/components/parameters/srchIDParam'
      - $ref: '#/components/parameters/expireDateParam'
      - $ref: '#/components/parameters/datetimeParam'
      - $ref: '#/components/parameters/NewUEDRevNotesParam'
      - $ref: '#/components/parameters/UEDRevInstructorParam'
      - $ref: '#/components/parameters/resultParam'
      - $ref: '#/components/parameters/scoreParam'
      - $ref: '#/components/parameters/costParam'
      - $ref: '#/components/parameters/hoursParam'
      - $ref: '#/components/parameters/notesParam'
      - $ref: '#/components/parameters/customFieldParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulCredit'
        '201':
          $ref: '#/components/responses/badEventResults'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /events/credit/{EvtID}/files:
    post:
      operationId: uploadCreditFiles
      tags:
      - Credit
      summary: Upload a temporal file for credit
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/credit_components-parameters-evtIDParam'
      - $ref: '#/components/parameters/userIDParam'
      - $ref: '#/components/parameters/srchIDParam'
      requestBody:
        $ref: '#/components/requestBodies/formData'
      responses:
        '200':
          $ref: '#/components/responses/temporalDocumentSubmitted'
        '201':
          $ref: '#/components/responses/errorFile'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    get:
      operationId: getCreditFiles
      tags:
      - Credit
      summary: Return the temporal files for credit
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/credit_components-parameters-evtIDParam'
      - $ref: '#/components/parameters/userIDParam'
      - $ref: '#/components/parameters/srchIDParam'
      responses:
        '200':
          $ref: '#/components/responses/getTemporalFiles'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    delete:
      operationId: deleteCreditFiles
      tags:
      - Credit
      summary: Delete a temporal file for credit
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/credit_components-parameters-evtIDParam'
      - $ref: '#/components/parameters/parameters-docIDParam'
      - $ref: '#/components/parameters/filenameParam'
      - $ref: '#/components/parameters/srchIDParam'
      - $ref: '#/components/parameters/userIDParam'
      responses:
        '200':
          $ref: '#/components/responses/deleteDocument'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
components:
  parameters:
    srchIDParam:
      name: srch_id
      in: query
      description: Search ID
      required: true
      schema:
        type: integer
        format: int64
    NewUEDRevNotesParam:
      name: NewUEDRevNotes
      in: query
      description: Review notes
      required: false
      schema:
        type: string
    credit_components-parameters-evtIDParam:
      name: EvtID
      in: path
      description: Event ID
      required: true
      schema:
        type: integer
        format: int64
    expireDateParam:
      name: expiredate
      in: query
      description: Expire date could be required or not
      required: false
      schema:
        type: string
        format: date
    costParam:
      name: cost
      in: query
      description: Cost of the requirement
      required: false
      schema:
        type: number
        format: number
    customFieldParam:
      name: customField
      in: query
      description: Additional fields configured for the requirement
      required: false
      schema:
        type: string
    filenameParam:
      name: filename
      in: query
      description: The file name of the file to be deleted
      required: false
      schema:
        type: string
    userIDParam:
      name: user_id
      in: query
      description: User ID
      required: true
      schema:
        type: integer
        format: int64
    notesParam:
      name: notes
      in: query
      description: Aditional notes of the requirement
      required: false
      schema:
        type: string
    UEDRevInstructorParam:
      name: UEDRevInstructor
      in: query
      description: Instructor, it could be required or not depending on the requirement configuration
      required: false
      schema:
        type: string
    parameters-docIDParam:
      name: doc_id
      in: query
      description: The DocUID of the file to be deleted
      required: false
      schema:
        type: integer
        format: int64
    resultParam:
      name: result
      in: query
      description: Result of the requirement (201 - Passed, 202 - Failed)
      required: false
      schema:
        type: integer
        format: int64
        enum:
        - 201
        - 202
    datetimeParam:
      name: datetime
      in: query
      description: Date and time of the event, it could be required or not
      required: false
      schema:
        type: string
        format: date-time
    hoursParam:
      name: hours
      in: query
      description: Duration of the requirement
      required: false
      schema:
        type: number
        format: number
    scoreParam:
      name: score
      in: query
      description: Score of the requirement (0 - 100)
      required: false
      schema:
        type: number
        format: number
  examples:
    deleteFile:
      summary: Delete file
      value:
        stats:
          command: Auth
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
