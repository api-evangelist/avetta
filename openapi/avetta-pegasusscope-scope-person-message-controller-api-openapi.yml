openapi: 3.2.0
info:
  title: Avetta Pegasus Scope Scope Person Message Controller API
  version: APSO-1355
  x-logo:
    url: avetta_logo.png
  description: 'Operations tagged pegasusScope_scope-person-message-controller across 2 of this provider''s published API definitions: avetta-pegasus-dist.json, avetta-pegasus-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: EPE (Test Environment)
  url: https://epe-onsitetrackeasy.com.au/onsite-rest
- description: Production
  url: https://secure.onsitetrackeasy.com.au/onsite-rest
tags:
- name: pegasusScope_scope-person-message-controller
  x-displayName: scope-person-message-controller
paths:
  /api/v1/scope/{scopeId}/person/{personId}/message:
    get:
      tags:
      - pegasusScope_scope-person-message-controller
      operationId: getPersonMessages
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: currentOnly
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/3.29.14_CardholderMessageResource'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
      security:
      - 3.29.14_security_auth: []
        3.29.14_security_apikey: []
      summary: Get person messages
      x-summary-source: derived
    put:
      tags:
      - pegasusScope_scope-person-message-controller
      operationId: editMessage
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3.29.14_UpdateMessageResource'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_CardholderMessageResource'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
      security:
      - 3.29.14_security_auth: []
        3.29.14_security_apikey: []
      summary: Edit message
      x-summary-source: derived
    post:
      tags:
      - pegasusScope_scope-person-message-controller
      operationId: addMessage
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3.29.14_UpdateMessageResource'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_CardholderMessageResource'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
      security:
      - 3.29.14_security_auth: []
        3.29.14_security_apikey: []
      summary: Add message
      x-summary-source: derived
    servers:
    - description: EPE (Test Environment)
      url: https://epe-onsitetrackeasy.com.au/onsite-rest
    - description: Production
      url: https://secure.onsitetrackeasy.com.au/onsite-rest
components:
  schemas:
    3.29.14_StatusType:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        reasonPhrase:
          type: string
    3.29.14_ScopeDetailResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        timezone:
          type: string
        fatigueLimit:
          type: integer
          format: int32
        siteId:
          type: integer
          format: int32
        realmId:
          type: integer
          format: int32
        concoId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - SYSTEM
          - REALM
          - SITE
          - LOCATION
          - CONCO_WEB
          - EMPLOYEE
          - UNKNOWN
        typeDisplayName:
          type: string
        ownerName:
          type: string
        connectAccountId:
          type: string
        connectClient:
          type: boolean
        parentId:
          type: integer
          format: int32
        realm:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        site:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        conco:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        topLevel:
          type: boolean
    3.29.14_KeyedIntegerResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    3.29.14_FullErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
        errorDetail:
          type: string
    3.29.14_CardholderMessageResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        message:
          type: string
        start:
          type: string
        finish:
          type: string
        createdBy:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        personId:
          type: integer
          format: int32
        scope:
          $ref: '#/components/schemas/3.29.14_ScopeDetailResource'
    3.29.14_ErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
    3.29.14_UpdateMessageResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        personId:
          type: integer
          format: int32
        scope:
          $ref: '#/components/schemas/3.29.14_ScopeDetailResource'
        message:
          type: string
        start:
          type: string
        finish:
          type: string
    3.29.14_Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        parameters:
          type: object
          additionalProperties:
            type: object
        detail:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/3.29.14_StatusType'
  securitySchemes:
    3.29.14_security_auth:
      type: oauth2
      scheme: Bearer
      flows:
        authorizationCode:
          authorizationUrl: https://login.poweredbyonsite.com/cas/oidc/authorize
          tokenUrl: https://login.poweredbyonsite.com/cas/oidc/accessToken
          scopes:
            pegasus: Pegasus Authentication Scope
    3.29.14_security_apikey:
      type: apiKey
      name: api_key
      in: header
x-refined-from:
- avetta-pegasus-dist.json
- avetta-pegasus-openapi.yml
x-tagGroups:
- name: Compliance
  tags:
  - Authentication
  - Compliance
- name: Account
  tags:
  - Account
- name: Worksite Safety
  tags:
  - Worksite-Safety
- name: Deprecated Endpoints
  tags:
  - Deprecated Endpoints
  - Error Handling
