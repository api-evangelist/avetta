                type: string
                description: Title of the field
                example: Login ID
              key:
                type: string
                description: Key of the field
                example: UsrLoginID
              values:
                type: array
                description: List of values
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: ID of the value
                      example: 0
                    value:
                      type: string
                      description: Value of the value
                      example: N/A
