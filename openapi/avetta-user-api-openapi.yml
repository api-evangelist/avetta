          items:
            type: object
            properties:
              id:
                type: integer
                description: ID of the group
                example: 1234
              con_id:
                type: string
                description: Code of the group
                example: '25001234'
              name:
                type: string
                description: Title of the group, as stored on the group
                example: Amazon UBS2
