openapi: 3.2.0
info:
  title: Avetta User API
  license:
    name: Trade secret
    url: https://avetta.com
  version: '1.0'
  description: 'Operations tagged User across 4 of this provider''s published API definitions: avetta-worker-v1.json, avetta-worker-v2.json, avetta-worker-v1-openapi.yml, avetta-worker-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{environment}.avetta.com/api/v1
  variables:
    environment:
      default: worker
      enum:
      - worker
      - au-worker
- url: https://{environment}.avetta.com/api/v2
  variables:
    environment:
      default: worker
      enum:
      - worker
      - worker-au
security:
- ApiKeyAuth: []
tags:
- name: User
  description: The User API allows you to retrieve user detail information.
paths:
  /user/{id}:
    get:
      operationId: getUser
      tags:
      - User
      summary: User Details
      description: Composite endpoint for user data
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-idParam'
      - $ref: '#/components/parameters/showAllConnectionsParam'
      - $ref: '#/components/parameters/connectionIdParam'
      - $ref: '#/components/parameters/roleIdParam'
      - $ref: '#/components/parameters/todoParam'
      - $ref: '#/components/parameters/allVariancesParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulUser'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    post:
      operationId: postUser
      tags:
      - User
      summary: User Save
      description: Save the user information in the profile form
      security:
      - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/jsonProfile'
      parameters:
      - $ref: '#/components/parameters/parameters-idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulProfilePost'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/profile/{id}:
    get:
      operationId: getProfile
      tags:
      - User
      summary: Profile Details
      description: Profile form information
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulProfile'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorForbidden'
    post:
      operationId: postProfile
      tags:
      - User
      summary: Profile Save
      description: Save the logged user information in the profile form
      security:
      - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/jsonProfile'
      parameters:
      - $ref: '#/components/parameters/parameters-idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulProfilePost'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/photo/{id}:
    get:
      operationId: getPhoto
      tags:
      - User
      summary: User Photo
      description: Get the user photo
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulPhoto'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorForbidden'
    post:
      operationId: postPhoto
      tags:
      - User
      summary: User Photo Save
      description: Save the user photo
      security:
      - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/requestBody-formData'
      parameters:
      - $ref: '#/components/parameters/parameters-idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulSavePhoto'
        '201':
          $ref: '#/components/responses/errorFile'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorForbidden'
    delete:
      operationId: deletePhoto
      tags:
      - User
      summary: User Photo Delete
      description: Delete the user photo
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulDeletePhoto'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorForbidden'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/list/{id}:
    get:
      operationId: getUserListCheckInOut
      tags:
      - User
      summary: User List
      description: Get List check in/out
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/requiredSiteParam'
      responses:
        '200':
          $ref: '#/components/responses/ListCheckIn'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/checkin/{id}:
    post:
      operationId: postCheckin
      tags:
      - User
      summary: Check in
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/requiredSiteParam'
      - $ref: '#/components/parameters/user_components-parameters-flagParam'
      - $ref: '#/components/parameters/parameters-notesParam'
      - $ref: '#/components/parameters/timeinParam'
      responses:
        '200':
          $ref: '#/components/responses/PostCheckin'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorMessages'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/checkout/{id}:
    post:
      operationId: postCheckOut
      tags:
      - User
      summary: Check out
      description: Check out. Closes the user's currently open time card for the given site (the most recent one with no checkout time). The `id` path parameter is the user being checked out; `site` (required) is the site/location the checkout applies to. Use `card_id` to target a specific time card explicitly instead of relying on the automatic lookup.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/requiredSiteParam'
      - $ref: '#/components/parameters/cardIdParam'
      - $ref: '#/components/parameters/parameters-notesParam'
      - $ref: '#/components/parameters/timeoutParam'
      responses:
        '200':
          $ref: '#/components/responses/PostCheckOut'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorMessages'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/{id}/checkin/status/{grpID}:
    get:
      operationId: getCheckInStatus
      tags:
      - User
      summary: Check in status
      description: Return the status of the check in for a user in a group
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/groupParam'
      responses:
        '200':
          $ref: '#/components/responses/GetCheckInStatus'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorMessages'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/{id}/checkin/listsites:
    get:
      operationId: getCheckInListSites
      tags:
      - User
      summary: Check in list sites
      description: Return the list of sites where the user can check in
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          $ref: '#/components/responses/GetCheckInListSites'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorMessages'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/{id}/timecard:
    get:
      operationId: getTimeCard
      tags:
      - User
      summary: History of check in/out
      description: Return the history details of the check in and check out for a user
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/components-parameters-siteParam'
      - $ref: '#/components/parameters/startDateParam'
      - $ref: '#/components/parameters/endDateParam'
      - $ref: '#/components/parameters/user_components-parameters-sortParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/startParam'
      responses:
        '200':
          $ref: '#/components/responses/responses-successfulTimeCard'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/connections:
    get:
      operationId: getUserConnections
      tags:
      - User
      summary: Worker connections
      description: Return the valid connections of the authenticated worker, so the mobile application can present a site selector. The list covers every approved, non deleted, non invalid connection to an active group, which includes the worker's own primary company as well as their site assignments. The worker is taken from the authorization token, there is no user path parameter and no other user can be requested.
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GetConnections'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/groupselector:
    get:
      operationId: getGroupSelector
      tags:
      - User
      summary: Group Selector
      description: Get the list of groups the user is available to select from
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/groupselector_components-parameters-searchParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulGroupSelector'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    post:
      operationId: postGroupSelector
      tags:
      - User
      summary: Set Viewing Group
      description: Set the viewing group for the user session
      security:
      - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/jsonGroupSelector'
      responses:
        '204':
          description: '#/components/responses/groupSelectorResponses'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user/groupselector/{grp_id}:
    get:
      operationId: getGroupSelectorByID
      tags:
      - User
      summary: Group Selector by ID
      description: Get the list of children groups of a specific group ID
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/grpIDParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulGroupSelector'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /user:
    get:
      operationId: getUser
      tags:
      - User
      summary: User Details (v2)
      description: Composite endpoint for the currently authenticated user's data (profile, account, roles, requirements, history, permissions, security, custom fields, agreements, variances and connections)
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-allConnectionsParam'
      - $ref: '#/components/parameters/connectionIdParam'
      - $ref: '#/components/parameters/roleIdParam'
      - $ref: '#/components/parameters/todoParam'
      - $ref: '#/components/parameters/parameters-allVariancesParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulUser_2'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorForbidden'
    post:
      operationId: postUser
      tags:
      - User
      summary: User Save (v2)
      description: Save the user information in the profile form
      security:
      - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/jsonProfile'
      responses:
        '200':
          $ref: '#/components/responses/successfulProfilePost'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /user/profile:
    get:
      operationId: getUserProfile
      tags:
      - User
      summary: Profile Details (v2)
      description: Profile form information
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/successfulProfile'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
      x-operation-id-source: normalized
      x-operation-id-original: getProfile
    post:
      operationId: postUserProfile
      tags:
      - User
      summary: Profile Save (v2)
      description: Save the logged user information in the profile form
      security:
      - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/jsonProfile'
      responses:
        '200':
          $ref: '#/components/responses/successfulProfilePost'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
      x-operation-id-source: normalized
      x-operation-id-original: postProfile
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /user/photo:
    post:
      operationId: postUserPhoto
      tags:
      - User
      summary: User Photo Save (v2)
      description: Save the user photo. Send the file as multipart form data (`file`), or as a JSON body with the base64-encoded image in `data`. The image is resized to at most 400x400 and stored as the user's profile photo, replacing any existing one.
      security:
      - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/photoUpload'
      responses:
        '200':
          $ref: '#/components/responses/successfulSavePhoto'
        '400':
          $ref: '#/components/responses/errorFile'
        '401':
          $ref: '#/components/responses/errorSecurity'
      x-operation-id-source: normalized
      x-operation-id-original: postPhoto
    delete:
      operationId: deleteUserPhoto
      tags:
      - User
      summary: User Photo Delete (v2)
      description: Delete the user photo. Returns 404 when there is no photo on file.
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/successfulDeletePhoto'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
      x-operation-id-source: normalized
      x-operation-id-original: deletePhoto
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /user/checkin:
    post:
      operationId: postUserCheckin
      tags:
      - User
      summary: Self check in (v2)
      description: 'Checks the currently authenticated user in at the given site. This is self-service only: the user being checked in is always the caller, never another user. The check in is allowed only when the site (or one of its parent groups) has worker check in/out enabled, the site''s company has Time Card enabled, the site is active, and the caller has a Green compliance status at the site. The caller cannot have another open check in at any site; check out first. The new time card is recorded with a Green flag.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/requiredSiteParam'
      - $ref: '#/components/parameters/notesParam'
      - $ref: '#/components/parameters/timeinParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulCheckInOut'
        '400':
          $ref: '#/components/responses/errorMessages_2'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorMessages_2'
      x-operation-id-source: normalized
      x-operation-id-original: postCheckin
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /user/checkout:
    post:
      operationId: postCheckout
      tags:
      - User
      summary: Self check out (v2)
      description: 'Checks the currently authenticated user out of the given site. This is self-service only: the time card closed always belongs to the caller. Allowed only when worker check in/out and Time Card are enabled for the site. Closes the caller''s most recent open time card at `site`, or the time card given by `card_id`, which must belong to the caller and to `site`.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/requiredSiteParam'
      - $ref: '#/components/parameters/cardIdParam'
      - $ref: '#/components/parameters/notesParam'
      - $ref: '#/components/parameters/timeoutParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulCheckInOut'
        '400':
          $ref: '#/components/responses/errorMessages_2'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorMessages_2'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /user/timecard:
    get:
      operationId: getUserTimecard
      tags:
      - User
      summary: History of check in/out(v2)
      description: Return the history details of the check in and check out for the currently authenticated user
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/siteParam'
      - $ref: '#/components/parameters/startDateParam_2'
      - $ref: '#/components/parameters/endDateParam_2'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/startParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulTimeCard'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
      x-operation-id-source: normalized
      x-operation-id-original: getTimeCard
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /user/whoami:
    get:
      operationId: getWhoami
      tags:
      - User
      summary: Who am I (v2)
      description: Return the identity, account and token details of the currently authenticated user. Requires an access token in the API key header
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/successfulWhoami'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
components:
  examples:
    missingPermissionsOverSite:
      summary: 400 - Missing permissions over the site
      value:
        stats:
          command: User
          version: v1
          type: token
          msg: Missing
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        user:
          message: Missing permissions over the site
          status: null
          success: false
          code: 400
    errorSecurity:
      summary: Error security
      value:
        stats:
          command: Auth
          version: v1
          type: token
          msg: unauthorized
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        data:
          success: false
          code: 401
    forbidden:
      summary: 403 - Invalid security
      value:
        stats:
          command: User
          version: v1
          type: token
          msg: Bad
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        user:
          message: Invalid security
          status: Forbidden
          success: false
          code: 403
    successfulCheckOut:
      summary: 200 - Successful check out
      value:
        stats:
          command: User
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        user:
          status: Good
          message: null
          success: true
          code: 200
    extensionCheck:
      summary: Extension check error
      value:
        stats:
          command: Auth
          version: v1
          type: token
          msg: unauthorized
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        data:
          success: false
          code: 400
          status: Bad Request
          detail: UPLOADERROR.101
          message: The file extension is not allowed
          allowedExtensions:
          - t3
          - mid
          - zip
          - rtf
          - docx
          - tar
          - midi
          - tif
          - m4a
          - png
          - xps
          - xml
          - mp3
          - htm
          - gz
          - mp4
          - doc
          - tiff
          - jpeg
          - avi
          - mpeg
          - qst
          - txt
          - wmv
          - msg
          - xlsx
          - webp
