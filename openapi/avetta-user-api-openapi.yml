          type: array
          description: List of groups
          items:
            type: object
            properties:
              value:
                type: string
                description: Value of the group
                example: '{UsrFirstName} {UsrMiddleInitial} {UsrLastName}'
              name:
                type: string
                description: Name of the group
                example: name
              title:
                type: string
                description: Title of the group
                example: Name
