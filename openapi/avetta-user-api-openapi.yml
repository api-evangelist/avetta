      type: object
      format: object
      properties:
        fields:
          type: array
          description: List of fields
          items:
            type: object
            properties:
              group:
                type: string
                description: Group name
                example: name
              typename:
                type: string
                description: Type name
                example: textfield
              type:
                type: string
                description: Type of the field
                example: 501
              readonly:
                type: boolean
                description: Read only field
                example: true
                enum:
                - true
                - false
              validation:
                type: object
                description: Validation of the field
                properties:
                  required:
                    type: boolean
                    description: Required field
                    example: true
                    enum:
                    - true
                    - false
                  maxvalue:
                    type: string
                    description: Maximum value
                    example: 100
                  maxlength:
                    type: string
                    description: Maximum length
                    example: 128
                  minlength:
                    type: string
                    description: Minimum length
                    example: 1
