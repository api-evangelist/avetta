components:
  schemas:
    3.29.14_UploadPhotoResource:
      type: object
      properties:
        personId:
          type: integer
          format: int32
        uploadFileId:
          type: integer
          format: int32
        uploadType:
          type: string
          enum:
          - PHOTO
          - STICKER_PIC_PORTRAIT
          - STICKER_PIC_LANDSCAPE
          - PENDING
          - ARCHIVE
        uploadTime:
          type: string
        fileName:
          type: string
        photoLink:
          type: string
        userId:
          type: integer
          format: int32
        active:
          type: boolean
        id:
          type: integer
          format: int32
    3.29.14_StatusType:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        reasonPhrase:
          type: string
    3.29.14_StringResource:
      type: object
      properties:
        value:
          type: string
    3.29.14_FullErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
        errorDetail:
          type: string
    3.29.14_ErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
    3.29.14_Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        parameters:
          type: object
          additionalProperties:
            type: object
        detail:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/3.29.14_StatusType'
  securitySchemes:
    3.29.14_security_auth:
      type: oauth2
      scheme: Bearer
      flows:
        authorizationCode:
          authorizationUrl: https://login.poweredbyonsite.com/cas/oidc/authorize
          tokenUrl: https://login.poweredbyonsite.com/cas/oidc/accessToken
          scopes:
            pegasus: Pegasus Authentication Scope
    3.29.14_security_apikey:
      type: apiKey
      name: api_key
      in: header
