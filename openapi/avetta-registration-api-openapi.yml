openapi: 3.2.0
info:
  title: Avetta Registration API
  version: '2026-05-08'
  license:
    name: Trade secret
    url: https://avetta.com
  description: 'Operations tagged Registration across 2 of this provider''s published API definitions: avetta-worker-v1.json, avetta-worker-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{environment}.avetta.com/api/v1
  variables:
    environment:
      default: worker
      enum:
      - worker
      - au-worker
security:
- ApiKeyAuth: []
tags:
- name: Registration
  description: The Registration API allows you to register a new account or user.
paths:
  /registration/pending-requests:
    get:
      operationId: pending-requests
      tags:
      - Registration
      summary: List of pending registration requests
      description: Returns a list of all workers that have pending registration requests
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/parameters-sortParam'
      - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          $ref: '#/components/responses/pendingRequests'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /registration/pending-requests/count:
    get:
      operationId: pending-requests/count
      tags:
      - Registration
      summary: Total count of pending registration requests
      description: Returns the total number of pending requests
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/pendingRequestsCount'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /registration/pending-requests/{id}:
    get:
      operationId: pending-requests/Details
      tags:
      - Registration
      summary: Details of the pending registration request, user information, sites and roles
      description: Returns the details of a pending registration request
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          $ref: '#/components/responses/pendingRequestsDetails'
        '201':
          $ref: '#/components/responses/invalidDetailsResponse'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /registration/pending-requests/{id}/approve:
    post:
      operationId: pendingRequestsApprove
      tags:
      - Registration
      summary: Approves a registration request
      description: Approves a pending registration request based on the request ID
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          $ref: '#/components/responses/approveSuccessResponse'
        '204':
          $ref: '#/components/responses/approveFailedResponse'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /registration/pending-requests/{id}/deny:
    post:
      operationId: pendingRequestsDeny
      tags:
      - Registration
      summary: Denies a registration request
      description: Denies a pending registration request based on the request ID
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          $ref: '#/components/responses/denySuccessResponse'
        '204':
          $ref: '#/components/responses/denyFailedResponse'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /registration/user:
    post:
      operationId: registrationUser
      tags:
      - Registration
      summary: The Registration API allows you to register a new user
      description: This endpoint allows you to register a new user.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/invitationCodeParam'
      requestBody:
        $ref: '#/components/requestBodies/userData'
      responses:
        '200':
          $ref: '#/components/responses/successfulRegister'
        '201':
          $ref: '#/components/responses/badRequestRegisterUser'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /registration/account:
    post:
      operationId: registrationAccount
      tags:
      - Registration
      summary: Given an invite code, provides a company it is associated with
      description: On user registration, takes the invite code and returns the company it is associated with
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/invitationCodeParam'
      responses:
        '200':
          $ref: '#/components/responses/responses-successfulRegister'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '423':
          $ref: '#/components/responses/badRequestRegisterAccount'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
components:
  parameters:
    invitationCodeParam:
      name: invitecode
      in: query
      description: Invitation code
      required: true
      schema:
        type: string
        format: string
    IDParam:
      name: id
      in: path
      description: ID of pending registration request
      required: true
      schema:
        type: integer
    parameters-sortParam:
      name: sort
      in: query
      description: Name of field to sort by
      required: false
      schema:
        type: string
        enum:
        - first
        - last
        - date
    limitParam:
      name: limit
      in: query
      description: Maximum number of records to return
      required: false
      schema:
        type: integer
        default: 3000
    searchParam:
      name: search
      in: query
      description: Search term - check for the code and title
      required: false
      schema:
        type: string
    startParam:
      name: start
      in: query
      description: Offset of the first record to return
      required: false
      schema:
        type: integer
        default: 1
  responses:
    approveSuccessResponse:
      description: Registration request successfully approved
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              message:
                $ref: '#/components/schemas/messageSchema'
          examples:
            success:
              $ref: '#/components/examples/approveSuccess'
    denySuccessResponse:
      description: Registration request successfully denied
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              message:
                $ref: '#/components/schemas/messageSchema'
          examples:
            success:
              $ref: '#/components/examples/denySuccess'
    responses-successfulRegister:
      description: successful registration of the account
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              registration_account:
                $ref: '#/components/schemas/registrationAccountSchema'
          examples:
            fullRegistrationAccount:
              $ref: '#/components/examples/fullRegistrationAccount'
    pendingRequests:
      description: Successful - List of pending registration requests
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              requests:
                type: array
                items:
                  $ref: '#/components/schemas/requestsSchema'
    denyFailedResponse:
      description: Registration request couldn't be denied
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              message:
                $ref: '#/components/schemas/messageSchema'
          examples:
            failed:
              $ref: '#/components/examples/denyFailed'
    approveFailedResponse:
      description: Registration request failed to approve
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              message:
                $ref: '#/components/schemas/messageSchema'
          examples:
            failed:
              $ref: '#/components/examples/approveFailed'
    pendingRequestsDetails:
      description: Successful - Details of a pending registration for the provided user
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              requests:
                type: array
                items:
                  $ref: '#/components/schemas/requestDetailsSchema'
    badRequestRegisterUser:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              registration_user:
                $ref: '#/components/schemas/messageSchema'
          examples:
            missingInvateCode:
              $ref: '#/components/examples/missingInviteCode'
            noDataReceived:
              $ref: '#/components/examples/noDataReceived'
            loginIDRequired:
              $ref: '#/components/examples/loginIDRequired'
            passwordRequired:
              $ref: '#/components/examples/passwordRequired'
            passwordLength:
              $ref: '#/components/examples/passwordLength'
            firstNameRequired:
              $ref: '#/components/examples/firstNameRequired'
            lastNameRequired:
              $ref: '#/components/examples/lastNameRequired'
            emailRequired:
              $ref: '#/components/examples/emailRequired'
            emailInvalid:
              $ref: '#/components/examples/emailInvalid'
            accountIDRequired:
              $ref: '#/components/examples/accountIDRequired'
            invalidInviteCode:
              $ref: '#/components/examples/invalidInviteCode'
            loginAlready:
              $ref: '#/components/examples/loginAlready'
            accountPendingStatus:
              $ref: '#/components/examples/accountPendingStatus'
            failedRegistration:
              $ref: '#/components/examples/failedRegistration'
    invalidDetailsResponse:
      description: Invalid detail response
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              message:
                $ref: '#/components/schemas/messageSchema'
          examples:
            noPermission:
              $ref: '#/components/examples/noPermission'
            invalidPendingRegistrationRequestID:
              $ref: '#/components/examples/invalidPendingRegistrationRequestID'
            isNotPendingRegistrationRequest:
              $ref: '#/components/examples/isNotPendingRegistrationRequest'
    successfulRegister:
      description: Document marked as complete
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              registration_user:
                $ref: '#/components/schemas/registrationUserSchema'
          examples:
            fullRegistrationUser:
              $ref: '#/components/examples/fullRegistrationUser'
    pendingRequestsCount:
      description: Successful - Total count of pending registration requests
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchemaNoCount'
              requests:
                type: integer
                description: Total count of pending requests
                example: 5
    errorSecurity:
      description: Error while checking security
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              data:
                $ref: '#/components/schemas/messageSchema'
          examples:
            errorSecurity:
              $ref: '#/components/examples/errorSecurity'
    badRequestRegisterAccount:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              registration_user:
                $ref: '#/components/schemas/messageSchema'
          examples:
            missingInviteCodeAccount:
              $ref: '#/components/examples/missingInviteCodeAccount'
            invalidInviteCodeAccount:
              $ref: '#/components/examples/invalidInviteCodeAccount'
            olderInviteCodeAccount:
              $ref: '#/components/examples/olderInviteCodeAccount'
    parameterNotRecognized:
      description: Parameter not recognized
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              data:
                $ref: '#/components/schemas/messageSchema'
          examples:
            parameterNotRecognized:
              $ref: '#/components/examples/parameterNotRecognized'
  examples:
    invalidInviteCodeAccount:
      summary: 400 - Invalid Invite Code
      value:
        stats:
          command: Registration::Account
          version: v1
          type: token
          msg: Bad
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        registration_account:
          success: false
          message: Invalid Invite Code
          code: REG.101
    emailRequired:
