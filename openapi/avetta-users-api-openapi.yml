    upsertResponses:
      description: Successful insert or update of users
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                allOf:
                - $ref: '#/components/schemas/statsSchema'
                - type: object
                  properties:
                    fail:
                      type: integer
                      description: number of failed insert or update users
                      example: 2
                    success:
                      type: integer
                      description: number of successful insert or update users
                      example: 3
                    total:
                      type: integer
                      description: total number of registers processed
                      example: 5
              users:
                allOf:
                - $ref: '#/components/schemas/messageSchema'
                - type: object
                  properties:
                    detail:
                      type: object
                      properties:
                        fail:
                          type: array
                          description: list of users that failed to insert or update with the user id and the error messages
                          items:
                            type: object
                            properties:
                              UsrID:
                                type: integer
                                description: User ID processed
                                example: 22822
                              code:
                                type: integer
                                description: Code of the error for this particular user
                                example: 400
                              message:
                                type: array
                                description: Message related to the failure of the insert or update of the user
                        success:
                          type: array
                          description: list of users that were successfully inserted or updated with the user id and the informative messages
                          items:
                            type: object
                            properties:
                              UsrID:
                                type: integer
                                description: User ID processed
                                example: 22822
                              code:
                                type: integer
                                description: Code of the success for this particular user
                                example: 200
                              message:
                                type: array
                                description: Message related to the validation of data during the insert or update of the user
