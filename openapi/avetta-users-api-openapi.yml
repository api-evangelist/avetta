    v2InvalidParameter:
      description: 'Invalid parameter value. v2 rejects invalid filters rather than ignoring them. Possible messages:

        `Invalid modified_after`, `Invalid flag`, `Invalid sort`, `Invalid account_con_id`,

        `Invalid connection_con_id`, `event_id is only supported on /users/credit`.

