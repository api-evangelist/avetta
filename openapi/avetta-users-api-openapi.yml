    bulkUsersUpsertSchema:
      type: array
      description: Array of users to be created or updated
      items:
        type: object
        format: object
        properties:
          id:
            type: integer
            description: User ID - if it exists it will update the user, if not it will create a new user
            example: 1235
          login_id:
            type: string
            description: User login id - if is a new user it is required
            example: jdoe
          first_name:
            type: string
            description: User first name - if is a new user it is required
            example: John
          middle_initial:
            type: string
            description: User middle initial
            example: M
          last_name:
            type: string
            description: User last name - if is a new user it is required
            example: Smith
          password:
            type: string
            description: User password - if is a new user it is required
            example: password!
          site:
            type: string
            description: Company site id - if is a new user it is required
            example: 26516
          email:
            type: string
            description: User email
            example: test@email.com
          address1:
            type: string
            description: User address line 1
            example: 45 Main St
          address2:
            type: string
            description: User address line 2
            example: Apt 2
          city:
            type: string
            description: User city name
            example: New York
          state:
            type: string
            description: User state name
            example: NY
          zipcode:
            type: string
            description: User zipcode number
            example: 10001
          country:
            type: string
            description: User country name - it could be the country id, code or the country name
            example: 1 / US / USA / United States
          mobile_phone:
            type: string
            description: User mobile phone number - it should be in the international format
            example: +1 123456789
          home_phone:
            type: string
            description: User home phone number - it should be in the international format
            example: +1 123456789
          work_phone:
            type: string
            description: User work phone number - it should be in the international format
            example: +1 123456789
          emergency_contact_name:
            type: string
            description: User emergency contact name
            example: Bob Smith
          emergency_contact_phone:
            type: string
            description: User emergency contact phone number - it should be in the international format
            example: +1 123456789
          birth_date:
            type: string
            description: User birth date - it should be in the format YYYY-MM-DD
            example: '1998-05-25'
          ssn:
            type: string
            description: User social security number - it should be in the format XXX-XX-XXXX / XXXXXXXXX
            example: 123-45-6789 / 123456789
          photo:
            type: string
            description: User photo - it should be in the format of a base64 string
            example: /9j/...
          hire_date:
            type: string
            description: User hire date - it should be in the format YYYY-MM-DD
            example: '2020-10-23'
          term_date:
            type: string
            description: User termination date - it should be in the format YYYY-MM-DD
            example: '2024-10-23'
          status:
            type: string
            description: User status - for new users it will be active
            example: active
            enum:
            - active
            - inactive
          locale:
            type: string
            description: User locale - it should be in the format of language-country - for new users it will be set as default if not provided
            example: en-us
          sap:
            type: string
            description: User SAP id
            example: 265813
          notes:
            type: string
            description: User notes
            example: User notes
          reset_password:
            type: boolean
            description: User reset password - if true it will check it to reset the user password
            example: true
            enum:
            - true
            - false
          password_never_expired:
            type: boolean
            description: User password never expired - if true it will check it to set the user password as never expired
            example: false
            enum:
            - true
            - false
          2fa:
            type: boolean
            description: User 2fa - if true it will check it to set the user as two factor authentication. Supplier admins and system admins may only enable MFA (true) on their own account; enabling it for another user via this endpoint returns 403. Disabling MFA (false) for another user requires the ST_USER (Workers) permission. While MFA is enabled, email and mobile_phone can only be added if not already set - an existing value cannot be changed by another user.
            example: false
            enum:
            - true
            - false
