    handleSaveResponseSchema:
      type: object
      format: object
      description: Envelope built by _UpsertUsers() around one or more HandleSave() results. The overall code/status only ever reflect 200 (all succeeded), 207 (mixed), or 400 (all failed) - per-item codes (e.g. 403) are only found inside detail.fail[].code.
      properties:
        status:
          type: string
          description: HTTP status text derived from the overall code
          example: Bad Request
          enum:
          - Good
          - Multi-Status
          - Bad Request
        success:
          type: boolean
          description: True when at least one user was saved successfully
        code:
          type: integer
          description: Overall response code - 200 if all succeeded, 207 if mixed, 400 if all failed
          enum:
          - 200
          - 207
          - 400
        message:
          type: string
          description: Only present when every user in the request failed to save
          example: Invalid request
        detail:
          type: object
          properties:
            success:
              type: array
              description: Users that were saved, with any non-fatal warning messages
              items:
                type: object
                properties:
                  UsrID:
                    type: integer
                    description: User ID processed
                    example: 189
                  code:
                    type: integer
                    description: Always 200 for entries in this array
                    example: 200
                  message:
                    type: array
                    description: Informative messages accumulated while saving the user (always an array, ends with 'User saved successfully')
                    items:
                      type: string
            fail:
              type: array
              description: Users that failed to save, with the validation or permission error message
              items:
                type: object
                properties:
                  UsrID:
                    type:
                    - integer
                    - 'null'
                    description: User ID processed, null when the user could not be identified/created
                    example: 189
                  code:
                    type: integer
                    description: Code of the specific error for this user (400 or 403)
                    example: 400
                  message:
                    description: Validation/permission error for this user. A plain string for most HandleSave() failures; an array only for the underlying-save-failed case (errors collected from MBOL::User::GetErrorMessages()).
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
