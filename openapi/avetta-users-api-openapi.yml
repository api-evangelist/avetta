openapi: 3.2.0
info:
  title: Avetta Users API
  license:
    name: Trade secret
    url: https://avetta.com
  version: '1.0'
  description: 'Operations tagged Users across 4 of this provider''s published API definitions: avetta-worker-v1.json, avetta-worker-v2.json, avetta-worker-v1-openapi.yml, avetta-worker-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{environment}.avetta.com/api/v1
  variables:
    environment:
      default: worker
      enum:
      - worker
      - au-worker
- url: https://{environment}.avetta.com/api/v2
  variables:
    environment:
      default: worker
      enum:
      - worker
      - worker-au
security:
- ApiKeyAuth: []
tags:
- name: Users
  description: The Users API allows you to retrieve all users information.
paths:
  /users/{id}:
    get:
      operationId: getUsers
      tags:
      - Users
      summary: List of users
      description: Returns a list of users that could be filtered by the given parameters
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/users_components-parameters-sortParam'
      - $ref: '#/components/parameters/users_components-parameters-searchParam-2'
      - $ref: '#/components/parameters/parameters-modifiedAfterParam'
      - $ref: '#/components/parameters/users_components-parameters-flagParam'
      - $ref: '#/components/parameters/searchTypeParam'
      - $ref: '#/components/parameters/users_components-parameters-extraParam'
      - $ref: '#/components/parameters/components-parameters-roleIDParam'
      - $ref: '#/components/parameters/components-parameters-showInactiveParam'
      - $ref: '#/components/parameters/showRemovedParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/accountConIDParam'
      - $ref: '#/components/parameters/users_components-parameters-siteIDParam'
      - $ref: '#/components/parameters/allusersParam'
      - $ref: '#/components/parameters/parameters-connectionIDParam'
      - $ref: '#/components/parameters/connectionConIDParam'
      - $ref: '#/components/parameters/showAllConnectionsParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulReport'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    post:
      operationId: postUsers
      tags:
      - Users
      summary: Insert or Update a user
      description: Insert or update a user or a list of users
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      requestBody:
        $ref: '#/components/requestBodies/jsonUsers'
      responses:
        '200':
          $ref: '#/components/responses/upsertResponses'
        '201':
          $ref: '#/components/responses/handleSaveMessages'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /users/fields:
    get:
      operationId: getUsersFields
      tags:
      - Users
      summary: List of users fields
      description: Returns a list of fields for creating a new user
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/fieldsUsers'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorForbidden'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /users/{id}/fields:
    get:
      operationId: getUsersFieldsID
      tags:
      - Users
      summary: List of users fields by id
      description: Returns a list of fields for a user by id for edit or update
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          $ref: '#/components/responses/fieldsUsers'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/errorForbidden'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /users/credit:
    get:
      operationId: getUsersCredit
      tags:
      - Users
      summary: List of users (Credit)
      description: Returns a list of users that could be credited for a requirement
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/users_components-parameters-sortParam'
      - $ref: '#/components/parameters/users_components-parameters-searchParam-2'
      - $ref: '#/components/parameters/parameters-modifiedAfterParam'
      - $ref: '#/components/parameters/users_components-parameters-flagParam'
      - $ref: '#/components/parameters/searchTypeParam'
      - $ref: '#/components/parameters/components-parameters-roleIDParam'
      - $ref: '#/components/parameters/components-parameters-showInactiveParam'
      - $ref: '#/components/parameters/showRemovedParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/accountConIDParam'
      - $ref: '#/components/parameters/users_components-parameters-siteIDParam'
      - $ref: '#/components/parameters/allusersParam'
      - $ref: '#/components/parameters/parameters-connectionIDParam'
      - $ref: '#/components/parameters/connectionConIDParam'
      - $ref: '#/components/parameters/eventParam'
      responses:
        '200':
          $ref: '#/components/responses/successful'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /users/manage:
    get:
      operationId: getUsersManage
      tags:
      - Users
      summary: List of users (Manage)
      description: Returns a list of users that can be managed
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/users_components-parameters-sortParam'
      - $ref: '#/components/parameters/users_components-parameters-searchParam-2'
      - $ref: '#/components/parameters/users_components-parameters-siteIDParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/parameters-connectionIDParam'
      - $ref: '#/components/parameters/users_components-parameters-flagParam'
      - $ref: '#/components/parameters/components-parameters-roleIDParam'
      - $ref: '#/components/parameters/components-parameters-showInactiveParam'
      - $ref: '#/components/parameters/showRemovedParam'
      - $ref: '#/components/parameters/parameters-modifiedAfterParam'
      responses:
        '200':
          $ref: '#/components/responses/successful'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /users/manage/{id}:
    get:
      operationId: getUsersManageID
      tags:
      - Users
      summary: List of users (Manage by ID)
      description: Returns a list of users that can be managed by ID
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          $ref: '#/components/responses/successful'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /users/variance:
    get:
      operationId: getUsersVariance
      tags:
      - Users
      summary: List of users (Variance)
      description: Returns a list of users that can be given a variance
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/users_components-parameters-sortParam'
      - $ref: '#/components/parameters/users_components-parameters-searchParam-2'
      - $ref: '#/components/parameters/parameters-modifiedAfterParam'
      - $ref: '#/components/parameters/users_components-parameters-flagParam'
      - $ref: '#/components/parameters/searchTypeParam'
      - $ref: '#/components/parameters/components-parameters-roleIDParam'
      - $ref: '#/components/parameters/components-parameters-showInactiveParam'
      - $ref: '#/components/parameters/showRemovedParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/accountConIDParam'
      - $ref: '#/components/parameters/users_components-parameters-siteIDParam'
      - $ref: '#/components/parameters/allusersParam'
      - $ref: '#/components/parameters/parameters-connectionIDParam'
      - $ref: '#/components/parameters/connectionConIDParam'
      responses:
        '200':
          $ref: '#/components/responses/successful'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /users:
    get:
      operationId: v2GetUsers
      tags:
      - Users
      summary: List all users (v2)
      description: 'Returns all users attached to the API key regardless of training status.

        Requires read-only (`ST_REPORT`) access. Supports pagination via `start` / `limit`.


        **v2 differences from v1**

        - All users are returned by default, not just trained workers.

        - `extra=checkin` populates `last_checkin_date` and `last_checkout_date` as opt-in extras; they are omitted otherwise.

        - `extra=status` populates `flag` and `flag_forced` as opt-in extras; they are omitted otherwise.

        - `extra=external` populates the `external_id` and `account.external_id` arrays as an opt-in extra; they are omitted otherwise.

        - `extra=variances` populates the `variances` array as an opt-in extra; it is omitted otherwise.

        - `all_variances=1` includes all variances(past, current, and future) when `extra=variances` is requested.

        - The `allusers` parameter is removed.

        - `modifiedAfter` renamed to `modified_after`.

        - `showInactive` renamed to `show_inactive`.

        - `showRemoved` renamed to `show_removed`.

        - `showAllConnections` renamed to `all_connections`.

        - An invalid `modified_after`, `flag`, `sort`, `account_con_id`, or `connection_con_id` returns 400 instead of being ignored.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParamV2'
      - $ref: '#/components/parameters/v2SortParam'
      - $ref: '#/components/parameters/searchParam'
      - $ref: '#/components/parameters/modifiedAfterParam'
      - $ref: '#/components/parameters/v2FlagParam'
      - $ref: '#/components/parameters/searchTypeParam'
      - $ref: '#/components/parameters/v2ExtraParam'
      - $ref: '#/components/parameters/allVariancesParam'
      - $ref: '#/components/parameters/roleIDParam'
      - $ref: '#/components/parameters/showInactiveParam'
      - $ref: '#/components/parameters/showRemovedParam_2'
      - $ref: '#/components/parameters/accountIDParam'
      - $ref: '#/components/parameters/accountConIDParam'
      - $ref: '#/components/parameters/siteIDParam'
      - $ref: '#/components/parameters/connectionIDParam'
      - $ref: '#/components/parameters/connectionConIDParam'
      - $ref: '#/components/parameters/allConnectionsParam'
      responses:
        '200':
          $ref: '#/components/responses/v2Successful'
        '400':
          $ref: '#/components/responses/v2InvalidParameter'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/v2Forbidden'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /users/{id}/checkin/{group}:
    post:
      operationId: v2PostUsersIDCheckinGroup
      tags:
      - Users
      summary: Check a worker in at a group (v2)
      description: 'Lets an admin check worker `id` in at `group`, opening a time card. Requires read-only (`ST_REPORT`) access

        over `group`, and the caller must belong to the group''s company (sysadmins are exempt).


        The check in is allowed only when:

        - `group` is active and in the caller''s view (any level under the company, not only sites),

        - the group''s company has Time Card enabled,

        - the worker is active and has an approved, valid connection to `group`,

        - the worker has no other open check in at any group.


        Repeating a check in while the worker''s time card at `group` is still open returns `code` 204 with that

        time card''s `id` instead of opening a second one.


        Workers who are not Green at `group` may still be checked in, but `notes` is then required as the reason.

        The time card records the worker''s current compliance flag at `group`.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/groupPathParam'
      - $ref: '#/components/parameters/checkinNotesParam'
      - $ref: '#/components/parameters/timeinParam'
      responses:
        '200':
          $ref: '#/components/responses/v2CheckInOutSuccessful'
        '400':
          $ref: '#/components/responses/v2CheckInOutError'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/v2CheckInOutError'
        '404':
          $ref: '#/components/responses/v2CheckInOutError'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /users/{id}/checkout/{group}:
    post:
      operationId: v2PostUsersIDCheckoutGroup
      tags:
      - Users
      summary: Check a worker out of a group (v2)
      description: 'Lets an admin check worker `id` out of `group`, closing an open time card. Same access rules as check in:

        `ST_REPORT` over `group`, caller in the group''s company (or sysadmin), Time Card enabled for the company,

        and the worker holding an approved, valid connection to `group`.


        Closes the worker''s most recent open time card at `group`, or the one given by `card_id`, which must be open

        and belong to the worker and `group`; otherwise the response is 404. `time_out` cannot be earlier than the check in time.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/groupPathParam'
      - $ref: '#/components/parameters/cardIdParam'
      - $ref: '#/components/parameters/notesParam'
      - $ref: '#/components/parameters/timeoutParam'
      responses:
        '200':
          $ref: '#/components/responses/v2CheckInOutSuccessful'
        '400':
          $ref: '#/components/responses/v2CheckInOutError'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/v2CheckInOutError'
        '404':
          $ref: '#/components/responses/v2CheckInOutError'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /users/credit/{id}:
    get:
      operationId: v2GetUsersCreditID
      tags:
      - Users
      summary: Get a single creditable user by ID (v2)
      description: 'Returns the user record (scoped to the credit context) for the given `id`.

        Requires `ST_CREDIT` access. Typically used with `event_id` to verify a specific

        worker has the requirement on their plan.


        A lookup by ID returns the user regardless of status (inactive users included);

        deleted users are never returned and yield 404.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/roleIDParam'
      - $ref: '#/components/parameters/connectionIDParam'
      - $ref: '#/components/parameters/siteIDParam'
      - $ref: '#/components/parameters/v2EventParam'
      - $ref: '#/components/parameters/v2ExtraParam'
      - $ref: '#/components/parameters/allVariancesParam'
      responses:
        '200':
          $ref: '#/components/responses/v2Successful'
        '400':
          $ref: '#/components/responses/v2InvalidParameter'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/v2Forbidden'
        '404':
          $ref: '#/components/responses/v2NotFound'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
  /users/variance/{id}:
    get:
      operationId: v2GetUsersVarianceID
      tags:
      - Users
      summary: Get a single variance-eligible user by ID (v2)
      description: 'Returns the user record (scoped to the variance context) for the given `id`.

        Requires `ST_VARIANCE` access. Used to confirm a specific worker is in scope

        before creating or editing a variance.


        A lookup by ID returns the user regardless of status (inactive users included);

        deleted users are never returned and yield 404.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/roleIDParam'
      - $ref: '#/components/parameters/connectionIDParam'
      - $ref: '#/components/parameters/siteIDParam'
      - $ref: '#/components/parameters/v2ExtraParam'
      - $ref: '#/components/parameters/allVariancesParam'
      responses:
        '200':
          $ref: '#/components/responses/v2Successful'
        '400':
          $ref: '#/components/responses/v2InvalidParameter'
        '401':
          $ref: '#/components/responses/errorSecurity'
        '403':
          $ref: '#/components/responses/v2Forbidden'
        '404':
          $ref: '#/components/responses/v2NotFound'
    servers:
    - url: https://{environment}.avetta.com/api/v2
      variables:
        environment:
          default: worker
          enum:
          - worker
          - worker-au
components:
  schemas:
    schemas-userSchema:
      type: object
      format: object
      properties:
        id:
          type: integer
          description: User ID
          example: 1235
        con_id:
          type: integer
          description: User code from Connect
          example: 1568432
        first_name:
          type: string
          description: First name
          example: John
        last_name:
          type: string
          description: Last name
          example: Doe
        login_id:
          type: string
          description: User login id
          example: jdoe
        email:
          type: string
          description: User email
          example: test@test.com
        dob:
          type: string
          description: User date of birth
          example: '1998-08-10'
        sap_id:
          type: string
          description: User SAP id
          example: 265813
        cat_code:
          type: string
          description: User category code
          example: 15546
        phone:
          type: string
          description: User phone
          example: 123456789
        status:
          type: string
          description: User status
          example: active
          enum:
          - active
          - inactive
        flag:
          type: string
          description: User flag
          example: Green
          enum:
          - Green
          - Amber
          - Red
        flag_forced:
          type: boolean
          description: User flag forced - when a variance is applied to the user
          example: false
          enum:
          - true
          - false
        title:
          type: string
          description: User title
          example: Director of Software Development
        created_date:
          type: string
          description: Date user was created
          example: '2018-10-23 18:31:00'
        updated_date:
          type: string
          description: Last date user was updated
          example: '2017-15-05 16:41:00'
        last_checkin_date:
          type: string
          description: Last date user checked in to a site
          example: '2020-10-23 15:00:00'
        last_checkout_date:
          type: string
          description: Last date user checked out of a site
          example: '2020-10-23 19:45:00'
        badge_link:
          type: string
          description: User badge link
        external_id:
          type: array
          description: Contain the external id fields configured for the user
          items:
            type: object
            properties:
              ExtSource:
                type: object
                description: Name of the external source
                example: Connect
                properties:
                  ExtKey:
                    type: string
                    description: Key and value configured for the external source
                    example: 'SAP: 11035178'
        removed:
          type: integer
          description: Flag to show if the user was removed (0 - it wasn't, 1 - it was)
          example: 0
          enum:
          - 0
          - 1
        emergency_phone:
          type: string
          description: Phone number
          example: 555-555-5555
        emergency_contact_name:
          type: string
          description: Person to contact in case of emergency
          example: Bob Smith
        emergency_contact_relationship:
          type: string
          description: Relationship to the person to contact in case of emergency
          example: Parent
          enum:
          - Parent
          - Spouse
          - Child
          - Sibling
          - Friend
          - Relative
          - Other
        photo:
          type: object
          description: Show details of the user photo when requested in extras (photo)
          properties:
            name:
              type: string
              description: Name of the user profile picture file requested
              example: photo.jpg
            size:
              type: string
              description: Size of the profile picture file
              example: 123456789
            data:
              type: string
              description: Profile picture data
              example: data:image/jpeg;base64,/9j/...
        account:
          type: object
          description: Company the user belongs to or is connected to
          properties:
            id:
              type: integer
              description: Account ID
              example: 1235
            parent_id:
              type: integer
              description: Account parent ID
              example: 1235
            name:
              type: string
              description: Name of the company
              example: Avetta
            type:
              type: string
              description: Type of the company
              example: client
              enum:
              - Client
              - Supplier
              - Subcontractor
            con_id:
              type: integer
              description: Company code
              example: 235843
            con_flag:
              type: string
              description: Rating of the company connection (Green, Amber, Red)
              example: Red
              enum:
              - Green
              - Amber
              - Red
            external_id:
              type: array
              description: Contain the external id fields configured for the company
              items:
                type: object
                properties:
                  ExtSource:
                    type: object
                    description: Name of the external source
                    example: Connect
                    properties:
                      ExtKey:
                        type: string
                        description: Key and value configured for the external source
                        example: 'SAP: 11035178'
            permissions:
              type: array
              description: Permission the user has for the company
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Permission ID
                    example: 3012
                  name:
                    type: string
                    description: Permission name
                    example: Reports
        roles:
          type: array
          description: Roles assigned to the user
          items:
            type: object
            properties:
              id:
                type: integer
                description: Role ID
                example: 132
              code:
                type: string
                description: Role code
                example: 15621
              title:
                type: string
                description: Role title
                example: Electrician
              type:
                type: string
                description: Role type
                example: Function
                enum:
                - Function
                - Skill
              flag:
                type: string
                description: Flag of the role (Green, Amber, Red)
                example: Green
                enum:
                - Green
                - Amber
                - Red
              flag_forced:
                type: boolean
                description: Roles flag forced - when a variance is applied to the role
                example: false
                enum:
                - true
                - false
        requirements:
          type: array
          description: Requirements assigned to the user
          items:
            type: object
            properties:
              id:
                type: integer
                description: Requirement ID
                example: 15651
              code:
                type: string
                description: Requirement code
                example: 584135
              title:
                type: string
                description: Requirement title
                example: Driver's License
              date:
                type: string
                description: Due date of the requirement when it should be retaken
                example: '2024-05-15'
              flag:
                type: string
                description: Flag of the requirement (Green, Amber, Red)
                example: Green
                enum:
                - Green
                - Amber
                - Red
              flag_forced:
                type: boolean
                description: Requirement flag forced - when a variance is applied to the requirement
                example: false
                enum:
                - true
                - false
              completed_date:
                type: string
                description: Date when the requirement was completed
                example: '2022-10-08'
              requires_mfa:
                type: boolean
                description: Show if the requirement requires MFA
                example: false
                enum:
                - true
                - false
              status:
                type: string
                description: Status of the requirement
                example: Completed
                enum:
                - past due (if worker is past due on the requirement)
                - current (if worker is current and NOT due for requirement)
                - in review (if there is a review currently in process for the worker)
                - completed (if requirement is a take once and the worker has completed the training)
