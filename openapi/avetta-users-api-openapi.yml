    v2CheckInOutError:
      description: "Check in/out rejected. Possible messages by code:\n- 400: `User is not connected to the group` (check in only), `User is already checked in. Please check out before checking in to another site.` (open time card at a different group),\n  `Reason required to check in a non-compliant worker`, `time_out is before the check in time`\n- 403: no message (caller does not hold the route's security type), `Invalid security`, `Invalid security - group belongs to another company`, `Timecard not enabled`\n- 404: `Group not found`, `User not found` (check in only), `Failed to find check in`\n\nCheck out does not require the worker to be active or connected; it only needs an open time card for the worker at the group.\n"
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              error:
                $ref: '#/components/schemas/messageSchema'
          examples:
            reasonRequired:
              summary: Non-Green worker checked in without notes
              value:
                error:
                  success: false
                  code: 400
                  status: Bad Request
                  message: Reason required to check in a non-compliant worker
            otherCompany:
              summary: Caller does not belong to the group's company
              value:
                error:
                  success: false
                  code: 403
                  status: Forbidden
                  message: Invalid security - group belongs to another company
            noOpenCheckin:
              summary: No open time card for the worker at the group
              value:
                error:
                  success: false
                  code: 404
                  status: Not Found
                  message: Failed to find check in
    v2CheckInOutSuccessful:
      description: Successful - the time card was saved. `id` is the time card id (pass it as `card_id` to check out).
