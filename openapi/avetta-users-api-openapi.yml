    v2Successful:
      description: 'List of users. `last_checkin_date`, `last_checkout_date`, `flag`, `flag_forced`,

        `external_id`, and `account.external_id` are present only when requested through `extra`.

        `{id}` routes wrap the user in a single-element array.

        `dob` (`YYYY-MM-DD`) is `''''` unless the caller holds a worker-PII grant over a site the user is connected to.

        `account.con_flag` rolls up the account''s connection ratings (one distinct rating => that rating,

        mixed => Amber, none => None), scoped to the caller''s sites for client keys and to `connection_id` / `site_id` when supplied.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                allOf:
                - $ref: '#/components/schemas/statsSchema'
                - type: object
                  properties:
                    search_id:
                      type: integer
                      description: Search ID used to load extras; present only when `extra` is supplied
                      example: 231019020
              users:
                type: array
                items:
                  $ref: '#/components/schemas/userSchema'
          examples:
            successful:
              summary: Default user (no extras)
              value:
                users:
                - id: 1235
                  con_id: 1568432
                  first_name: John
                  last_name: Doe
                  login_id: jdoe
                  email: test@test.com
                  dob: '1998-05-25'
                  sap_id: 265813
                  cat_code: 1632
                  phone: 4561231159
                  status: Active
                  title: Director of Software Development
                  created_date: '2018-10-23 18:31:00'
                  updated_date: '2019-05-15 16:41:00'
                  badge_link: ''
                  removed: 0
                  emergency_phone: 555-555-5555
                  emergency_contact_name: Bob Smith
                  emergency_contact_relationship: Parent
                  account:
                    id: 1235
                    parent_id: 1235
                    name: Avetta
                    type: client
                    con_id: 235843
                    con_flag: 0
            successfulExtraCheckinStatusExternal:
              summary: With extra=checkin,status,external
              value:
                stats:
                  search_id: 231019020
                users:
                - id: 1235
                  con_id: 1568432
                  first_name: John
                  last_name: Doe
                  login_id: jdoe
                  email: test@test.com
                  status: Active
                  flag: Green
                  flag_forced: 0
                  last_checkin_date: '2020-10-23 15:00:00'
                  last_checkout_date: '2020-10-23 19:45:00'
                  external_id:
                  - Connect:
                      SAP: 11035178
                  removed: 0
                  account:
                    id: 1235
                    parent_id: 1235
                    name: Avetta
                    type: client
                    con_id: 235843
                    con_flag: 0
                    external_id:
                    - Connect:
                        SAP: 11035178
