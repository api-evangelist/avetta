components:
  schemas:
    3.29.14_LogpointLicenseResource:
      type: object
      properties:
        name:
          type: string
        companyId:
          type: integer
          format: int32
        companyName:
          type: string
        siteId:
          type: integer
          format: int32
        siteName:
          type: string
    3.29.14_LogpointActionResource:
      required:
      - actionDateTime
      - logpointAction
      - logpointMethod
      - personId
      type: object
      properties:
        actionDateTime:
          type: string
        personId:
          type: integer
          format: int32
        companyId:
          type: integer
          format: int32
        logpointAction:
          type: string
          enum:
          - ACTION_UNKNOWN
          - ACTION_LOGIN
          - ACTION_LOGOUT
          - ACTION_RLU
          - ACTION_BOOMGATE
          - ACTION_MOVE_HERE
          - ACTION_FINISH_HERE
          - ACTION_TOGGLE
        logpointMethod:
          type: string
          enum:
          - METHOD_UNKNOWN
          - METHOD_ONSITE_MAGSTRIPE
          - METHOD_PASSWORD
          - METHOD_OFFLINE
          - METHOD_MANUAL
          - METHOD_FORCED
          - METHOD_LEGACY
          - METHOD_AUTO_GENERATED
          - METHOD_ONSITE_PROX
          - METHOD_ONSITE_BARCODE
          - METHOD_RLU
          - METHOD_QR
          - METHOD_DESFIRE
          - MOBILE_KIOSK
          - METHOD_SITE_AUTO_LOGOUT
          - METHOD_MOBILE_REMOTE_LOGIN
        activityId:
          type: integer
          format: int32
        siteContactId:
          type: integer
          format: int32
        seenMessageResources:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_MessageResource'
        inductionId:
          type: integer
          format: int32
    3.29.14_MultiCheckInResult:
      type: object
      properties:
        logpointId:
          type: integer
          format: int32
        success:
          type: boolean
    3.29.14_LogpointResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        settings:
          type: object
          additionalProperties:
            type: string
    3.29.14_StatusType:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        reasonPhrase:
          type: string
    3.29.14_LogpointSummaryResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        location:
          type: string
    3.29.14_KeyedIntegerResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    3.29.14_LogpointEventResource:
      required:
      - eventDateTime
      - eventType
      - personId
      type: object
      properties:
        eventDateTime:
          type: string
        eventType:
          type: integer
          format: int32
        eventData:
          type: string
        personId:
          type: integer
          format: int32
    3.29.14_FullErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
        errorDetail:
          type: string
    3.29.14_AlcolizerResultResource:
      required:
      - bacLimit
      - bacResult
      - dateTime
      - personId
      type: object
      properties:
        dateTime:
          type: string
        bacLimit:
          type: number
          format: float
        personId:
          type: integer
          format: int32
        bacResult:
          type: number
          format: float
    3.29.14_ErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
    3.29.14_MessageResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        message:
          type: string
        start:
          type: string
        finish:
          type: string
        createdBy:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
    3.29.14_Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        parameters:
          type: object
          additionalProperties:
            type: object
        detail:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/3.29.14_StatusType'
  securitySchemes:
    3.29.14_security_auth:
      type: oauth2
      scheme: Bearer
      flows:
        authorizationCode:
