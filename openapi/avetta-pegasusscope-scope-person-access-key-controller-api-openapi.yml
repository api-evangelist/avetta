        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        scope:
          $ref: '#/components/schemas/3.29.14_ScopeDetailResource'
        watermark:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        inheritedBySubScopes:
          type: boolean
        active:
          type: boolean
    3.29.14_StatusType:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        reasonPhrase:
          type: string
    3.29.14_AccessKeyResourceV2:
