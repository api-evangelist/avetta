      operationId: removeAccessKeys
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: siteAccessKeyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
        '400':
