        deliveredByTraining:
          type: boolean
        issueDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        expiryDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        minimumValidityDaysBeforeRenewal:
          type: integer
          format: int32
