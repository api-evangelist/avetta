          type: array
          items:
            type: string
        downloadableDocId:
          type: integer
          format: int32
        allowOnlineAssessment:
          type: boolean
        issueDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        expiryDateMandatoryStatus:
          type: string
          enum:
