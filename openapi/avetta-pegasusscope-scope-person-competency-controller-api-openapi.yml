    put:
      tags:
      - pegasusScope_scope-person-competency-controller
      summary: Update upload file review status with group competency support
      description: Updates the review status of an upload file for a verified document competency. Supports group competencies by allowing either the group ID or a member competency ID to be passed. When assignCompetency is true and status is Verified, the competency will be assigned to the person.
      operationId: updateUploadFileReviewStatusWithGroupSupport
