openapi: 3.2.0
info:
  title: Avetta Deprecated Endpoints API
  version: 1.0.0
  description: 'Operations tagged Deprecated Endpoints across 2 of this provider''s published API definitions: avetta-connect-dist.json, avetta-connect-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.avetta.com
  description: Production (as named in the Client API Service documentation examples)
tags:
- name: Deprecated Endpoints
  description: Endpoints that are deprecated and will be removed in future versions.
  x-displayName: Deprecated Endpoints
paths:
  /v1/forms/actions:
    servers: []
    post:
      servers:
      - url: https://api.avetta.com/api
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/ApiserviceV1/1.0.0
        description: MOCK
      deprecated: true
      description: 'Access to the approval process of specific forms that are not yet in their final workflow status. In case of failure, the form remains unchanged.

        Max field lengths on String fields will be strictly enforced, and requests that exceed the maximum field length will result in a validation failure.

        Action field will be validated to only allow applicable status that can be applied on the form.'
      parameters:
      - description: The numeric id of the form to approve/reject. Should be in a numeric format.
        in: query
        name: formId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              example:
                action: approve
                comments: Good to go
                lang: En
              properties:
                action:
                  description: The value should be one of the applicable actions (Refer to the previous endpoint)
                  type: string
                comments:
                  maxLength: 4000
                  type: string
                lang:
                  default: en
                  description: The language of the action specified. Optional
                  type: string
              required:
              - action
              - comments
              type: object
        description: The type of approval for the form.
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              examples:
                response:
                  value:
                    code: '1'
                    message: The form is in a worfklow state that is no longer actionable.
              schema:
                properties:
                  code:
                    format: numeric
                    type: string
                  message:
                    type: string
                type: object
          description: Bad Request
        '422':
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              examples:
                response:
                  value:
                    code: '5'
                    message: Server Error
              schema:
                properties:
                  code:
                    format: numeric
                    type: string
                  message:
                    type: string
                type: object
          description: Internal Server Error
      summary: Post Form Approval v1
      tags:
      - Deprecated Endpoints
      operationId: postV1FormsActions
      x-operation-id-source: derived
  /v1/forms/activities:
    servers: []
    get:
      servers:
      - url: https://api.avetta.com/api
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/ApiserviceV1/1.0.0
        description: MOCK
      deprecated: true
      description: Gets all activities/comments made on a specific form from newest to oldest.
      parameters:
      - description: The numeric id of the form. Should be in a numeric format.
        in: query
        name: formId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                  - formId: '1234'
                    comments: This form was rejected due to insurance limit...
                    createdDate: '2021-04-29T15:59:34Z'
                    createdBy: John Doe
                  - formId: '1234'
                    comments: This form was rejected due to incomplete info
                    createdDate: '2021-01-20T10:51:31Z'
                    createdBy: Jane Doe
              schema:
                items:
                  properties:
                    comments:
                      type: string
                    createdBy:
                      format: firstname lastname
                      type: string
                    createdDate:
                      format: UTC DateTime
                      type: string
                    formId:
                      format: numeric
                      type: string
                  type: object
                type: array
          description: OK
        '400':
          content:
            application/json:
              examples:
                response:
                  value:
                    code: '10'
                    message: formId is not in a valid numeric format.
              schema:
                properties:
                  code:
                    format: numeric
                    type: string
                  message:
                    type: string
                type: object
          description: Bad Request
        '429':
          content:
            application/json:
              examples:
                response:
                  value:
                    code: '11'
                    message: Can’t process the request right now. Please try again later.
              schema:
                properties:
                  code:
                    format: numeric
                    type: string
                  message:
                    type: string
                type: object
          description: Too Many Requests
        '500':
          content:
            application/json:
              examples:
                response:
                  value:
                    code: '5'
                    message: Server Error
              schema:
                properties:
                  code:
                    format: numeric
                    type: string
                  message:
                    type: string
                type: object
          description: Internal Server Error
      summary: Get Form Activities v1
      tags:
      - Deprecated Endpoints
      operationId: getV1FormsActivities
      x-operation-id-source: derived
  /v1/forms/count:
    servers: []
    get:
      servers:
      - url: https://api.avetta.com/api
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/ApiserviceV1/1.0.0
        description: MOCK
      deprecated: true
      description: 'Returns the total number of records from the `Form` Endpoint. All query parameters from the `Form` endpoint are also applicable in this endpoint as those values will be used in determining the number of records given the provided parameters.


        By default, only Active Forms created within the last 12 months are returned.'
      parameters:
      - description: Optional filter for a supplier
        in: query
        name: supplierId
        schema:
          type: number
      - description: Optional filter for a client account
        in: query
        name: clientId
        schema:
          type: number
      - description: Optional filter for a specific form
        in: query
        name: formId
        schema:
          type: number
      - description: Optional filter for a form year
        in: query
        name: year
        schema:
          type: string
      - description: Optional filter for a category
        in: query
        name: categoryId
        schema:
          type: string
      - description: Optional filter for a question
        in: query
        name: questionId
        schema:
          type: string
      - description: Optional value to return records after the specified date and time [yyyy-MM-dd hh:mm:ss]. When the `supplierId` is provided, the available range is the last 12 months. When the `supplierId` is not provided, the available range is capped at 1 month ago. If no date is specified, the endpoint will only count records from the past month.
        in: query
        name: modifiedAfter
        schema:
          format: date-time
          type: string
      - description: Optional value to return archived only records
        in: query
        name: archivedOnly
        schema:
          type: boolean
      - description: Optional value to return active only records
        in: query
        name: activeOnly
        schema:
          default: 'true'
          type: boolean
      - description: Optional filter for a formType
        in: query
        name: formTypeId
        schema:
          type: number
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                  - total_records: 1845
              schema:
                items:
                  properties:
                    total_records:
                      type: integer
                  type: object
                type: array
                x-examples:
                  example-1:
                  - total_records: 3039225
          description: OK
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                type: object
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    code: 10
                    message: Invalid Param Value
          description: Bad Request
      summary: Get Form Count v1
      tags:
      - Deprecated Endpoints
      operationId: getV1FormsCount
      x-operation-id-source: derived
  /v1/forms/statuses:
