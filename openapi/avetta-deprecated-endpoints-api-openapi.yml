      deprecated: true
      description: Gets the applicable statuses to apply for a specific form. The list of statuses would be the applicable status to set based on the current status of the form. If the form is in its final workflow status, then it will return an empty list.
      parameters:
      - description: The numeric id of the form. Should be in a numeric format.
        in: query
        name: formId
        required: true
        schema:
          type: integer
      - description: The target language of the applicable statuses
        in: query
        name: lang
        required: false
        schema:
          default: en
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                    formId: '1234'
                    language: en
                    applicableActions:
                    - id: 4f8c65605049436c832e250d
                      action: approve
                    - id: 4f8dd5605049436c832e250d
                      action: reject
                    message: ''
              schema:
                properties:
                  applicableActions:
                    items:
                      properties: {}
                      type: object
                    type: array
                  formId:
                    type: string
                  language:
                    type: string
                  message:
                    type: string
                type: object
                x-examples:
                  example-1:
                    applicableActions: []
                    formId: '16837298'
                    language: en
                    message: Form is currently in a workflow state that you can not act on.
          description: OK
        '201':
          content:
            application/json:
              schema:
                properties: {}
                type: object
            example-1:
              examples:
                response:
                  value: {}
          description: Created
        '400':
          content:
            application/json:
              examples:
                response:
                  value:
                    code: '10'
                    message: formId is not in a valid numeric format.
              schema:
                properties:
                  code:
                    format: numeric
                    type: string
                  message:
                    type: string
                type: object
          description: Bad Request
        '500':
          content:
            application/json:
              examples:
                response:
                  value:
                    code: '5'
                    message: Server Error
              schema:
                properties:
                  code:
                    format: numeric
                    type: string
                  message:
                    type: string
                type: object
          description: Internal Server Error
      summary: Get Form Status v1
      tags:
      - Deprecated Endpoints
      operationId: getV1FormsStatuses
      x-operation-id-source: derived
