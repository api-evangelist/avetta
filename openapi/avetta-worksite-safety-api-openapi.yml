                $ref: '#/components/schemas/1.0.0_ErrorResponse'
  /v1/clients/{clientId}/work-requests/{workRequestId}/questions:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    get:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: getWorkRequestQuestions
      summary: Get Work Request Questions
      description: 'Retrieves questions for a specific work request and its forms. The clientId represents either corporate, hub,

        or site level in the hierarchy, and workRequestId identifies the specific work request.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '315425021'
      - name: workRequestId
        in: path
        required: true
        description: The unique identifier of the work request
        schema:
          type: string
        example: '177800'
      responses:
        '200':
          description: Successfully retrieved work request questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_GetWorkRequestQuestionsResponse'
              examples:
                SuccessfulResponse:
                  value:
                    workRequestId: '17846'
                    workRequestName: Repair brick walls
                    categories:
                    - categoryId: '35178'
                      categoryName: Work Request Details
                      allowsMultipleInstances: false
                      isEditable: true
                      questions:
                      - questionId: '177802'
                        question: 'Work Request Details:'
                        questionType: longText
                        responseOptions: []
                        isRequired: true
                        isEditable: true
                      - questionId: '120821'
                        question: Do you require some form of risk assessment or hazard analysis to be conducted prior to the commencement of work?
                        questionType: multipleChoice
                        responseOptions:
                        - displayText: 'Yes'
                          storageValue: '1'
                        - displayText: 'No'
                          storageValue: '2'
                        isRequired: true
                        isEditable: true
                      childCategories: []
                    childForms:
                    - formId: '43760'
                      formName: Job Hazard Analysis
                      isEditable: true
                      childCategories:
                      - categoryId: '36880'
                        categoryName: Step
                        allowsMultipleInstances: true
                        isEditable: true
                        questions:
                        - questionId: '129933'
                          question: 'Step:'
                          questionType: shortText
                          responseOptions: []
                          isRequired: false
                          isEditable: true
                        childCategories:
                        - categoryId: '36881'
                          categoryName: Hazard
                          allowsMultipleInstances: true
                          isEditable: true
                          questions:
                          - questionId: '129934'
                            question: 'Hazard:'
                            questionType: shortText
                            responseOptions: []
                            isRequired: false
