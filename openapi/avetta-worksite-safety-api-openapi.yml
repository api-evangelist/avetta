    put:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: upsertWorkRequestAnswers
      summary: Upsert Work Request Answers
      description: 'Creates or updates answers for questions in a work request based on the path param for `workRequestId`. This endpoint allows you to submit answers for multiple categories and questions within a work request.


        **Note**:


        The `workRequestId` must be visible to the `clientId` path param used.


        **Workflow**:

        1. First call:


        `GET /v1/clients/{clientId}/work-requests/{workRequestId}/questions` to retrieve available questions

        2. Use the returned `categoryId` and `questionId` values to structure your answers

        3. Submit answers using this endpoint with the same category and question identifiers


        **Repeatable categories**


        Some categories are flagged as `allowsMultipleInstances: true` in the questions response (and in `GET .../questions-answers`). A repeatable category can hold multiple independent instances of the same set of answers (for example, multiple risks under a single "Risk Assessment" category). Each instance is identified by an `instanceId`.


        To target a repeatable category:


        - **Insert (new instance)** — omit `instanceId`. The server generates a new `instanceId` and creates a brand new instance with the supplied answers. Send the category once per new instance you want to create.

        - **Update (existing instance)** — send the `instanceId` returned by `GET .../questions-answers` for the instance you want to modify. Only the questions you include in `questionsAndAnswers` are updated; other questions in that instance keep their current values.


        For non-repeatable categories (`allowsMultipleInstances: false`), `instanceId` is not applicable and should be omitted from insert and update requests.


        **Insert example** — adds two new instances to the repeatable "Risk Assessment" category (no `instanceId` provided):

        ```json

        {

        "categories": [

        {

        "categoryId": "46897",

        "questionsAndAnswers": [

        { "questionId": "177803", "answerValues": ["Slippery floor near entrance"] },

        { "questionId": "177804", "answerValues": ["High"] }

        ]

        },

        {

        "categoryId": "46897",

        "questionsAndAnswers": [

        { "questionId": "177803", "answerValues": ["Exposed wiring in panel B"] },

        { "questionId": "177804", "answerValues": ["Critical"] }

        ]

        }

        ]

        }

        ```


        **Update example** — updates an existing instance identified by the `instanceId` taken from the GET response:

        ```json

        {

        "categories": [

        {

        "categoryId": "46897",

        "instanceId": "8c7f4d2a-19b3-4e6c-9f10-2b6a5d1a77e0",

        "questionsAndAnswers": [

        { "questionId": "177804", "answerValues": ["Moderate"] }

        ]

        }

        ]

        }

        ```


        **Nested repeatable categories**


        Repeatable categories can themselves contain repeatable subcategories. Each level identifies its target instance with an `instanceId`, and a child''s `instanceId` is the parent''s `instanceId` joined to its own UUID with a `.` (e.g. `..`). To update existing nested instances, send each `instanceId` exactly as it was returned by `GET .../questions-answers`. See the `UpdateNestedRepeatableInstances` example below for the full shape.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '250125517'
      - name: workRequestId
        in: path
        required: true
        description: The unique identifier of the work request
        schema:
          type: string
        example: '427605'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/1.0.0_UpsertWorkRequestAnswersRequest'
            examples:
              UpsertAnswersExample:
                summary: Insert/Update Answers for a Non-Repeatable Category
                value:
                  categories:
                  - categoryId: '46896'
                    questionsAndAnswers:
                    - questionId: '177802'
                      answerValues:
                      - This is for testing purposes
              InsertRepeatableInstances:
                summary: Insert a New Answer into a Repeatable Category
                description: 'Each category entry without an `instanceId` creates a new instance.

                  The server assigns a fresh `instanceId` to each one.

                  '
                value:
                  categories:
                  - categoryId: '46897'
                    questionsAndAnswers:
                    - questionId: '177803'
                      answerValues:
                      - Slippery floor near entrance
                    - questionId: '177804'
                      answerValues:
                      - High
                  - categoryId: '46897'
                    questionsAndAnswers:
                    - questionId: '177803'
                      answerValues:
                      - Exposed wiring in panel B
                    - questionId: '177804'
                      answerValues:
                      - Critical
              UpdateRepeatableInstance:
                summary: Update an Existing Answer in a Repeatable Category
                description: 'Pass the `instanceId` returned by `GET .../questions-answers` to update that specific instance.

                  Only the questions included in `questionsAndAnswers` are updated; other answers in the instance are preserved.

                  '
                value:
                  categories:
                  - categoryId: '46897'
                    instanceId: 8c7f4d2a-19b3-4e6c-9f10-2b6a5d1a77e0
                    questionsAndAnswers:
                    - questionId: '177804'
                      answerValues:
                      - Moderate
              UpdateNestedRepeatableInstances:
                summary: Update Answers in Nested Repeatable Categories
                description: 'Repeatable categories can be nested. Each level identifies its target instance with an `instanceId`,

                  and each child''s `instanceId` is the parent''s `instanceId` joined to its own UUID with a `.` —

                  e.g. `<outer>.<middle>.<inner>`. To **update** existing nested instances, send each `instanceId`

                  exactly as it was returned by `GET .../questions-answers`. The outer non-repeatable category

                  that holds the repeatable subtree carries no `instanceId` itself.

                  '
                value:
                  categories:
                  - categoryId: '38923'
                    childCategories:
                    - categoryId: '43308'
                      instanceId: 8298fee9-f76a-4e08-bc77-5c9d41c27a1c
                      questionsAndAnswers:
                      - questionId: '159073'
                        answerValues:
                        - step 01
                      childCategories:
                      - categoryId: '43310'
                        instanceId: 8298fee9-f76a-4e08-bc77-5c9d41c27a1c.c94f0758-6ca0-41f5-9571-d7e96c1189dc
                        questionsAndAnswers:
                        - questionId: '159076'
                          answerValues:
                          - haz 02
                        childCategories:
                        - categoryId: '43311'
                          instanceId: 8298fee9-f76a-4e08-bc77-5c9d41c27a1c.c94f0758-6ca0-41f5-9571-d7e96c1189dc.758f9061-016c-4d73-bf22-8b661ce6f36e
                          questionsAndAnswers:
                          - questionId: '159077'
                            answerValues:
                            - control 01ab
      responses:
        '200':
          description: Successfully updated work request answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_UpsertWorkRequestAnswersResponse'
              examples:
                SuccessfulUpdate:
                  value:
                    message: Work Request(s) updated successfully
                    url: https://app.avetta.com/avt-cli/processes/68add8236383c26ae7658898
        '400':
          description: Bad Request – one or more submitted answers are invalid
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                InvalidQuestionAnswers:
                  value:
                    message: 'Invalid answer ''99'' for question 177802 in category 46896: not in responseOptions'
                    code: PROCESSSERVICE.20
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
                NoValidAnswers:
                  value:
                    message: No valid question answers found to update
                    code: PROCESSSERVICE.20
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '404':
          description: Work request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
