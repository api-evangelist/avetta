      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: putTransitionChildFormWorkflowStatus
      summary: Transition Child Form Workflow Status
      description: 'Transitions a child form (a form that lives under a work request) to a new workflow status.


        **Rules:**

        - The work request must exist and belong to the caller''s client hierarchy.

        - The child form must currently be a non-deleted, active child of the named work request.

        - The client must have edit rights to progress the child form''s current workflow status to the next.

        - The target workflow status must be reachable from the current status (not hopping over a required status).

        - Every required question on the child form that the client can edit must have at least one non-empty answer, except those hidden by a `condition` calculation whose formula evaluates to a hide list containing that question given the current answers.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '4283746'
      - name: workRequestId
        in: path
        required: true
        description: The unique identifier of the parent work request
        schema:
          type: string
        example: '445755'
      - name: childFormId
        in: path
        required: true
        description: The unique identifier of the child form to transition
        schema:
          type: string
        example: '1001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workflowStatusId
              properties:
                workflowStatusId:
                  type: string
                  description: The id of the workflow status to transition the child form to.
                  example: 63f9167e4fdc1c657a5e6467
            examples:
              TransitionToAcknowledge:
                value:
                  workflowStatusId: 63f9167e4fdc1c657a5e6467
      responses:
        '200':
          description: Child form workflow status transitioned successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - childFormId
                - previousStatusId
                - currentStatusId
                - isFinal
                properties:
                  childFormId:
                    type: string
                    description: Display identifier of the child form that was transitioned.
                    example: '1001'
                  previousStatusId:
                    type: string
                    description: The workflow status the child form was in before the transition.
                    example: 61f96b4955f484285bf7ab85
                  previousStatusName:
                    type:
                    - string
                    - 'null'
                    description: Human-readable name of the previous workflow status, when available.
                    example: In Review
                  currentStatusId:
                    type: string
                    description: The workflow status the child form is now in.
                    example: 63f9167e4fdc1c657a5e6467
                  currentStatusName:
                    type:
                    - string
                    - 'null'
                    description: Human-readable name of the new workflow status, when available.
                    example: Acknowledge
                  isFinal:
                    type: boolean
                    description: Whether the new workflow status is a terminal state with no outgoing transitions.
                    example: false
        '400':
          description: Child form workflow status cannot be transitioned
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                InvalidChildFormWorkflowTransition:
                  value:
                    message: 'Cannot transition child form 1001: 63f9167e4fdc1c657a5e6467 is not a valid transition from current status 61f96b4955f484285bf7ab85.'
                    code: PROCESSSERVICE.12
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
                ChildFormRequiredFieldsMissing:
                  value:
                    message: 'Cannot transition child form 1001: required questions are missing answers: q-001, q-004.'
                    code: PROCESSSERVICE.14
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '403':
          description: Forbidden – The user is not authorized for this transition.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                UserNotAuthorizedForWorkRequest:
                  value:
                    message: User is not authorized to access workRequestId 445755.
                    code: PROCESSSERVICE.3
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
                ClientNotAuthorizedForChildFormTransition:
                  value:
                    message: Client does not have edit rights for child form 1001 at its current workflow status.
                    code: PROCESSSERVICE.11
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
                ChildFormTargetStatusExcludesClient:
                  value:
                    message: 'Cannot transition child form 1001: target status 684c68aec7903ebcbf5301ac is strictly supplier or internal and does not include the client.'
                    code: PROCESSSERVICE.13
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '404':
