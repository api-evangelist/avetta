  /v1/clients/{clientId}/projects/{projectId}/work-requests:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    get:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: getWorkRequests
      summary: Get Work Requests
      description: 'Retrieves all work-requests for the specified project. The clientId represents either corporate, hub,

        or site level in the hierarchy.


        **Note**: The user must ensure the clientId used matches the node in the hierarchy in where the project was created, or it''s parents.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '315425021'
      - name: projectId
        in: path
        required: true
        description: The unique identifier of the client's project.
        schema:
          type: string
        example: '315425021'
      - name: isArchived
        in: query
        description: Filter by archived work request. Defaults to false.
        schema:
          type: boolean
          default: false
        example: true
      - name: siteId
        in: query
        description: Filter by unique client site identifier.
        schema:
          type: string
        example: '250410657'
      - name: supplierId
