        schema:
          type: string
        example: '250026886'
      - name: workRequestStatus
        in: query
        description: Filter by work request status. Matches the workflow status name (e.g. "In Progress").
        schema:
          type: string
        example: In Progress
      - name: start
        in: query
        description: The record to start with for pagination (0-based)
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: limit
        in: query
        description: The total number of records to return, maximum of 500
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        example: 100
      responses:
        '200':
          description: Successfully retrieved work requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_GetWorkRequestsResponse'
              examples:
                SuccessfulResponse:
                  value:
                    totalCount: 1
                    workRequests:
                    - projectId: '427603'
                      projectName: wmint
                      siteId: '250410673'
                      supplierId: '250028423'
                      workRequestId: '427605'
                      workRequestName: wmint
                      workRequestStatus: In Progress
                      createdDate: '2025-08-26T15:52:03.741Z'
                      updatedDate: '2025-08-26T16:17:21.694Z'
                      _links:
                        web:
                          href: https://app.avetta.com/avt-cli/processes/688a5808a86cf933395a239c
