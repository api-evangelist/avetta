  /v1/workers/{workerId}/open-work-requests/summary:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    get:
      summary: Get a worker's open Work Requests summary
      description: 'For Worker Management: how many active Work Requests the worker is assigned to across every account, whether a Connect user exists for the worker, and where in Connect to send them. The link is present only when a Connect user exists and a landing page is configured. Only Avetta''s internal account may call this route.'
      tags:
      - Worksite-Safety
      operationId: getWorkerOpenWorkRequestsSummary
      parameters:
      - name: workerId
        in: path
        required: true
        description: 'The worker as Worker Management spells it (for example `01-1251251`) or as Connect stores it on an assignment (24 hexadecimal characters).

          '
        schema:
          type: string
        example: 01-1251251
      responses:
        '200':
          description: Summary for the worker; a worker with no assignments returns a count of 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_WorkerOpenWorkRequestsSummary'
              examples:
                LinkedWorker:
                  value:
                    workerId: 01-1251251
                    openWorkRequestCount: 2
                    connectUserExists: true
                    _links:
                      web:
                        href: https://app.avetta.com/avt-sup/process-tasks
                UnlinkedWorker:
                  value:
                    workerId: 01-999
                    openWorkRequestCount: 0
                    connectUserExists: false
