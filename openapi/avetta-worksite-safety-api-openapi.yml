        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
components:
  schemas:
    1.0.0_QuestionCategory:
      type: object
      description: 'Category containing related questions. Categories can be nested: any `QuestionCategory`

        may carry its own `childCategories` array containing further `QuestionCategory` entries, and

        those can in turn carry their own subcategories.

        '
      properties:
        categoryId:
          type: string
          description: Unique identifier for the category
          example: '46896'
        categoryName:
          type: string
          description: Name of the category
          example: Work Request Details
        allowsMultipleInstances:
          type: boolean
          description: Whether this category can hold multiple independent instances (repeatable)
          example: false
        isEditable:
          type: boolean
          description: Whether questions in this category are editable by the user
          example: true
        questions:
          type: array
          description: Array of questions within this category
          items:
            $ref: '#/components/schemas/1.0.0_Question'
        childCategories:
          type: array
          description: 'Nested subcategories of this category. Each item is itself a `QuestionCategory`, so

            the same shape repeats recursively — a subcategory can contain its own questions

            and its own further subcategories. The field is always present; it serialises as `[]`

            when the category has no subcategories.

            '
          items:
            $ref: '#/components/schemas/1.0.0_QuestionCategory'
      required:
      - categoryId
      - categoryName
      - allowsMultipleInstances
      - isEditable
      - questions
      - childCategories
    1.0.0_GetProjectTemplatesResponse:
      type: object
      description: Response containing project templates data
      properties:
        totalCount:
          type: integer
          description: Total number of project templates available
          example: 1
        templates:
          type: array
          description: Array of project templates
          items:
            $ref: '#/components/schemas/1.0.0_ProjectTemplate'
      required:
      - totalCount
      - templates
    1.0.0_QuestionAndAnswerValue:
      type: object
      description: Question paired with its answer values
      properties:
        questionId:
          type: string
          description: Unique identifier for the question
          example: '168846'
        questionDisplayText:
          type: string
          description: The question text shown to the user
          example: 'Work Request Details:'
        answerValues:
          type: array
          description: Values provided as answers (empty array when the question is unanswered)
          items:
            type: string
          example:
          - WSS demo
      required:
      - questionId
      - questionDisplayText
      - answerValues
    1.0.0_WorkerOpenWorkRequestsSummary:
      type: object
      required:
      - workerId
      - openWorkRequestCount
      - connectUserExists
      properties:
        workerId:
          type: string
          description: The worker as Worker Management spells it
          example: 01-1251251
        openWorkRequestCount:
          type: integer
          format: int64
          description: Active Work Requests the worker is assigned to, across every account
          example: 2
        connectUserExists:
          type: boolean
          description: Whether a Connect user stands for this worker; without one there is no link
          example: true
        _links:
          type: object
          description: Present only when a Connect user exists and a landing page is configured
          properties:
            web:
              type: object
              properties:
                href:
                  type: string
                  description: Where in Connect to send the worker
                  example: https://app.avetta.com/avt-sup/process-tasks
    1.0.0_Project:
      type: object
      description: Project details
      properties:
        projectId:
          type: string
          description: Unique identifier for the project
          example: '40000'
        projectName:
          type: string
          description: Name of the project
          example: Test
        isArchived:
          type: boolean
          description: Indicates whether the project is archived. When true, the project is archived; when false, the project is active.
          example: false
        status:
          type: string
          description: Current workflow status of the project (either "Open", or "Close").
          example: Open
        createdDate:
          type: string
          format: date-time
          description: Date and time when the project was created
          example: '2025-07-29T20:57:05.213Z'
        updatedDate:
          type: string
          format: date-time
          description: Date and time when the project was last updated
          example: '2025-07-29T20:57:05.562Z'
        _links:
          $ref: '#/components/schemas/1.0.0_WebLinks'
      required:
      - projectId
      - isArchived
      - status
      - createdDate
      - updatedDate
      - _links
    1.0.0_AvailableChildForm:
      type: object
      required:
      - formName
      - formTemplateId
      properties:
        formName:
          type: string
          description: Display name of the form template.
          example: Risk Observation
        formTemplateId:
          type: string
          description: Unique identifier of the form template.
          example: 68191fcb858bfe0c34c12277
    1.0.0_GetWorkRequestsResponse:
      type: object
      description: Response containing work requests data
      properties:
        totalCount:
          type: integer
          description: Total number of work requests available
          example: 1
        workRequests:
          type: array
          description: Array of work requests
          items:
            $ref: '#/components/schemas/1.0.0_WorkRequest'
      required:
      - totalCount
      - workRequests
    1.0.0_CreateChildFormResponse:
      type: object
      description: Response after successfully creating a child form under a work request
      required:
      - message
      - formId
      - _links
      properties:
        message:
          type: string
          description: Human-readable success message
          example: Form created successfully
        formId:
          type: string
          description: Display identifier of the newly created child form
          example: '434711'
        _links:
          $ref: '#/components/schemas/1.0.0_WebLinks'
    1.0.0_GetAvailableChildFormsResponse:
      type: object
      required:
      - availableChildForms
      properties:
        availableChildForms:
          type: array
          description: List of form templates that can be created for the work request.
          items:
            $ref: '#/components/schemas/1.0.0_AvailableChildForm'
    1.0.0_UpsertWorkRequestAnswersResponse:
      type: object
      description: Response after successfully upserting work request answers
      properties:
        message:
          type: string
          description: Success message
          example: Work Request(s) updated successfully
        url:
          type: string
          format: uri
          description: URL to access the updated work request
          example: https://app.avetta.com/avt-cli/processes/68add8236383c26ae7658898
      required:
      - message
      - url
    1.0.0_Form:
      type: object
      description: Form containing categories of questions
      properties:
        formId:
          type: string
          description: Unique identifier for the form
          example: '46896'
        formName:
          type: string
          description: Name of the form
          example: Risk Assessment
        childCategories:
          type: array
          description: Array of categories within this form
          items:
            $ref: '#/components/schemas/1.0.0_QuestionCategory'
        isEditable:
          type: boolean
          description: Indicates whether the form is in a state in which it can be edited by the user
          example: true
      required:
      - formId
      - childCategories
      - isEditable
    1.0.0_SupplierUser:
      type: object
      properties:
        userId:
          type: string
          description: The unique identifier of the user
          example: '234087'
        firstName:
          type: string
          description: The user's first name
          example: Nick
        lastName:
          type: string
          description: The user's last name
          example: Arcifa
        userEmail:
          type:
          - string
          - 'null'
          description: The user's email address (may be null)
          example: arcifa@domain.com
      required:
      - userId
      - firstName
      - lastName
      - userEmail
    1.0.0_ErrorResponse:
      type: object
      description: Standard error response format
      properties:
        error:
          type: string
          description: Error message
          example: Invalid client ID provided
        code:
          type: string
          description: Error code for programmatic handling
          example: WSS.400.001
        details:
          type: object
          description: Additional error details
          additionalProperties: true
          example:
            field: clientId
            reason: Client ID does not exist in hierarchy
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-01-31T10:30:00Z'
        requestId:
          type: string
          description: Unique request identifier for tracking
          example: req-12345678-abcd-ef90
      required:
      - error
      - code
      - timestamp
    1.0.0_User:
      type: object
      properties:
        userId:
          type: string
          description: The unique identifier of the assigned user
        firstName:
          type: string
          description: The first name of the assigned user
        lastName:
          type: string
          description: The last name of the assigned user
        userType:
          type: string
          enum:
          - connectSupplier
          - workerManagementWorker
          - workforceManagementWorker
          description: The type of user provider
    1.0.0_UpdateAssignedUsersRequest:
      type: object
      required:
      - usersToBeAdded
      - usersToBeRemoved
      properties:
        usersToBeAdded:
          type: array
          description: List of user IDs to be assigned to the work request
          items:
            type: string
          example:
          - '4802531'
        usersToBeRemoved:
          type: array
          description: List of user IDs to be removed from the work request
          items:
            type: string
          example: []
    1.0.0_CreateProjectResponse:
      type: object
      description: Response after successfully creating a project
      properties:
        projectId:
          type: string
          description: Unique identifier for the created project
          example: '434710'
        _links:
          $ref: '#/components/schemas/1.0.0_WebLinks'
      required:
      - projectId
      - _links
    1.0.0_CreateProjectRequest:
      type: object
      description: Request body for creating a new project
      properties:
        projectName:
          type: string
          description: Name of the project to be created. Leading and trailing whitespace is trimmed before validation, so the length limit applies to the trimmed value.
          minLength: 1
          maxLength: 250
          example: Test Project
        templateId:
          type: string
          description: Unique identifier of the project template to use
          example: 68af3d0599450f37bbe9a2fc
      required:
      - projectName
      - templateId
    1.0.0_CategoryInstance:
      type: object
      description: 'A single instance of a category''s answers. For non-repeatable categories there is exactly one

        instance and `instanceId` is omitted from the response. For repeatable categories there is one

        instance per repetition, each carrying a stable `instanceId`.

        '
      properties:
        instanceId:
          type: string
          description: 'Identifier for this repetition. Present only when the parent category has

            `allowsMultipleInstances: true`; omitted for non-repeatable categories. Send this value back

            as `instanceId` when updating an existing instance via `PUT .../questions-answers`.

            '
          example: a6aacdfa-316d-4a45-ab07-af640d880bf6
        questionsAndAnswers:
          type: array
          description: Question/answer pairs for this instance
          items:
            $ref: '#/components/schemas/1.0.0_QuestionAndAnswerValue'
      required:
      - questionsAndAnswers
    1.0.0_WebLinks:
      type: object
      description: 'HAL-style links to related resources.

        Project and work-request links use `/avt-cli/processes/{instanceStepId}`.

        Child-form links use `/avt-cli/processes/process-tree/{workRequestInstanceStepId}/{formInstanceStepId}`.

        '
      properties:
        web:
          type: object
          description: Link to the resource in the Avetta web application
          properties:
            href:
              type: string
              format: uri
              description: Absolute or relative URL to the resource in the Avetta web UI
              example: https://app.avetta.com/avt-cli/processes/688a5808a86cf933395a239c
          required:
          - href
      required:
      - web
      example:
        web:
          href: https://app.avetta.com/avt-cli/processes/688a5808a86cf933395a239c
    1.0.0_SupplierUsersResponse:
      type: object
      properties:
        totalCount:
          type: integer
          description: Total number of supplier users available
          example: 1
        supplierName:
          type: string
          description: The name of the assigned supplier
          example: demoClient^^^Worksite Safety WSS - UT01
        supplierBillingId:
          type: string
          description: The billing ID of the assigned supplier
          example: '250410673'
        users:
          type: array
          description: List of supplier users
          items:
            $ref: '#/components/schemas/1.0.0_SupplierUser'
      required:
      - totalCount
      - supplierName
      - supplierBillingId
      - users
    1.0.0_TransitionTarget:
      type: object
      description: A target state that a form can transition to from its current source state.
      required:
      - statusId
      - name
      - isFinal
      - clientCanTransition
      properties:
        statusId:
          type: string
          description: Unique identifier of the target workflow status.
          example: 64a1b2c3d4e5f6a7b8c9d0e4
        name:
          type: string
          description: Human-readable name of the target workflow status.
          example: Approved
        isFinal:
          type: boolean
          description: Whether the target state is a terminal (final) state.
          example: true
        clientCanTransition:
          type: boolean
          description: 'Whether the client (the authenticated API consumer) is permitted to trigger this transition. When `false`, the transition can only be initiated by Avetta or the supplier.

            '
          example: true
    1.0.0_GetProjectsResponse:
      type: object
      description: Response containing projects data
      properties:
        totalCount:
          type: integer
          description: Total number of projects available
          example: 151
        projects:
          type: array
          description: Array of projects
          items:
            $ref: '#/components/schemas/1.0.0_Project'
      required:
      - totalCount
      - projects
    1.0.0_GetWorkflowResponse:
      type: object
      description: The complete workflow transition graph for all forms within a work request.
      required:
      - workRequestId
      - siteId
      - siteName
      - supplierId
      - supplierName
      - childForms
      properties:
        workRequestId:
          type: string
          description: The unique display identifier of the work request.
          example: '445755'
        workRequestName:
          type:
          - string
          - 'null'
          description: The human-readable name of the work request.
          example: Q1 Safety Inspection
        siteId:
          type: string
          description: The billing identifier of the site associated with the work request.
          example: '250410673'
        siteName:
          type: string
          description: The human-readable name of the site associated with the work request.
          example: Acme Corp - Houston Plant
        supplierId:
          type: string
          description: The billing identifier of the supplier associated with the work request.
          example: '250028423'
        supplierName:
          type: string
          description: The human-readable name of the supplier associated with the work request.
          example: Safety Solutions Inc
        childForms:
          type: array
          description: List of forms belonging to the work request, each with its workflow transition graph.
          items:
            $ref: '#/components/schemas/1.0.0_FormWorkflow'
    1.0.0_AuthenticationErrorResponse:
      type: object
      description: Authentication error response
      properties:
        message:
          type: string
          description: Error message describing the authentication failure
          example: Could not authenticate request.
        code:
          type: string
          description: Specific error code for authentication failures
          example: AUTH.102
      required:
      - message
      - code
    1.0.0_QuestionAndAnswer:
      type: object
      description: Question with its corresponding answer values
      properties:
        questionId:
          type: string
          description: Unique identifier for the question
          example: '177802'
        answerValues:
          type: array
          description: Array of answer values for this question
          items:
            type: string
          example:
          - This is for testing purposes
      required:
      - questionId
      - answerValues
    1.0.0_FormWithAnswers:
      type: object
      description: Form containing categories of questions and answers
      properties:
        formId:
          type: string
          description: Unique identifier for the form
          example: '46896'
        formName:
          type: string
          description: Name of the form
          example: Risk Assessment
        status:
          type: string
          description: Current workflow status of the form (e.g. "In Review", "Approved").
          example: In Review
        nextAvailableStatuses:
          type: array
          description: Workflow statuses this form can transition to from its current state. An empty array indicates the form has reached a terminal state (e.g. "Approved", "Completed") with no further transitions available.
          items:
            type: string
          example:
          - Approved
          - Rejected
        childCategories:
          type: array
          description: Array of question categories within this form
          items:
            $ref: '#/components/schemas/1.0.0_CategoryWithAnswers'
        _links:
          $ref: '#/components/schemas/1.0.0_WebLinks'
      required:
      - formId
      - status
      - nextAvailableStatuses
      - childCategories
      - _links
    1.0.0_GetWorkRequestQuestionsResponse:
      type: object
      description: Response containing work request questions data
      properties:
        workRequestId:
          type: string
          description: Unique identifier for the work request
          example: '177800'
        workRequestName:
          type: string
          description: Name of the work request
          example: wmint
        categories:
          type: array
          description: Array of question categories
          items:
            $ref: '#/components/schemas/1.0.0_QuestionCategory'
        childForms:
          type: array
          description: Array of forms added to the work request
          items:
            $ref: '#/components/schemas/1.0.0_Form'
        isEditable:
          type: boolean
          description: Indicates whether the work request is in a state in which it's questions could be answered.
          example: true
      required:
      - workRequestId
      - categories
      - childForms
      - isEditable
    1.0.0_ResponseOption:
      type: object
      description: Response option for multiple choice questions
      properties:
        displayText:
          type: string
          description: Text displayed to the user
          example: 'Yes'
        storageValue:
          type: string
          description: Value stored when this option is selected
          example: '1'
      required:
      - displayText
      - storageValue
    1.0.0_WorkflowTransition:
      type: object
      description: 'A single transition group: one source state (`from`) and all the states it can move to (`to`). When a source state has multiple destinations (a diverging path), all destinations are listed together in this single entry. Non-terminal destinations are always listed before terminal ones within `to`.

        '
      required:
      - from
      - to
      properties:
        from:
          $ref: '#/components/schemas/1.0.0_WorkflowState'
        to:
          type: array
          description: 'Ordered list of target states reachable from the `from` state. Non-terminal states appear before terminal (final) states.

            '
          items:
            $ref: '#/components/schemas/1.0.0_TransitionTarget'
    1.0.0_WorkRequest:
      type: object
      description: Work request details
      properties:
        projectId:
          type: string
          description: Unique identifier for the project
          example: '427603'
        projectName:
          type: string
          description: Name of the project
          example: wmint
        siteId:
          type: string
          description: Site identifier
          example: '250410673'
        supplierId:
          type: string
          description: Supplier identifier
          example: '250028423'
        workRequestId:
          type: string
          description: Unique identifier for the work request
          example: '427605'
        workRequestName:
          type: string
          description: Name of the work request
          example: wmint
        workRequestStatus:
          type: string
          description: Current status of the work request
          example: In Progress
        createdDate:
          type: string
          format: date-time
          description: Date and time when the work request was created
          example: '2025-08-26T15:52:03.741Z'
        updatedDate:
          type: string
          format: date-time
          description: Date and time when the work request was last updated
          example: '2025-08-26T16:17:21.694Z'
        _links:
          $ref: '#/components/schemas/1.0.0_WebLinks'
      required:
      - projectId
      - projectName
      - siteId
      - supplierId
      - workRequestId
      - workRequestName
      - workRequestStatus
      - createdDate
      - updatedDate
      - _links
    1.0.0_CreateWorkRequestResponse:
      type: object
      description: Response after successfully creating a work request
      properties:
        workRequestId:
          type: string
          description: Unique identifier for the created work request
          example: '445755'
        _links:
          $ref: '#/components/schemas/1.0.0_WebLinks'
      required:
      - workRequestId
      - _links
    1.0.0_UpsertWorkRequestAnswersRequest:
      type: object
      description: Request body for upserting work request answers
      properties:
        categories:
          type: array
          description: Array of categories containing question answers
          items:
            $ref: '#/components/schemas/1.0.0_CategoryAnswers'
      required:
      - categories
    1.0.0_CreateWorkRequestRequest:
      type: object
      description: Request body for creating a new work request
      properties:
        projectId:
          type: string
          description: Unique project identifier (must be created and active)
          example: '40000'
        supplierId:
          type: string
          description: Supplier identifier (must have proper connection to hierarchy)
          example: '250671876'
        siteIds:
          type: array
          description: Array of site identifiers (must belong to the hierarchy associated with clientId)
          items:
            type: string
          example:
          - '25406719'
        workRequestName:
          type: string
          description: Name of the work request. Leading and trailing whitespace is trimmed before validation, so the length limit applies to the trimmed value.
          minLength: 1
          maxLength: 250
          example: Test WR
      required:
      - projectId
      - supplierId
      - siteIds
      - workRequestName
    1.0.0_GetAssignedUsersResponse:
      type: object
      required:
      - totalCount
      - supplierName
      - supplierBillingId
      - users
      properties:
        totalCount:
          type: integer
          description: The total number of assigned users
        workRequestName:
          type:
          - string
          - 'null'
          description: The name of the work request
        supplierName:
          type: string
          description: The name of the supplier
        supplierBillingId:
          type: string
          description: The billing ID of the supplier
        users:
          type: array
          items:
            $ref: '#/components/schemas/1.0.0_User'
    1.0.0_Question:
      type: object
      description: Individual question details
      properties:
        questionId:
          type: string
          description: Unique identifier for the question
          example: '177802'
        question:
          type: string
          description: The question text
          example: 'Work Request Details:'
        questionType:
          type: string
          description: Type of question response expected
          enum:
          - longText
          - shortText
          - multipleChoice
          - dateRangeWithZone
          - fileUpload
          example: longText
        responseOptions:
          type: array
          description: Available response options for multiple choice questions
          items:
            $ref: '#/components/schemas/1.0.0_ResponseOption'
          example: []
        isRequired:
          type: boolean
          description: Whether this question is required to be answered
          example: true
        isEditable:
          type: boolean
          description: Whether this question is able to be answered
          example: true
      required:
      - questionId
      - question
      - questionType
      - responseOptions
      - isRequired
      - isEditable
    1.0.0_FormWorkflow:
      type: object
      description: 'Workflow transition graph for a single form. Describes the form''s current status and every valid state transition available in its workflow, grouped by source state and ordered by first appearance in the workflow definition.

        '
      required:
      - formId
      - currentStatus
      - transitions
      properties:
        formId:
          type: string
          description: Unique display identifier for the form.
          example: '445756'
        formName:
          type:
          - string
          - 'null'
          description: Human-readable name of the form.
          example: Risk Assessment
        currentStatus:
          type: string
          description: The human-readable name of the workflow status the form is currently in.
          example: Under Review
        transitions:
          type: array
          description: 'Ordered list of workflow transition groups. Each entry represents a source state and the set of states it can transition to. An empty array means the form is in a terminal state with no further transitions available.

            '
          items:
            $ref: '#/components/schemas/1.0.0_WorkflowTransition'
    1.0.0_CategoryWithAnswers:
      type: object
      description: 'Category containing questions and their answers. The `allowsMultipleInstances` flag drives the shape of `instances`:

        - `false` → exactly one element, with no `instanceId`.

        - `true`  → zero or more elements, each carrying a stable `instanceId`.

        '
      properties:
        categoryId:
          type: string
          description: Unique identifier for the category
          example: '45500'
        categoryName:
          type: string
          description: Name of the category
          example: Work Request Details
        allowsMultipleInstances:
          type: boolean
          description: Whether this category can hold multiple independent instances (repeatable)
          example: false
        instances:
          type: array
          description: 'One entry per instance of this category. Non-repeatable categories always have exactly

            one instance with no `instanceId`. Repeatable categories have zero or more instances,

            each identified by a non-null `instanceId`.

            '
          items:
            $ref: '#/components/schemas/1.0.0_CategoryInstance'
      required:
      - categoryId
      - categoryName
      - allowsMultipleInstances
      - instances
    1.0.0_ProjectTemplate:
      type: object
      description: Project template details
      properties:
        templateId:
          type: string
          description: Unique identifier for the project template
          example: 68af3d0599450f37bbe9a2fc
        accountId:
          type: string
          description: Account identifier associated with the template
          example: '250410663'
        templateName:
          type: string
          description: Name of the project template
          example: Caterpillar Project
        createdDate:
          type: string
          format: date-time
          description: Date and time when the template was created
          example: '2025-08-27T17:14:45.744Z'
        updatedDate:
          type: string
          format: date-time
          description: Date and time when the template was last updated
          example: '2025-08-27T17:14:45.744Z'
      required:
      - templateId
      - accountId
      - templateName
      - createdDate
      - updatedDate
    1.0.0_CategoryAnswers:
      type: object
      description: Category containing question answers
      properties:
        categoryId:
          type: string
          description: Unique identifier for the category
          example: '46896'
        instanceId:
          type: string
          description: 'Identifier of a specific instance of a repeatable category.

            - Only used when the category is repeatable (`allowsMultipleInstances: true` in the questions response).

            - Omit (or send `null`) to **insert** a new instance — the server generates a new `instanceId`.

            - Provide the `instanceId` returned by `GET .../questions-answers` to **update** an existing instance.

            - Ignored for non-repeatable categories.

            '
          example: 8c7f4d2a-19b3-4e6c-9f10-2b6a5d1a77e0
        questionsAndAnswers:
          type: array
          description: Array of question answers within this category
          items:
            $ref: '#/components/schemas/1.0.0_QuestionAndAnswer'
        childCategories:
          type: array
          description: Optional nested categories (only present for question groups that contain subcategories)
          items:
            $ref: '#/components/schemas/1.0.0_CategoryAnswers'
      required:
      - categoryId
      - questionsAndAnswers
    1.0.0_WorkflowState:
      type: object
      description: Represents a single state in the workflow.
      required:
      - statusId
      - name
      - isFinal
      properties:
        statusId:
          type: string
          description: Unique identifier of the workflow status.
          example: 64a1b2c3d4e5f6a7b8c9d0e1
        name:
          type: string
          description: Human-readable name of the workflow status.
          example: Under Review
        isFinal:
          type: boolean
          description: 'Whether this is a terminal (final) state. A terminal state has no outgoing transitions — the form cannot move to any further state once it reaches one.

            '
          example: false
    1.0.0_CreateChildFormRequest:
      type: object
      description: Request body for creating a child form under a work request
      required:
      - formTemplateId
      properties:
        formTemplateId:
          type: string
          description: Unique identifier of the form template to instantiate. Must be one of the templates returned by the available-child-forms endpoint.
          example: 68191fcb858bfe0c34c12206
    1.0.0_GetWorkRequestQuestionsAnswersResponse:
      type: object
      description: Response containing work request questions and answers data
      properties:
        workRequestId:
          type: string
          description: Unique identifier for the work request
          example: '445755'
        workRequestName:
          type: string
          description: Name of the work request
          example: Test WR
        categories:
          type: array
          description: Array of categories with questions and answers
          items:
            $ref: '#/components/schemas/1.0.0_CategoryWithAnswers'
        childForms:
          type: array
          description: Array of forms added for this work request. Empty array when the work request has no child forms.
          items:
            $ref: '#/components/schemas/1.0.0_FormWithAnswers'
      required:
      - workRequestId
      - workRequestName
      - categories
      - childForms
