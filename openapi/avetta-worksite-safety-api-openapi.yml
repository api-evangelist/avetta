  /v1/clients/{clientId}/work-requests/{workRequestId}/workflow:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    get:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: getWorkflowTransitions
      summary: Get Workflow Transitions
      description: 'Returns the complete workflow transition graph for every form within the specified work request.


        Each form in the response contains a `transitions` array. A **transition group** is a single

        entry in that array: it pairs one source state (`from`) with every state that form can legally

        move to from there (`to`). Reading the groups in order gives you the intended

        progression of the workflow from start to finish.


        The `transitions` array always represents the **complete workflow state machine** — every valid

        transition defined for that form''s workflow type, regardless of where the form currently sits.

        Use `currentStatus` to know the form''s present position, and use `transitions` to understand

        the full map of where it can go. A form that has already reached the terminal state will still

        return the same complete transition graph as a form that has not yet started.


        A workflow has exactly one terminal state — the successful outcome (e.g. "Acknowledged"). All

        other states, including rejection or rework states, are non-terminal: they have their own

        outgoing transitions that route the form back through the workflow so it can eventually reach

        the terminal state.


        **Divergent paths** — where a single state can move to more than one destination — occur when

        a review transition can either advance the form (toward the terminal state) or send it back for

        rework (e.g. "Rejected"). Both destinations appear in one transition group. Because the rework

        destination is non-terminal, it will also appear as the `from` state of a subsequent group,

        showing where the form continues after rework. You may therefore see a group whose source state

        was already listed as a destination earlier — this is intentional and represents the form

        re-entering the workflow after a rework transition.


        **Key behaviours:**

        - Transition groups are ordered by the first time each source state is encountered in the workflow, reflecting the intended workflow sequence.

        - When a source state has multiple destinations, all are listed in one group — non-terminal (rework/intermediate) states first, then the terminal (final) state last.

        - A rework state (e.g. "Rejected") is non-terminal: it will have its own transition group showing where the form continues, typically looping back toward the divergent transition.

        - The `transitions` array is the same complete graph regardless of `currentStatus` — it never filters transitions based on where the form currently is.


        **Note**: The `clientId` must match the hierarchy node where the work request was created, or one of its ancestors.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '315425021'
      - name: workRequestId
        in: path
        required: true
        description: The unique identifier of the work request
        schema:
          type: string
        example: '445755'
      responses:
        '200':
          description: Successfully retrieved workflow transitions for all forms in the work request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_GetWorkflowResponse'
              examples:
                MultipleFormsWithTransitions:
                  summary: Two forms sharing the same workflow — one mid-workflow, one at the terminal state. Both return the identical complete transition graph.
                  value:
                    workRequestId: '445755'
                    workRequestName: Q1 Safety Inspection
                    siteId: '250410673'
                    siteName: Acme Corp - Houston Plant
                    supplierId: '250028423'
                    supplierName: Safety Solutions Inc
                    childForms:
                    - formId: '445756'
                      formName: Risk Assessment
                      currentStatus: Under Review
                      transitions:
                      - from:
                          statusId: 64a1b2c3d4e5f6a7b8c9d0e1
                          name: Under Review
                          isFinal: false
                        to:
                        - statusId: 64a1b2c3d4e5f6a7b8c9d0e3
                          name: Rejected
                          isFinal: false
                          clientCanTransition: false
                        - statusId: 64a1b2c3d4e5f6a7b8c9d0e2
                          name: Acknowledged
                          isFinal: true
                          clientCanTransition: false
                      - from:
                          statusId: 64a1b2c3d4e5f6a7b8c9d0e3
                          name: Rejected
                          isFinal: false
                        to:
                        - statusId: 64a1b2c3d4e5f6a7b8c9d0e1
                          name: Under Review
                          isFinal: false
                          clientCanTransition: true
                    - formId: '445757'
                      formName: Work Permit
                      currentStatus: Acknowledged
                      transitions:
                      - from:
                          statusId: 64a1b2c3d4e5f6a7b8c9d0e1
                          name: Under Review
                          isFinal: false
                        to:
                        - statusId: 64a1b2c3d4e5f6a7b8c9d0e3
                          name: Rejected
                          isFinal: false
                          clientCanTransition: false
                        - statusId: 64a1b2c3d4e5f6a7b8c9d0e2
                          name: Acknowledged
                          isFinal: true
                          clientCanTransition: false
                      - from:
                          statusId: 64a1b2c3d4e5f6a7b8c9d0e3
                          name: Rejected
                          isFinal: false
                        to:
                        - statusId: 64a1b2c3d4e5f6a7b8c9d0e1
                          name: Under Review
                          isFinal: false
                          clientCanTransition: true
        '400':
          description: Bad Request — the specified `workRequestId` does not refer to a work request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '403':
          description: Forbidden — the authenticated user does not have access to the specified client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
