        description: MOCK
      operationId: putAssignWorkRequest
      summary: Assign Work Request
      description: 'Assigns a work request by advancing its workflow one configured transition forward into its first

        non-terminal status (e.g. "In Progress"). The target status is derived from the workflow, so no

        request body is required.


        **Rules:**

        - The work request must exist, be a supplier root, and belong to the caller''s client hierarchy.

        - The parent project must be active (not deleted, inactive, or archived).

        - A non-terminal status must be reachable in one configured transition from the current status, and that

        status must include the client (not strictly supplier or internal).

        - Every dependent form gated for the assign target status must be complete (`processWorkflow`

        calculations). A calculation that gates a different status (such as completion/close) does not

        block the assign.

        - Every required question the client can edit must have at least one non-empty answer, except those

        hidden by a `condition` calculation given the current answers.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '4283746'
      - name: workRequestId
        in: path
        required: true
        description: The unique identifier of the work request
        schema:
          type: string
        example: '445755'
      responses:
        '204':
          description: Work request successfully assigned and workflow advanced to its next non-terminal status
        '400':
          description: Work request cannot be assigned
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
