  /v1/clients/{clientId}/work-requests/{workRequestId}/child-forms:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    post:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: postCreateChildForm
      summary: Create Child Form
      description: 'Creates a child form of the given form template under a work request.


        **Rules:**

        - The `formTemplateId` must be one of the templates returned by `GET /v1/clients/{clientId}/work-requests/{workRequestId}/available-child-forms`.

        - Per-template restriction calculations attached to the work request template are evaluated against the work request''s current state. If any of them flags the requested `formTemplateId` as currently restricted, the request is rejected.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '4283746'
      - name: workRequestId
        in: path
        required: true
        description: The unique identifier of the work request
        schema:
          type: string
        example: '40000'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/1.0.0_CreateChildFormRequest'
            examples:
              CreateChildForm:
                value:
                  formTemplateId: 68191fcb858bfe0c34c12206
      responses:
        '200':
          description: Child form successfully created under the work request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_CreateChildFormResponse'
              examples:
                SuccessfulResponse:
                  value:
                    message: Form created successfully
                    formId: '434711'
                    _links:
                      web:
                        href: https://app.avetta.com/avt-cli/processes/process-tree/688a5808a86cf933395a239c/68bae9602342b50861bad961
        '400':
          description: Child form cannot be created
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                InvalidChildFormTemplate:
                  value:
                    message: Form template 68191fcb858bfe0c34c12206 is not available for work request 40000.
                    code: PROCESSSERVICE.7
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
                ChildFormCreationBlocked:
                  value:
                    message: 'Cannot create child form 68191fcb858bfe0c34c12206 under work request 40000: The work request has been closed. Child forms can no longer be added.'
                    code: PROCESSSERVICE.8
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
                ChildFormNotManuallyCreatable:
                  value:
                    message: Form template 68191fcb858bfe0c34c12206 cannot be manually created for work request 40000.
                    code: PROCESSSERVICE.9
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
        '403':
          description: Forbidden – The user is not authorized to access this resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                Forbidden:
                  value:
                    message: User is not authorized to access workRequestId 40000.
                    code: PROCESSSERVICE.3
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '404':
          description: Work request not found
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                    example: work request 40000 is invalid.
                  code:
                    type: string
                    example: PROCESSSERVICE.2
                  correlationId:
                    type: string
                    example: c1a2b3d4-5678-90ab-cdef-1234567890ab
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
                  code:
                    type: string
                    example: PROCESSSERVICE.500
                  correlationId:
                    type: string
                    example: e7c9a1b2-3456-7890-abcd-ef1234567890
  /v1/clients/{clientId}/work-requests/{workRequestId}/assigned-users:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    get:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: getWorkRequestAssignedUsers
      summary: Get Work Request Assigned Users
      description: 'Retrieves all assigned users for the specified work request.


        **Note**: The client must ensure the `clientId` used matches the node in the hierarchy where the work request was created.

        Optionally filter by user type using the `userType` query parameter. If not provided, all assigned users are returned.


        **Valid userType values**: `connectSupplier`, `workerManagementWorker`, `workforceManagementWorker`'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The client billingId linked to the work request
        schema:
          type: string
        example: '315425021'
      - name: workRequestId
        in: path
        required: true
        description: The unique identifier of the work request
        schema:
          type: string
        example: '427605'
      - name: userType
        in: query
        required: false
        description: Filter assigned users by user provider type. If not provided, returns all assigned users.
        schema:
          type: string
          enum:
          - connectSupplier
          - workerManagementWorker
          - workforceManagementWorker
        example: connectSupplier
      responses:
        '200':
          description: Successfully retrieved assigned users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_GetAssignedUsersResponse'
              examples:
                SuccessfulResponse:
                  value:
                    totalCount: 2
                    workRequestName: Safety Inspection Q1
                    supplierName: ABC Construction
                    supplierBillingId: '250028423'
                    users:
                    - userId: '12345'
                      firstName: John
                      lastName: Doe
                      userType: connectSupplier
                    - userId: '12346'
                      firstName: Jane
                      lastName: Smith
                      userType: workerManagementWorker
                FilteredByUserType:
                  value:
                    totalCount: 1
                    workRequestName: Safety Inspection Q1
                    supplierName: ABC Construction
                    supplierBillingId: '250028423'
                    users:
                    - userId: '12345'
                      firstName: John
                      lastName: Doe
                      userType: connectSupplier
        '400':
          description: Bad Request - Invalid userType value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
              examples:
                InvalidUserType:
                  value:
                    message: Invalid userType
                    details: 'userType must be one of: connectSupplier, workerManagementWorker, workforceManagementWorker'
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '404':
          description: Work request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
              examples:
                WorkRequestNotFound:
                  value:
                    message: Work request not found
                    details: 'No work request found with id: 427605'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
    patch:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: updateWorkRequestAssignedUsers
      summary: Update Work Request Assigned Users
      description: 'Updates the assigned users for the specified work request.


        This endpoint allows adding and removing users from the work request assignment list.


        **Note**: The client must ensure the `clientId` used matches the node in the hierarchy where the work request was created.'
