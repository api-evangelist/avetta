openapi: 3.2.0
info:
  title: Avetta Worksite Safety API
  version: 1.0.0
  description: 'Operations tagged Worksite-Safety across 2 of this provider''s published API definitions: avetta-connect-dist.json, avetta-connect-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.avetta.com
  description: Production (as named in the Client API Service documentation examples)
tags:
- name: Worksite-Safety
  x-displayName: Worksite Safety
  description: Worksite safety management operations including work requests and project management
paths:
  /v1/clients/{clientId}/project/templates:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    get:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: getProjectTemplates
      summary: Get Project Templates
      description: 'Retrieves project templates for the specified client. The `clientId` represents either corporate, hub,

        or site level in the hierarchy.


        **Note**: If corporate `clientId` used, the user will have access to the entire templates list associated to the client hierarchy.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '315425021'
      - name: start
        in: query
        description: The record to start with for pagination (0-based)
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: limit
        in: query
        description: The total number of records to return, maximum of 500
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        example: 100
      responses:
        '200':
          description: Successfully retrieved project templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_GetProjectTemplatesResponse'
              examples:
                SuccessfulResponse:
                  value:
                    totalCount: 1
                    templates:
                    - templateId: 68af3d0599450f37bbe9a2fc
                      accountId: '250410663'
                      templateName: Caterpillar Project
                      createdDate: '2025-08-27T17:14:45.744Z'
                      updatedDate: '2025-08-27T17:14:45.744Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
  /v1/clients/{clientId}/projects:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    get:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: getProjects
      summary: Get Projects
      description: 'Retrieves projects for the specified client. The `clientId` represents either corporate, hub,

        or site level in the hierarchy.


        **Note**: For optimal performance, use the hierarchy level associated with the user account. If corporate `clientId` used, the user will have access to the entire project list associated to the client hierarchy.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '315425021'
      - name: isArchived
        in: query
        description: Filter by archived projects. Defaults to false.
        schema:
          type: boolean
          default: false
        example: true
      - name: projectId
        in: query
        description: Filter by the unique project identifier. When provided, all other query parameters are ignored.
        schema:
          type: string
        example: '412507'
      - name: siteId
        in: query
        description: Filter by unique client site identifier.
        schema:
          type: string
        example: '250410657'
      - name: supplierId
        in: query
        description: Filter by unique supplier identifier
        schema:
          type: string
        example: '250026886'
      - name: workRequestStatus
        in: query
        description: Filter by work request status. Matches the workflow status name (e.g. "In Progress").
        schema:
          type: string
        example: In Progress
      - name: name
        in: query
        description: Filter by project name
        schema:
          type: string
        example: Maintenance Project
      - name: start
        in: query
        description: The record to start with for pagination (0-based)
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: limit
        in: query
        description: The total number of records to return, maximum of 500
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        example: 100
      responses:
        '200':
          description: Successfully retrieved projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_GetProjectsResponse'
              examples:
                SuccessfulResponse:
                  value:
                    totalCount: 151
                    projects:
                    - projectId: '412507'
                      projectName: Test
                      isArchived: false
                      status: Open
                      createdDate: '2025-07-29T20:57:05.213Z'
                      updatedDate: '2025-07-29T20:57:05.562Z'
                      _links:
                        web:
                          href: https://app.avetta.com/avt-cli/processes/68bae9602342b50861bad961
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
    post:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: createProject
      summary: Create Project
      description: 'Creates a new project for the specified client. The clientId represents either corporate, hub,

        or site level in the hierarchy.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '315425021'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/1.0.0_CreateProjectRequest'
            examples:
              CreateProjectExample:
                value:
                  projectName: Test Project
                  templateId: 68af3d0599450f37bbe9a2fc
      responses:
        '200':
          description: Successfully created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_CreateProjectResponse'
              examples:
                SuccessfulCreation:
                  value:
                    projectId: '434710'
                    _links:
                      web:
                        href: https://app.avetta.com/avt-cli/processes/68bae9602342b50861bad961
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
  /v1/clients/{clientId}/projects/{projectId}/archive:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    put:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: putArchiveProject
      summary: Archive Project
      description: 'Archives a project that has been closed.


        **Rules:**

        - The project must be closed.

        - If the project is not closed, the request will be rejected.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '4283746'
      - name: projectId
        in: path
        required: true
        description: The unique identifier of the project
        schema:
          type: string
        example: '40000'
      responses:
        '204':
          description: Project successfully archived
        '400':
          description: Project cannot be archived
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                ProjectNotClosed:
                  value:
                    message: 'Cannot archive project 859375: not closed.'
                    code: PROCESSSERVICE.1
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
        '403':
          description: Forbidden – The user is not authorized to access this resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                ProjectNotClosed:
                  value:
                    message: User is not authorized to access projectId 859375.
                    code: PROCESSSERVICE.1
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                    example: projectId 85937511 not found.
                  code:
                    type: string
                    example: PROCESSSERVICE.1
                  correlationId:
                    type: string
                    example: c1a2b3d4-5678-90ab-cdef-1234567890ab
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
                  code:
                    type: string
                    example: PROCESSSERVICE.500
                  correlationId:
                    type: string
                    example: e7c9a1b2-3456-7890-abcd-ef1234567890
  /v1/clients/{clientId}/projects/{projectId}/close:
    servers:
    - url: https://api.avetta.com/worksite-safety-management
      description: PROD
    - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
      description: MOCK
    put:
      servers:
      - url: https://api.avetta.com/worksite-safety-management
        description: PROD
      - url: https://virtserver.swaggerhub.com/Avet7/WorkSiteSafety/1.0.0
        description: MOCK
      operationId: putCloseProject
      summary: Close Project
      description: 'Closes a project once all associated work requests have reached their required completion status.


        **Rules:**

        - All work requests associated with the project must be in their required completion status before the project can be closed.

        - If any work requests are not yet complete, the request will be rejected.'
      tags:
      - Worksite-Safety
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client (corporate, hub, or site level)
        schema:
          type: string
        example: '4283746'
      - name: projectId
        in: path
        required: true
        description: The unique identifier of the project
        schema:
          type: string
        example: '40000'
      responses:
        '204':
          description: Project successfully closed and workflow transitioned to terminal state
        '400':
          description: Project cannot be closed
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                WorkRequestsNotComplete:
                  value:
                    message: 'Cannot close project 859375: work requests are not complete.'
                    code: PROCESSSERVICE.4
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
                NoTerminalStateReachable:
                  value:
                    message: 'Cannot close project 859375: no terminal state is reachable from the current workflow status.'
                    code: PROCESSSERVICE.1
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
        '403':
          description: Forbidden – The user is not authorized to access this resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  correlationId:
                    type: string
              examples:
                Forbidden:
                  value:
                    message: User is not authorized to access projectId 859375.
                    code: PROCESSSERVICE.3
                    correlationId: 3fdcadff-7202-4de9-9800-2512a6a114b3
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                    example: project 85937511 is invalid.
                  code:
                    type: string
                    example: PROCESSSERVICE.2
                  correlationId:
                    type: string
                    example: c1a2b3d4-5678-90ab-cdef-1234567890ab
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - correlationId
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
                  code:
                    type: string
                    example: PROCESSSERVICE.500
                  correlationId:
                    type: string
                    example: e7c9a1b2-3456-7890-abcd-ef1234567890
