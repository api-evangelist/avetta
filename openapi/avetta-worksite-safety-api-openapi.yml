                  - '4802531'
              AddAndRemoveUsers:
                value:
                  usersToBeAdded:
                  - '4802531'
                  - '4802532'
                  usersToBeRemoved:
                  - '4802500'
      responses:
        '200':
          description: Successfully updated assigned users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
              examples:
                UserNotFound:
                  value:
                    message: User 4802531 not found for workRequestId 704662
                    code: PROCESSSERVICE.0
                    correlationId: 17f9b297-b912-406e-953c-42e98717b414
        '401':
          description: Unauthorized - API key required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_AuthenticationErrorResponse'
              examples:
                AuthenticationFailure:
                  value:
                    message: Could not authenticate request.
                    code: AUTH.102
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_ErrorResponse'
