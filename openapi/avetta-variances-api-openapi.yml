openapi: 3.2.0
info:
  title: Avetta Variances API
  version: '2026-05-08'
  license:
    name: Trade secret
    url: https://avetta.com
  description: 'Operations tagged Variances across 2 of this provider''s published API definitions: avetta-worker-v1.json, avetta-worker-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{environment}.avetta.com/api/v1
  variables:
    environment:
      default: worker
      enum:
      - worker
      - au-worker
security:
- ApiKeyAuth: []
tags:
- name: Variances
  description: The Variances API allows you to retrieve variance information or create a variance.
paths:
  /variances:
    get:
      operationId: getVariances
      tags:
      - Variances
      summary: List of variances
      description: Returns a list of variances that could be filtered by the given parameters
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/components-parameters-showAllParam'
      - $ref: '#/components/parameters/variances_components-parameters-searchParam'
      - $ref: '#/components/parameters/components-parameters-typeParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/statusParam'
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/parameters-srchIDParam'
      - $ref: '#/components/parameters/parameters-searchTypeParam'
      - $ref: '#/components/parameters/searchRoleParam'
      - $ref: '#/components/parameters/searchSiteParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulVariances'
        '201':
          $ref: '#/components/responses/variancesErrors'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    post:
      operationId: insertVariance
      tags:
      - Variances
      summary: Save a new variance
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/lngIDParam'
      - $ref: '#/components/parameters/components-parameters-docIDParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/variances_components-parameters-searchParam'
      - $ref: '#/components/parameters/components-parameters-typeParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/statusParam'
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/components-parameters-showAllParam'
      - $ref: '#/components/parameters/parameters-srchIDParam'
      - $ref: '#/components/parameters/parameters-searchTypeParam'
      requestBody:
        $ref: '#/components/requestBodies/varianceData'
      responses:
        '200':
          $ref: '#/components/responses/postMessages'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /variances/{id}:
    get:
      operationId: getVarianceID
      tags:
      - Variances
      summary: List data for a variance
      description: Returns the variance detail by the given id
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/lngIDParam'
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/components-parameters-docIDParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/variances_components-parameters-searchParam'
      - $ref: '#/components/parameters/components-parameters-typeParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/statusParam'
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/components-parameters-showAllParam'
      - $ref: '#/components/parameters/parameters-srchIDParam'
      - $ref: '#/components/parameters/parameters-searchTypeParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulVariances'
        '201':
          $ref: '#/components/responses/variancesErrors'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    post:
      operationId: postVariancesID
      tags:
      - Variances
      summary: Save changes on a variance
      description: Update the variance data with the data provided for the given id
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/lngIDParam'
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/components-parameters-docIDParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/variances_components-parameters-searchParam'
      - $ref: '#/components/parameters/components-parameters-typeParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/statusParam'
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/components-parameters-showAllParam'
      requestBody:
        $ref: '#/components/requestBodies/varianceData'
      responses:
        '200':
          $ref: '#/components/responses/postMessages'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /variances/count:
    get:
      operationId: getVariancesCount
      tags:
      - Variances
      summary: Count of variances
      description: Returns the count of variances.
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Successful - Show count of variances
          content:
            application/json:
              schema:
                type: object
                format: object
                properties:
                  stats:
                    $ref: '#/components/schemas/statsSchema'
                  timecard:
                    type: object
                    properties:
                      count:
                        type: integer
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /variances/fields:
    get:
      operationId: getVariancesFields
      tags:
      - Variances
      summary: List fields in variance - no Data
      description: Returns a list of the fields in variances not related to any variance
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/lngIDParam'
      - $ref: '#/components/parameters/variances_components-parameters-searchParam'
      - $ref: '#/components/parameters/parameters-searchTypeParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/components-parameters-typeParam'
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/statusParam'
      - $ref: '#/components/parameters/components-parameters-showAllParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      responses:
        '200':
          $ref: '#/components/responses/fieldsVariances'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /variances/{id}/fields:
    get:
      operationId: getVarianceFieldsID
      tags:
      - Variances
      summary: List fields with data for a variance
      description: Returns a list of the fields in variances and the values for the given variance id
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/variances_components-parameters-searchParam'
      - $ref: '#/components/parameters/parameters-searchTypeParam'
      - $ref: '#/components/parameters/components-parameters-accountIDParam'
      - $ref: '#/components/parameters/components-parameters-typeParam'
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/statusParam'
      - $ref: '#/components/parameters/showAllParamVariance'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      responses:
        '200':
          $ref: '#/components/responses/fieldsVariances'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /variances/docs:
    post:
      operationId: postVariancesDocs
      tags:
      - Variances
      summary: Store temp file for a new variance
      description: Store temp the given file for a new variance
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/parameters-srchIDParam'
      requestBody:
        $ref: '#/components/requestBodies/docVarianceData'
      responses:
        '200':
          $ref: '#/components/responses/messagesDocVariances'
        '201':
          $ref: '#/components/responses/errorFile'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
  /variances/{id}/docs:
    post:
      operationId: postVarianceDocsID
      tags:
      - Variances
      summary: Store temp file or delete for an existing variance
      description: Store the given file for the variance given by id
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/components-parameters-userIDParam'
      - $ref: '#/components/parameters/parameters-srchIDParam'
      requestBody:
        $ref: '#/components/requestBodies/docVarianceData'
      responses:
        '200':
          $ref: '#/components/responses/messagesDocVariances'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    servers:
    - url: https://{environment}.avetta.com/api/v1
      variables:
        environment:
          default: worker
          enum:
          - worker
          - au-worker
components:
  responses:
    parameterNotRecognized:
      description: Parameter not recognized
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              data:
                $ref: '#/components/schemas/messageSchema'
          examples:
            parameterNotRecognized:
              $ref: '#/components/examples/parameterNotRecognized'
    messagesDocVariances:
      description: Successful message return after insert or update a variance
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              auth:
                $ref: '#/components/schemas/messageSchema'
          examples:
            fileUploaded:
              $ref: '#/components/examples/fileUploaded'
            fileDeleted:
              $ref: '#/components/examples/fileDeleted'
            deleteFile:
              $ref: '#/components/examples/examples-deleteFile'
            systemAdminChangeDocuments:
              $ref: '#/components/examples/systemAdminChangeDocuments'
            missingSearchID:
              $ref: '#/components/examples/missingSearchID'
            missingParameters:
              $ref: '#/components/examples/examples-missingParameters'
            invalidCall:
              $ref: '#/components/examples/examples-invalidCall'
            failedToUploadFile:
              $ref: '#/components/examples/examples-failedToUploadFile'
    variancesErrors:
      description: Error message returned
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              auth:
                $ref: '#/components/schemas/messageSchema'
          examples:
            failedFindVariance:
              $ref: '#/components/examples/failedFindVariances'
    fieldsVariances:
      description: Successful - Show fields of variance
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              fields:
                type: array
                items:
                - $ref: '#/components/schemas/fieldVariancesSchema'
              files:
                type: array
                items:
                - $ref: '#/components/schemas/filesVariancesSchema'
          examples:
            fieldsVariancesWithoutID:
              $ref: '#/components/examples/fieldsVariancesWithoutID'
            fieldsVariancesWithID:
              $ref: '#/components/examples/fieldsVariancesWithID'
    successfulVariances:
      description: Successful - Show variance information
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              variances:
                type: array
                items:
                - $ref: '#/components/schemas/varianceSchema'
    errorFile:
      description: Error while checking files
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              data:
                allOf:
                - $ref: '#/components/schemas/messageSchema'
                - type: object
                  properties:
                    virusName:
                      type: string
                      description: Name of the virus found in the file
                      example: sample virus name
                    maxSize:
                      type: integer
                      description: Maximum size allowed for the file
                      example: 10
                    size:
                      type: number
                      description: Size of the file checked
                      example: 10.5390701293945
                    allowedExtensions:
                      type: array
                      description: List of allowed extensions for the file
                      example:
                      - t3
                      - mid
                      - zip
                      - rtf
                      - docx
                      - tar
                      - midi
                      - tif
                      - m4a
                      - png
                      - xps
                      - xml
                      - mp3
                      - htm
                      - gz
                      - mp4
                      - doc
                      - tiff
                      - jpeg
                      - avi
                      - mpeg
                      - qst
                      - txt
                      - wmv
                      - msg
                      - xlsx
                      - webp
                      - gif
                      - html
                      - bmp
                      - csv
                      - pdf
                      - jpg
                      - xls
                      - swf
                      - mov
                      - dng
                      - heic
                      items:
                        type: string
                        enum:
                        - t3
                        - mid
                        - zip
                        - rtf
                        - docx
                        - tar
                        - midi
                        - tif
                        - m4a
                        - png
                        - xps
                        - xml
                        - mp3
                        - htm
                        - gz
                        - mp4
                        - doc
                        - tiff
                        - jpeg
                        - avi
                        - mpeg
                        - qst
                        - txt
                        - wmv
                        - msg
                        - xlsx
                        - webp
                        - gif
                        - html
                        - bmp
                        - csv
                        - pdf
                        - jpg
                        - xls
                        - swf
                        - mov
                        - dng
                        - heic
          examples:
            virusCheck:
              $ref: '#/components/examples/virusCheck'
            sizeCheck:
              $ref: '#/components/examples/sizeCheck'
            extensionCheck:
              $ref: '#/components/examples/extensionCheck'
    errorSecurity:
      description: Error while checking security
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              data:
                $ref: '#/components/schemas/messageSchema'
          examples:
            errorSecurity:
              $ref: '#/components/examples/errorSecurity'
    postMessages:
      description: Successful message return after insert or update a variance
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              auth:
                $ref: '#/components/schemas/messageSchema'
          examples:
            savedVariance:
              $ref: '#/components/examples/savedVariance'
            failedSaveVariance:
              $ref: '#/components/examples/failedSaveVariance'
            endDateBeforeToday:
              $ref: '#/components/examples/endDateBeforeToday'
            endDateBeforeStartDate:
              $ref: '#/components/examples/endDateBeforeStartDate'
            mustHaveStartDate:
              $ref: '#/components/examples/mustHaveStartDate'
            greenVarianceMustHaveEndDate:
              $ref: '#/components/examples/greenVarianceMustHaveEndDate'
            failedfindVariance:
              $ref: '#/components/examples/failedfindVariance'
  examples:
    examples-missingParameters:
      summary: Missing parameters
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        variances:
          message: Missing parameters
          status: Bad request
          success: false
          code: 400
          detail: null
    greenVarianceMustHaveEndDate:
      summary: Green variance must have end date
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 1
          records: 1
        variances:
          message: Green variance must have end date
          status: Unauthorized
          success: false
          code: 400
          detail: VAR.102
    fieldsVariancesWithoutID:
      summary: Fields in variances - no values
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        fields:
        - key: VrnUsrID
          label: Worker
          type: 522
          value: null
          order: 1
          readonly: true
          help: ''
          validation:
            required: true
            maxlength: null
        - key: VrnRefTypID
          values:
          - value: Requirement
            id: 2012
          - value: Role
            id: 2016
          - value: Site
            id: 2011
          readonly: true
          order: 2
          type: 508
          help: ''
          label: Type
          value: null
          validation:
            required: true
            maxlength: null
        - key: VrnRefID
          validation:
            required: true
            maxlength: null
          typename: popup
          type: 503
          help: ''
          label: Target
          value: null
          readonly: true
          order: 3
        - key: VrnGrpID
          order: 4
          readonly: true
          validation:
            required: false
            maxlength: null
          value: null
          help: ''
          label: Site
          type: 513
        - key: VrnStatusTypID
          values:
          - value: Green
            id: 741
          - value: Red
            id: 743
          order: 5
          readonly: false
          value: null
          label: Status
          help: ''
          type: 508
        - key: VrnBeginDateTime
          order: 6
          readonly: false
          validation:
            required: true
            maxlength: null
          value: null
          help: ''
          label: Start Date
          type: 518
        - key: VrnEndDateTime
          order: 7
          readonly: false
          validation:
            required: false
            minvalue: '2023-10-27'
            maxlength: null
          value: null
          help: ''
          label: End Date
          type: 518
        - key: VrnReason
          order: 8
          readonly: false
          validation:
            required: true
            maxlength: 4000
          value: null
          help: ''
          label: Reason
          type: 502
        - key: srch_id
          readonly: true
          value: 231027000
          type: 503
          typename: hidden
        files: []
    examples-deleteFile:
      summary: Delete file - empty temp
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        variances:
          message: Delete file
          status: Success
          success: true
          code: 200
          detail: Empty temp
    errorSecurity:
      summary: Error security
      value:
        stats:
          command: Auth
          version: v1
          type: token
          msg: unauthorized
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        data:
          success: false
          code: 401
    virusCheck:
      summary: Virus check error
      value:
        stats:
          command: Auth
          version: v1
          type: token
          msg: unauthorized
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        data:
          success: false
          code: 400
          status: Bad Request
          detail: UPLOADERROR.103
          message: This file might be infected with a virus
          virusName: sample virus name
    failedfindVariance:
      summary: Failed to find variance
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 1
          records: 1
        variances:
          message: Failed to find variance
          status: Unauthorized
          success: false
          code: 400
          detail: VAR.101
    mustHaveStartDate:
      summary: Must have start date
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 1
          records: 1
        variances:
          message: Must have start date
          status: Unauthorized
          success: false
          code: 400
          detail: VAR.103
    fileUploaded:
      summary: File uploaded
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 1
          records: 1
        variances:
          message: File uploaded
          status: Success
          success: true
          code: 200
          detail: The name of the file uploaded
    parameterNotRecognized:
      summary: Parameter not recognized
      value:
        stats:
          command: Auth
          version: v1
          type: token
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        data:
          message: Malformed request syntax
          status: Bad Request
          success: false
          code: 400
    extensionCheck:
      summary: Extension check error
      value:
        stats:
          command: Auth
          version: v1
          type: token
          msg: unauthorized
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
          records: 0
        data:
          success: false
          code: 400
          status: Bad Request
          detail: UPLOADERROR.101
          message: The file extension is not allowed
          allowedExtensions:
          - t3
          - mid
          - zip
          - rtf
          - docx
          - tar
          - midi
          - tif
          - m4a
          - png
          - xps
          - xml
          - mp3
          - htm
          - gz
          - mp4
          - doc
          - tiff
          - jpeg
          - avi
          - mpeg
          - qst
          - txt
          - wmv
          - msg
          - xlsx
          - webp
          - gif
          - html
          - bmp
          - csv
          - pdf
          - jpg
          - xls
          - swf
          - mov
          - dng
          - heic
    examples-failedToUploadFile:
      summary: Failed to upload file
      value:
        stats:
          command: Variances
          version: v1
          type: token
          msg: Good
          start: 1
          time: 0.71513
          limit: 3000
          owner: 1234567890
          count: 0
