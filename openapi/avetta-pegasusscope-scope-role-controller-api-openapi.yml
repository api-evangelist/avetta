components:
  schemas:
    3.29.14_NaturalKeyResource:
      type: object
      properties:
        extSysKey:
          type: string
        idKey:
          type: string
    3.29.14_RoleAssignmentSummaryResource:
      type: object
      properties:
        id:
          type: integer
