        person:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        role:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        active:
          type: boolean
        suspended:
          type: boolean
        expiry:
          type: string
        status:
          type: string
          enum:
          - ALL
          - COMPLETE
          - WORKING_TOWARDS
          - PAST_OR_INACTIVE
          - SUSPENDED
        updateTime:
          type: string
        pending:
          type: boolean
        assignmentPending:
          type: boolean
        assignmentActive:
          type: boolean
        hasUnfilledOptionalCompetencies:
          type: boolean
    3.29.14_StatusType:
