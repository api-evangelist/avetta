        active:
          type: boolean
        definitionId:
          type: integer
          format: int32
          deprecated: true
        definitionScope:
          $ref: '#/components/schemas/3.29.14_ScopeDetailResource'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_RoleStepResource'
    3.29.14_CompetencyDefinitionSummaryResource:
      type: object
      properties:
        stubId:
          type: integer
          format: int32
        competencyId:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        duration:
          type: integer
          format: int32
        durationUnit:
          type: string
          enum:
          - Days
          - Weeks
          - Months
          - Years
        groupCompetency:
          type: boolean
        verifiedDocument:
          type: boolean
        allowTrainingBookings:
          type: boolean
        external:
          type: boolean
        active:
          type: boolean
        hideFileUpload:
          type: boolean
        externalId:
          $ref: '#/components/schemas/3.29.14_KeyedStringResource'
        clientKey:
          $ref: '#/components/schemas/3.29.14_NaturalKeyResource'
        scope:
          $ref: '#/components/schemas/3.29.14_ScopeDetailResource'
        suffix:
          type: string
        level:
          type: string
        global:
          type: string
        verifiedDocumentIssueMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        verifiedDocumentExpiryMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        nonVerifiedDocumentIssueMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        nonVerifiedDocumentExpiryMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
    3.29.14_RoleStepResource:
      type: object
      properties:
        step:
          type: string
          enum:
          - ASSESSED
          - AUTHORISED
          - APPOINTED
        mandatory:
          type: boolean
    3.29.14_RoleCompetencyResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        competency:
          $ref: '#/components/schemas/3.29.14_CompetencyDefinitionResource'
        mandatory:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - CONDITIONAL
        mandatoryCondition:
          type: string
        minimumValidityDaysBeforeRenewal:
          type: integer
          format: int32
    3.29.14_FileUploadRequirementResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        mandatoryStatus:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - CONDITIONAL
        mandatoryConditionalText:
          type: string
        requirementsDescription:
          type: string
        helpLinkUrl:
          type: string
        fileType:
          type: string
        fileSizeBytes:
          type: integer
          format: int32
        mimetypes:
          uniqueItems: true
          type: array
          items:
            type: string
        downloadableDocId:
          type: integer
          format: int32
        allowOnlineAssessment:
          type: boolean
        issueDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
        expiryDateMandatoryStatus:
          type: string
          enum:
          - NOT_ALLOWED
          - OPTIONAL
          - MANDATORY
    3.29.14_RoleCompositionResource:
