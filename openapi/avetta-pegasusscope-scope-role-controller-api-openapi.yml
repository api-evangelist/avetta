          type: string
        active:
          type: boolean
        portalId:
          type: integer
          format: int32
        autoAssignRoles:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        workScopes:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_WorkScopeResource'
        fileUploadRequirements:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_FileUploadRequirementResource'
