    3.29.14_CompetencyResource:
      type: object
      properties:
        stubId:
          type: integer
          format: int32
        competencyId:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        duration:
          type: integer
          format: int32
        durationUnit:
          type: string
          enum:
          - Days
          - Weeks
          - Months
          - Years
        groupCompetency:
          type: boolean
        verifiedDocument:
          type: boolean
        allowTrainingBookings:
