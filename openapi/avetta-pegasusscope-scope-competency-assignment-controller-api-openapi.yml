        schema:
          type: integer
          default: 0
      - name: page.size
        in: query
        description: The number of results to return per page
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_PagePersonCompetencyResource'
        '400':
          description: Bad Request
          content:
