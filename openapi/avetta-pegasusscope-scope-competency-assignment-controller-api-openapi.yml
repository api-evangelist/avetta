      - 3.29.14_security_auth: []
        3.29.14_security_apikey: []
      summary: Get competency assignments for scope
      x-summary-source: derived
    servers:
    - description: EPE (Test Environment)
      url: https://epe-onsitetrackeasy.com.au/onsite-rest
    - description: Production
      url: https://secure.onsitetrackeasy.com.au/onsite-rest
  /api/v1/scope/{scopeId}/competency-assignment/changes:
    get:
      tags:
      - pegasusScope_scope-competency-assignment-controller
      operationId: getChanges
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
