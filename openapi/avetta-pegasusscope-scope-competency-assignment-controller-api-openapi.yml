        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: sortByWorkerName
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: page.page
        in: query
        description: For results more than one page long, the page to load.
        schema:
          type: integer
          default: 0
      - name: page.size
        in: query
        description: The number of results to return per page
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/3.29.14_PersonCompetencyResource'
        '400':
