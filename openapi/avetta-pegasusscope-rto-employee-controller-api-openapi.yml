  description: 'Operations tagged pegasusScope_rto-employee-controller across 2 of this provider''s published API definitions: avetta-pegasus-dist.json, avetta-pegasus-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: EPE (Test Environment)
  url: https://epe-onsitetrackeasy.com.au/onsite-rest
- description: Production
  url: https://secure.onsitetrackeasy.com.au/onsite-rest
tags:
- name: pegasusScope_rto-employee-controller
  x-displayName: rto-employee-controller
paths:
  /api/v1/scope/{scopeId}/rto/{rtoCompanyId}/employee:
    get:
      tags:
      - pegasusScope_rto-employee-controller
      operationId: getEmployees_1
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: rtoCompanyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: partialNames
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: criteria
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/3.29.14_PersonSearchResource'
      - name: page.page
        in: query
        description: For results more than one page long, the page to load.
        schema:
          type: integer
          default: 0
      - name: page.size
        in: query
        description: The number of results to return per page
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
