openapi: 3.2.0
info:
  title: Avetta Pegasus Scope Scope User Controller API
  version: APSO-1355
  x-logo:
    url: avetta_logo.png
  description: 'Operations tagged pegasusScope_scope-user-controller across 2 of this provider''s published API definitions: avetta-pegasus-dist.json, avetta-pegasus-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: EPE (Test Environment)
  url: https://epe-onsitetrackeasy.com.au/onsite-rest
- description: Production
  url: https://secure.onsitetrackeasy.com.au/onsite-rest
tags:
- name: pegasusScope_scope-user-controller
  x-displayName: scope-user-controller
paths:
  /api/v1/scope/{scopeId}/user:
    post:
      tags:
      - pegasusScope_scope-user-controller
      summary: Create new user for scope
      description: Password may be specified (where setPassword is true and the request body contains a non-blank value for password), auto-generated by the system (which will trigger an email to be sent to the user's email address), or ignored completely
      operationId: createUser
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: setPassword
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: generatePassword
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: createSSOAccount
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3.29.14_CreateUserWithPrivilegesResource'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_UserDetailedResource'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
      security:
      - 3.29.14_security_auth: []
        3.29.14_security_apikey: []
    servers:
    - description: EPE (Test Environment)
      url: https://epe-onsitetrackeasy.com.au/onsite-rest
    - description: Production
      url: https://secure.onsitetrackeasy.com.au/onsite-rest
  /api/v1/scope/{scopeId}/user/person/{personId}:
    post:
      tags:
      - pegasusScope_scope-user-controller
      summary: Create new user for scope for an existing employee
      description: Create a user for an existing person. With respect to user password the same rules apply here as they do for the create user endpoint
      operationId: createUserForExistingPerson
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: setPassword
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: generatePassword
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: createSSOAccount
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3.29.14_CreateUserWithPrivilegesResource'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_UserDetailedResource'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
      security:
      - 3.29.14_security_auth: []
        3.29.14_security_apikey: []
    servers:
    - description: EPE (Test Environment)
      url: https://epe-onsitetrackeasy.com.au/onsite-rest
    - description: Production
      url: https://secure.onsitetrackeasy.com.au/onsite-rest
components:
  schemas:
    3.29.14_CreateUserWithPrivilegesResource:
      required:
      - firstName
      - lastName
      type: object
      properties:
        username:
          type: string
        firstName:
          maxLength: 35
          minLength: 0
          type: string
        lastName:
          maxLength: 45
          minLength: 0
          type: string
        emailAddress:
          type: string
        globalPermissions:
          type: object
          additionalProperties:
            type: object
        scopePermissions:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_UserScopePermissionsCommand'
        password:
          type: string
        lockedToSiteId:
          type: integer
          format: int32
    3.29.14_UserScopePermissionsCommand:
      type: object
      properties:
        permissions:
          type: object
          additionalProperties:
            type: object
        scopeId:
          type: integer
          format: int32
        accessLevel:
          type: string
          enum:
          - NO_ACCESS
          - VIEWER_ACCESS
          - EDITOR_ACCESS
    3.29.14_UserSitePermissionResource:
      type: object
      properties:
        site:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        defaultLocation:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        accessLevel:
          type: string
          enum:
          - NO_ACCESS
          - VIEWER_ACCESS
          - EDITOR_ACCESS
        privileges:
          type: object
          additionalProperties:
            type: string
        properties:
          type: object
          additionalProperties:
            type: string
    3.29.14_StatusType:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        reasonPhrase:
          type: string
    3.29.14_ScopeDetailResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        timezone:
          type: string
        fatigueLimit:
          type: integer
          format: int32
        siteId:
          type: integer
          format: int32
        realmId:
          type: integer
          format: int32
        concoId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - SYSTEM
          - REALM
          - SITE
          - LOCATION
          - CONCO_WEB
          - EMPLOYEE
          - UNKNOWN
        typeDisplayName:
          type: string
        ownerName:
          type: string
        connectAccountId:
          type: string
        connectClient:
          type: boolean
        parentId:
          type: integer
          format: int32
        realm:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        site:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        conco:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        topLevel:
          type: boolean
    3.29.14_UserDetailedResource:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
        phone:
          type: string
        personId:
          type: integer
          format: int32
        userType:
          type: string
          enum:
          - SITE
          - EMPLOYEE
          - SYSTEM
          - CONCO_WEB
          - UNICORN
          - REALM
          - SALES
          - REPORTING
          - ASSESSOR
          - INTEGRATION
          - SSO_INTEGRATION
          - STYLE_SERVICE_INTEGRATION
        userName:
          type: string
        scope:
          $ref: '#/components/schemas/3.29.14_ScopeResource'
        active:
          type: boolean
        updateTime:
          type: string
        locale:
          type: string
        email2:
          type: string
        phone2:
          type: string
        userPermissions:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_UserPermissionResource'
        privileges:
          type: object
          additionalProperties:
            type: object
    3.29.14_KeyedIntegerResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    3.29.14_FullErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
        errorDetail:
          type: string
    3.29.14_ScopeResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        timezone:
          type: string
        fatigueLimit:
          type: integer
          format: int32
        siteId:
          type: integer
          format: int32
        realmId:
          type: integer
          format: int32
        concoId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - SYSTEM
          - REALM
          - SITE
          - LOCATION
          - CONCO_WEB
          - EMPLOYEE
          - UNKNOWN
        typeDisplayName:
          type: string
        ownerName:
          type: string
        connectAccountId:
          type: string
        connectClient:
          type: boolean
        parentId:
          type: integer
          format: int32
    3.29.14_ErrorResource:
      type: object
      properties:
        errorType:
          type: string
          enum:
          - GENERAL_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - UNAUTHORISED
          - NO_ACCESS_TO_PORTAL
          - INVALID_PASSWORD
          - NOT_FOUND
          - CONSTRAINT_VIOLATION
          - VALIDATION_ERROR
          - ALREADY_EXISTS
          - DATA_MISMATCH
          - NOT_AN_EMPLOYEE
          - CANNOT_BE_TERMINATED
          - TOO_MANY_FAILED_ATTEMPTS
          - REQUIRED_FIELD_MISSING
          - VERIFICATION_TOKEN_EXPIRED
          - PURCHASE_ORDER_EXPIRED
          - DUPLICATE_PAYMENT
          - PAYMENT_ERROR
          - CANNOT_BE_UPDATED
          - PENDING_CARD_IN_PROGRESS
          - CANNOT_ASSIGN
          - INVALID_PERSON_STATE
        error:
          type: string
        field:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_Problem'
    3.29.14_UserPermissionResource:
      type: object
      properties:
        id:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
        company:
          $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        accessLevel:
          type: string
          enum:
          - NO_ACCESS
          - VIEWER_ACCESS
          - EDITOR_ACCESS
        privileges:
          type: object
          additionalProperties:
            type: string
        availableApps:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_KeyedIntegerResource'
        sitePrivileges:
          type: array
          items:
            $ref: '#/components/schemas/3.29.14_UserSitePermissionResource'
        userType:
          type: string
          enum:
          - SITE
          - EMPLOYEE
          - SYSTEM
          - CONCO_WEB
          - UNICORN
          - REALM
          - SALES
          - REPORTING
          - ASSESSOR
          - INTEGRATION
          - SSO_INTEGRATION
          - STYLE_SERVICE_INTEGRATION
        userScope:
          $ref: '#/components/schemas/3.29.14_ScopeDetailResource'
        properties:
          type: object
          additionalProperties:
            type: string
    3.29.14_Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        parameters:
          type: object
          additionalProperties:
            type: object
        detail:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/3.29.14_StatusType'
  securitySchemes:
    3.29.14_security_auth:
      type: oauth2
      scheme: Bearer
      flows:
        authorizationCode:
          authorizationUrl: https://login.poweredbyonsite.com/cas/oidc/authorize
          tokenUrl: https://login.poweredbyonsite.com/cas/oidc/accessToken
          scopes:
            pegasus: Pegasus Authentication Scope
    3.29.14_security_apikey:
      type: apiKey
      name: api_key
      in: header
