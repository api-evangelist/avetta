  responses:
    v2Successful:
      description: 'List of users. `last_checkin_date`, `last_checkout_date`, `flag`, `flag_forced`,

        `external_id`, and `account.external_id` are present only when requested through `extra`.

        `{id}` routes wrap the user in a single-element array.

        `dob` (`YYYY-MM-DD`) is `''''` unless the caller holds a worker-PII grant over a site the user is connected to.

        `account.con_flag` rolls up the account''s connection ratings (one distinct rating => that rating,

        mixed => Amber, none => None), scoped to the caller''s sites for client keys and to `connection_id` / `site_id` when supplied.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                allOf:
                - $ref: '#/components/schemas/statsSchema'
                - type: object
                  properties:
                    search_id:
                      type: integer
                      description: Search ID used to load extras; present only when `extra` is supplied
                      example: 231019020
              users:
                type: array
                items:
                  $ref: '#/components/schemas/userSchema'
          examples:
            successful:
              summary: Default user (no extras)
              value:
                users:
                - id: 1235
                  con_id: 1568432
                  first_name: John
                  last_name: Doe
                  login_id: jdoe
                  email: test@test.com
                  dob: '1998-05-25'
                  sap_id: 265813
                  cat_code: 1632
                  phone: 4561231159
                  status: Active
                  title: Director of Software Development
                  created_date: '2018-10-23 18:31:00'
                  updated_date: '2019-05-15 16:41:00'
                  badge_link: ''
                  removed: 0
                  emergency_phone: 555-555-5555
                  emergency_contact_name: Bob Smith
                  emergency_contact_relationship: Parent
                  account:
                    id: 1235
                    parent_id: 1235
                    name: Avetta
                    type: client
                    con_id: 235843
                    con_flag: 0
            successfulExtraCheckinStatusExternal:
              summary: With extra=checkin,status,external
              value:
                stats:
                  search_id: 231019020
                users:
                - id: 1235
                  con_id: 1568432
                  first_name: John
                  last_name: Doe
                  login_id: jdoe
                  email: test@test.com
                  status: Active
                  flag: Green
                  flag_forced: 0
                  last_checkin_date: '2020-10-23 15:00:00'
                  last_checkout_date: '2020-10-23 19:45:00'
                  external_id:
                  - Connect:
                      SAP: 11035178
                  removed: 0
                  account:
                    id: 1235
                    parent_id: 1235
                    name: Avetta
                    type: client
                    con_id: 235843
                    con_flag: 0
                    external_id:
                    - Connect:
                        SAP: 11035178
    v2InvalidParameter:
      description: 'Invalid parameter value. v2 rejects invalid filters rather than ignoring them. Possible messages:

        `Invalid modified_after`, `Invalid flag`, `Invalid sort`, `Invalid account_con_id`,

        `Invalid connection_con_id`, `event_id is only supported on /users/credit`.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              error:
                $ref: '#/components/schemas/messageSchema'
          examples:
            invalidSort:
              summary: Unknown sort field
              value:
                error:
                  success: false
                  code: 400
                  status: Bad Request
                  message: Invalid sort
            eventIDNotSupported:
              summary: event_id on a non-credit route
              value:
                error:
                  success: false
                  code: 400
                  status: Bad Request
                  message: event_id is only supported on /users/credit
    errorSecurity:
      description: Error while checking security
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              data:
                $ref: '#/components/schemas/messageSchema'
          examples:
            errorSecurity:
              $ref: '#/components/examples/errorSecurity'
    v2Forbidden:
      description: 'Caller does not hold the route''s security type, or has no viewing groups to search within.

        Missing or invalid credentials return 401 instead.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              error:
                $ref: '#/components/schemas/messageSchema'
          examples:
            missingSecurityType:
              summary: Caller does not hold the route's security type
              value:
                error:
                  success: false
                  code: 403
                  status: Forbidden
            noViewingNodes:
              summary: No viewing groups for the route's security type
              value:
                error:
                  success: false
                  code: 403
                  status: Forbidden
                  message: Invalid security
    v2NotFound:
      description: User not found (`{id}` routes), or `event_id` not available to the caller (credit routes)
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              error:
                $ref: '#/components/schemas/messageSchema'
          examples:
            userNotFound:
              summary: No visible, non-deleted user with this id
              value:
                error:
                  success: false
                  code: 404
                  status: Not Found
                  message: User not found
            eventNotFound:
              summary: Requirement not available to the caller
              value:
                error:
                  success: false
                  code: 404
                  status: Not Found
                  message: Event not found
    v2CheckInOutSuccessful:
      description: Successful - the time card was saved. `id` is the time card id (pass it as `card_id` to check out).
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              users:
                allOf:
                - $ref: '#/components/schemas/messageSchema'
                - type: object
                  properties:
                    id:
                      type: integer
                      description: Time card id
                      example: 915482
          examples:
            successful:
              summary: Time card saved
              value:
                users:
                  success: true
                  code: 200
                  status: Good
                  id: 915482
            alreadyCheckedIn:
              summary: Check in repeated while already checked in at the same group
              value:
                users:
                  success: true
                  code: 204
                  status: No Content
                  message: User already checked in to this group
                  id: 915482
    v2CheckInOutError:
      description: "Check in/out rejected. Possible messages by code:\n- 400: `User is not connected to the group` (check in only), `User is already checked in. Please check out before checking in to another site.` (open time card at a different group),\n  `Reason required to check in a non-compliant worker`, `time_out is before the check in time`\n- 403: no message (caller does not hold the route's security type), `Invalid security`, `Invalid security - group belongs to another company`, `Timecard not enabled`\n- 404: `Group not found`, `User not found` (check in only), `Failed to find check in`\n\nCheck out does not require the worker to be active or connected; it only needs an open time card for the worker at the group.\n"
      content:
        application/json:
          schema:
            type: object
            properties:
              stats:
                $ref: '#/components/schemas/statsSchema'
              error:
                $ref: '#/components/schemas/messageSchema'
          examples:
            reasonRequired:
              summary: Non-Green worker checked in without notes
              value:
                error:
                  success: false
                  code: 400
                  status: Bad Request
                  message: Reason required to check in a non-compliant worker
            otherCompany:
              summary: Caller does not belong to the group's company
              value:
                error:
                  success: false
                  code: 403
                  status: Forbidden
                  message: Invalid security - group belongs to another company
            noOpenCheckin:
              summary: No open time card for the worker at the group
              value:
                error:
                  success: false
                  code: 404
                  status: Not Found
                  message: Failed to find check in
