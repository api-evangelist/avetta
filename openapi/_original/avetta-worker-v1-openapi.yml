            type: string
            description: User first name - if is a new user it is required
            example: John
          middle_initial:
            type: string
            description: User middle initial
            example: M
          last_name:
            type: string
            description: User last name - if is a new user it is required
            example: Smith
          password:
            type: string
            description: User password - if is a new user it is required
            example: password!
          site:
            type: string
            description: Company site id - if is a new user it is required
            example: 26516
          email:
            type: string
            description: User email
            example: test@email.com
          address1:
            type: string
            description: User address line 1
            example: 45 Main St
          address2:
            type: string
            description: User address line 2
            example: Apt 2
          city:
            type: string
            description: User city name
            example: New York
          state:
            type: string
            description: User state name
            example: NY
          zipcode:
            type: string
            description: User zipcode number
            example: 10001
          country:
            type: string
            description: User country name - it could be the country id, code or the country name
            example: 1 / US / USA / United States
          mobile_phone:
            type: string
            description: User mobile phone number - it should be in the international format
            example: +1 123456789
          home_phone:
            type: string
            description: User home phone number - it should be in the international format
            example: +1 123456789
          work_phone:
            type: string
            description: User work phone number - it should be in the international format
            example: +1 123456789
          emergency_contact_name:
            type: string
            description: User emergency contact name
            example: Bob Smith
          emergency_contact_phone:
            type: string
            description: User emergency contact phone number - it should be in the international format
            example: +1 123456789
