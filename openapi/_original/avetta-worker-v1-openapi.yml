# x-archived-from: avetta-worker-v1-openapi.yml
# x-archived-on: 2026-10-20
openapi: 3.0.3
info:
  title: Worker Management
  license:
    name: Trade secret
    url: https://avetta.com
  description: "The Avetta API is a mechanism to allow our customers to retrieve worker data from Worker Management via application programming\
    \ interface. The Avetta WM API is organized around REST and uses HTTP status codes and error payload responses to indicate API errors.\n\n\
    We leverage the HTTP protocol features, like HTTP verbs and status codes, which are commonly used and are understood by off-the-shelf HTTP\
    \ clients. All API responses (including errors) will be returned in JSON format. All API responses we process will return 200 but include\
    \ the status code in the payload returned.\n\n**Host Region**\n\nIn some cases we support regional instances. The default region value is\
    \ simply 'worker'. Making the host value evaluate to https://worker.avetta.com. If told to use a regional url, other than the default, append\
    \ the region identifier after worker. eg. https://worker-au.avetta.com\n\n**Versioning <- IMPORTANT UPDATE MUST READ ->**\n\nYou will notice\
    \ in this documentation that the URL for this API is as follows: https://worker.avetta.com/api/vX… This URL contains vX to specify the particular\
    \ version to be used when making the desired call. Different versions of the same endpoint may return different results, therefore it is important\
    \ to note the versions of each endpoint in this documentation. Please be aware of this as you check each endpoint.\n\n**Authentication**\n\
    \nWhen using the API, include your secret API key in the `Authorization` request header for the service to authenticate your account. This\
    \ API Key will be provided to you by your point of contact in Avetta.\n\nThe `Authorization` header must be formatted as:\n\n    Authorization:\
    \ apikey <key>\n\nAll API requests must be made over HTTPS. Calls to the service over HTTP will result in a 302 Redirect response to the HTTPS\
    \ end-point. API requests without an `Authorization: apikey <key>` header will fail.\n\n**Errors**\n\nWorker Management returns 2xx response\
    \ codes on all responses handled by system. If the call fails, you will get a 5xx response code. For errors, we return a status code on the\
    \ page with the 4xx response code.\n\n**Pagination**\n\nAvetta has a default maximum limit of 3000 results in one API call. In the case where\
    \ the response returns more than the default limit, you must utilize pagination to retrieve the full data set. Avetta utilizes cursor-based\
    \ pagination via optional start and limit query string parameters. The start indicates the record to start with for pagination and the limit\
    \ indicates the total number of records to return (maximum of 3000).\n"
  version: '2026-05-08'
servers:
- url: https://{environment}.avetta.com/api/v1
  variables:
    environment:
      default: worker
      enum:
      - worker
      - au-worker
tags:
- name: Accounts
  description: 'The Accounts API allows you to retrieve account information.

    '
- name: Admin
  description: 'The Admin API provides administrative endpoints for system overview and management data. Access requires appropriate security
    permissions.

    '
- name: Auth
  description: 'The Auth API allows you to authenticate into Worker Management. Handles multi-factor authentication, password reset, and single
    sign-on.

    '
- name: Countries
  description: 'The Countries API allows you to retrieve country information. Get country data, dialing codes, and more.

    '
- name: Event
  description: 'The Event API allows you to retrieve event / requirement information.

    '
- name: Events
  description: 'The Events API allows you to list events.

    '
- name: Credit
  description: 'The endpoints to credit events.

    '
- name: Languages
  description: 'The Languages API allows you to retrieve language information.

    '
- name: Registration
  description: 'The Registration API allows you to register a new account or user.

    '
- name: Reviews
  description: 'The Reviews API allows admins to perform document reviews for the workers

    '
- name: Roles
  description: 'The Roles API allows you to retrieve role information.

    '
- name: Sites
  description: 'The Sites API allows you to retrieve site information and assign users to sites.

    '
- name: TimeCard
  description: 'The TimeCard API allows you to retrieve a list of workers on site.

    '
- name: User
  description: 'The User API allows you to retrieve user detail information.

    '
- name: Users
  description: 'The Users API allows you to retrieve all users information.

    '
- name: Variances
  description: 'The Variances API allows you to retrieve variance information or create a variance.

    '
- name: Status
  description: 'The Status API allows you to retrieve status information.

    '
paths:
  /accounts/{id}:
    get:
      operationId: accounts
      tags:
      - Accounts
      summary: List of accounts to client
      description: Returns a list of accounts to client
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/searchParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/typeParam'
      - $ref: '#/components/parameters/modifiedAfterParam'
      - $ref: '#/components/parameters/extraParam'
      - $ref: '#/components/parameters/role_idParam'
      - $ref: '#/components/parameters/showInactiveParam'
      - $ref: '#/components/parameters/flagParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulAccounts'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags:
      - Admin
      summary: Administrative Overview
      description: Returns administrative overview with counts of various system components that the admin can see based on their security permissions
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/successfulAdminOverview'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/authenticate:
    post:
      operationId: authenticate
      tags:
      - Auth
      summary: Authentication (Deprecated)
      deprecated: true
      description: 'Deprecated. Do not use for new integrations - use /auth/token instead.

        Get the token for the user.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/usernameParam'
      - $ref: '#/components/parameters/passwordParam'
      responses:
        '200':
          $ref: '#/components/responses/authenticateToken'
        '201':
          $ref: '#/components/responses/authenticateErrors'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/token:
    post:
      operationId: token
      tags:
      - Auth
      summary: Token generation
      description: Generate or refresh security tokens (Access and Refresh) for the user, for both Connect and WM.
      security: []
      requestBody:
        content:
          multipart/form-data (Password):
            schema:
              $ref: '#/components/schemas/requestStructurePassword'
          multipart/form-data (Token Refresh):
            schema:
              $ref: '#/components/schemas/requestStructureRefresh'
      responses:
        '200':
          $ref: '#/components/responses/tokens'
        '201':
          $ref: '#/components/responses/responses-authenticateErrors'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
  /auth/issso:
    get:
      operationId: isSSO
      tags:
      - Auth
      summary: SSO Check
      description: Get if the Credentials is a SSO user
      security: []
      parameters:
      - $ref: '#/components/parameters/parameters-usernameParam'
      - $ref: '#/components/parameters/isMobileParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulIsSSO'
        '201':
          $ref: '#/components/responses/isSSOErrors'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Logout user
      security:
      - ApiKeyAuth: []
      - {}
      description: 'Logout the user. This endpoint is public - the token to invalidate can be provided either via the `Authorization` header (`apikey
        <key>`) or in the request body (`wm_access_token` / `connect_access_token`). If a Worker Management token is provided in the header the
        request body is optional and the call can be a normal GET.

        '
      requestBody:
        content:
          multipart/form-data (WM & Connect):
            schema:
              $ref: '#/components/schemas/requestWMConnect'
      responses:
        '200':
          $ref: '#/components/responses/successfulLogout'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/requestpassword:
    post:
      operationId: requestPassword
      tags:
      - Auth
      summary: Request reset password
      description: Send an email to the user with a link to reset the password. Works for both Connect and Worker Management users
      security: []
      parameters:
      - $ref: '#/components/parameters/parameters-usernameParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulRequestPassword'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/switchuser:
    post:
      operationId: switchUser
      tags:
      - Auth
      summary: Switch user
      description: Switch the user to the given user when the user has permission to do it
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/components-parameters-usernameParam'
      responses:
        '200':
          $ref: '#/components/responses/switchUser'
        '201':
          $ref: '#/components/responses/errorSwitchUser'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/updatepassword:
    post:
      operationId: updatePassword
      tags:
      - Auth
      summary: Update Password
      description: Update the password of a user, either in Worker Management or in Connect
      security: []
      parameters:
      - $ref: '#/components/parameters/newPasswordParam'
      - $ref: '#/components/parameters/passwordHintParam'
      - $ref: '#/components/parameters/keyParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulChangePassword'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/validateemail:
    post:
      operationId: ValidateEmail
      tags:
      - Auth
      summary: Validate an email change
      description: Perform a validation of a change to the user's email address based on a code sent to the email address
      security: []
      parameters:
      - $ref: '#/components/parameters/bnm'
      - $ref: '#/components/parameters/password'
      responses:
        '200':
          $ref: '#/components/responses/emailUpdated'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /auth/mfa/generate:
    post:
      operationId: generate
      tags:
      - Auth
      summary: Generate MFA code
      description: Generate an MFA code and send it via email or phone. For users who already have MFA enabled, providing target to add or update
        a method requires an MFA-verified WM token. Passing disable=true generates a code that, once validated, disables MFA for the account;
        this also requires an MFA-verified WM token and is not supported for Connect users. disable=true and target cannot be provided together.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/methodParam'
      - $ref: '#/components/parameters/wmJwtParam'
      - $ref: '#/components/parameters/connectJwtParam'
      - $ref: '#/components/parameters/targetParam'
      - $ref: '#/components/parameters/disableParam'
      responses:
        '200':
          $ref: '#/components/responses/GenerateMFASuccess'
        '400':
          $ref: '#/components/responses/GenerateMFABadReq'
        '401':
          $ref: '#/components/responses/GenerateMFANotAuth'
        '405':
          $ref: '#/components/responses/GenerateMFABadMethod'
        '423':
          $ref: '#/components/responses/GenerateMFALocked'
        '429':
          $ref: '#/components/responses/GenerateMFATooMany'
        '430':
          $ref: '#/components/responses/GenerateMFANotEnabled'
        '431':
          $ref: '#/components/responses/GenerateMFAAlreadyEnabled'
        '432':
          $ref: '#/components/responses/GenerateMFANotSupported'
        '433':
          $ref: '#/components/responses/GenerateMFAAlreadyDisabled'
        '434':
          $ref: '#/components/responses/GenerateMFADisableWithTarget'
        '500':
          $ref: '#/components/responses/GenerateMFAConnectError'
  /auth/mfa/validate:
    post:
      operationId: validate
      tags:
      - Auth
      summary: Validate MFA code
      description: Validate the MFA code. When confirming an MFA contact setup/update for an already-enabled user, the success response does not
        include new tokens. Validating a code generated via /auth/mfa/generate with disable=true disables MFA for the account.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/codeParam'
      - $ref: '#/components/parameters/parameters-methodParam'
      - $ref: '#/components/parameters/wmJwtParam'
      - $ref: '#/components/parameters/connectJwtParam'
      - $ref: '#/components/parameters/deviceParam'
      - $ref: '#/components/parameters/trustedParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulValidateMFA'
        '400':
          $ref: '#/components/responses/ValidateMFABadReq'
        '401':
          $ref: '#/components/responses/ValidateMFANotAuth'
        '405':
          $ref: '#/components/responses/ValidateMFANotAllowed'
        '423':
          $ref: '#/components/responses/ValidateMFALocked'
        '424':
          $ref: '#/components/responses/ValidateMFADeviceMismatch'
        '425':
          $ref: '#/components/responses/ValidateMFATrustedWithoutDevice'
        '433':
          $ref: '#/components/responses/ValidateMFAAlreadyDisabled'
  /auth/mfa/info:
    post:
      operationId: info
      tags:
      - Auth
      summary: Get MFA info
      description: Returns masked contact info (phone/email) where an MFA code can be sent, along with the user's name. Phone and email are only
        included when MFA is already enabled. Supports both WM and Connect JWT tokens.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-wmJwtParam'
      - $ref: '#/components/parameters/parameters-connectJwtParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulInfoMFA'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ConnectSettingsError'
  /countries:
    get:
      operationId: getCountries
      tags:
      - Countries
      summary: List of countries
      description: Returns a list of countries
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          $ref: '#/components/responses/successfulCountry'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /countries/{id}:
    get:
      operationId: getCountry
      tags:
      - Countries
      summary: Get country by id or code
      description: Returns the information of the country with the given id
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulIDCountry'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /event/{id}:
    get:
      operationId: getEvent
      tags:
      - Event
      summary: List of events
      description: Returns responses of event
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulEvent'
        '201':
          $ref: '#/components/responses/badRequestMissingEventID'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /event/clearbookmark:
    post:
      operationId: clearEventBookmark
      tags:
      - Event
      summary: Clear the SCORM bookmarks.
      description: This endpoint is used to clear the SCORM bookmarks.
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/evtIDParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulClearBookmark'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /event/document/complete:
    post:
      operationId: viewDocumentID
      tags:
      - Event
      summary: Complete / Mark as Downloaded
      description: This endpoint is used to mark the requirement files as Viewed / Downloaded. The list of available files can be found under
        “links” array returned by the Event endpoint
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/fileNameParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulComplete'
        '201':
          $ref: '#/components/responses/badRequestComplete'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /event/document:
    post:
      operationId: uploadDocumentID
      tags:
      - Event
      summary: Upload a document (using form-data)
      description: This endpoint is used to upload a document for “Documents Review” section. The uploaded documents can be found in the “upload->files”
        array returned by the Event endpoint
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/docFileParam'
      - $ref: '#/components/parameters/fileNameBaseParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulUpDocument'
        '201':
          $ref: '#/components/responses/errorFile'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    delete:
      operationId: deleteDocument
      tags:
      - Event
      summary: Delete a document
      description: This endpoint is used to delete a document uploaded for “Documents Review”
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/docIDParam'
      - $ref: '#/components/parameters/uedIDParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulDelete'
        '201':
          $ref: '#/components/responses/badRequestDelete'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
    get:
      operationId: getDocument
      tags:
      - Event
      summary: Get a document (using base64string)
      description: This is NOT a preferred method. Mobile team should NOT use this method This endpoint is used to get a document uploaded for
        “Documents Review” to download
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/parameters-evtIDParam'
      - $ref: '#/components/parameters/docIDParam'
      - $ref: '#/components/parameters/uedIDParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulGetDocument'
        '201':
          $ref: '#/components/responses/badRequestGetDocument'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /event/review:
    post:
      operationId: reviewEvent
      tags:
      - Event
      summary: Event Review
      description: Endpoint to save the event for Credit/review
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/components-parameters-evtIDParam'
      - $ref: '#/components/parameters/postDataParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulReview'
        '201':
          $ref: '#/components/responses/badRequest'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /events:
    get:
      operationId: getEvents
      tags:
      - Events
      summary: List of events
      description: Returns a list of events based on the user Reports permission, if the user is a worker, it will return the events that are
        applicable to the worker
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/parameters-searchParam'
      - $ref: '#/components/parameters/parameters-typeParam'
      - $ref: '#/components/parameters/userParam'
      - $ref: '#/components/parameters/parameters-extraParam'
      - $ref: '#/components/parameters/siteParam'
      - $ref: '#/components/parameters/parameters-showInactiveParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulEvents'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /events/{id}:
    get:
      operationId: getEventsID
      tags:
      - Events
      summary: Get a single event
      description: 'Returns a single event by id, applying the same Reports-permission scoping as GET /events. If the id does not exist or is
        not visible to the caller, a 401 (Invalid security) response is returned instead of a 404 - the API does not distinguish "not found" from
        "not permitted". When user_id is also supplied, the response may include "review" and/or "history" (the user''s pending / most recent
        accepted document review for this event), subject to the caller having Credit / Report security over that user.

        '
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/parameters-searchParam'
      - $ref: '#/components/parameters/parameters-typeParam'
      - $ref: '#/components/parameters/userParam'
      - $ref: '#/components/parameters/parameters-extraParam'
      - $ref: '#/components/parameters/siteParam'
      - $ref: '#/components/parameters/parameters-showInactiveParam'
      responses:
        '200':
          $ref: '#/components/responses/responses-successfulEvent'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /events/variances:
    get:
      operationId: getEventsVariances
      tags:
      - Events
      summary: List of events for variances
      description: Returns a list of events based on the Variances permission
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/parameters-searchParam'
      - $ref: '#/components/parameters/parameters-typeParam'
      - $ref: '#/components/parameters/userParam'
      - $ref: '#/components/parameters/parameters-extraParam'
      - $ref: '#/components/parameters/siteParam'
      - $ref: '#/components/parameters/parameters-showInactiveParam'
      responses:
        '200':
          $ref: '#/components/responses/successfulEvents'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /events/variances/{id}:
    get:
      operationId: getEventsVariancesID
      tags:
      - Events
      summary: Get a single event for variances
      description: 'Returns a single event by id, applying the same Variances-permission scoping as GET /events/variances. If the id does not
        exist or is not visible to the caller, a 401 (Invalid security) response is returned instead of a 404. When user_id is also supplied,
        the response may include "review" and/or "history", subject to the caller having Credit / Report security over that user.

        '
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/parameters-searchParam'
      - $ref: '#/components/parameters/parameters-typeParam'
      - $ref: '#/components/parameters/userParam'
      - $ref: '#/components/parameters/parameters-extraParam'
      - $ref: '#/components/parameters/siteParam'
      - $ref: '#/components/parameters/parameters-showInactiveParam'
      responses:
        '200':
          $ref: '#/components/responses/responses-successfulEvent'
        '400':
          $ref: '#/components/responses/parameterNotRecognized'
        '401':
          $ref: '#/components/responses/errorSecurity'
  /events/credits:
    get:
      operationId: getEventsCredits
      tags:
      - Events
      summary: List of events for credit
