security:
- ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key authentication. Provide your API key in the `Authorization` request header using the format `apikey <key>`, e.g. `Authorization:
        apikey <key>`. Requests missing this header will fail.

        '
  parameters:
    idParam:
      name: id
      in: path
      description: references an id to reduce list down to 1 item
      required: false
      schema:
        type: integer
    startParam:
      name: start
      in: query
      description: Offset of the first record to return
      required: false
      schema:
        type: integer
        default: 1
    limitParam:
      name: limit
      in: query
      description: Maximum number of records to return
      required: false
      schema:
        type: integer
        default: 3000
    searchParam:
      name: search
      in: query
      description: Search term - check for the code and title
      required: false
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: Name of field to sort by
      required: false
      schema:
        type: string
        enum:
        - id
        - code
        - title
        - group
    typeParam:
      name: type
      in: query
      description: Type of the account
      required: false
      schema:
        type: string
        enum:
        - client
        - supplier
        - supplierSubcontractor
    modifiedAfterParam:
      name: modifiedAfter
      in: query
      description: Modified after
      required: false
      schema:
        type: string
        format: date-time
    extraParam:
      name: extra
      in: query
      description: Extra??
      required: false
      schema:
        type: string
        enum:
        - users
        - connections
        - admins
    role_idParam:
      name: role_id
      in: query
      description: Show the users with the specified role ID
      required: false
      schema:
        type: integer
    showInactiveParam:
      name: showInactive
      in: query
      description: Show inactive
      required: false
      schema:
        type: boolean
        enum:
        - true
        - false
    flagParam:
      name: flag
      in: query
      description: Flag
      required: false
      schema:
        type: string
        enum:
        - Green
        - Amber
        - Red
    usernameParam:
      name: username
      in: query
      description: Username of the user to authenticate with
