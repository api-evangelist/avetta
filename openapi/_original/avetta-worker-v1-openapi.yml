            example: 123-45-6789 / 123456789
          photo:
            type: string
            description: User photo - it should be in the format of a base64 string
            example: /9j/...
          hire_date:
            type: string
            description: User hire date - it should be in the format YYYY-MM-DD
            example: '2020-10-23'
          term_date:
            type: string
            description: User termination date - it should be in the format YYYY-MM-DD
            example: '2024-10-23'
          status:
            type: string
            description: User status - for new users it will be active
            example: active
            enum:
            - active
            - inactive
          locale:
            type: string
            description: User locale - it should be in the format of language-country - for new users it will be set as default if not provided
            example: en-us
          sap:
            type: string
            description: User SAP id
            example: 265813
          notes:
            type: string
            description: User notes
            example: User notes
          reset_password:
            type: boolean
            description: User reset password - if true it will check it to reset the user password
            example: true
            enum:
            - true
            - false
          password_never_expired:
            type: boolean
            description: User password never expired - if true it will check it to set the user password as never expired
            example: false
            enum:
            - true
            - false
          2fa:
            type: boolean
            description: User 2fa - if true it will check it to set the user as two factor authentication. Supplier admins and system admins may
              only enable MFA (true) on their own account; enabling it for another user via this endpoint returns 403. Disabling MFA (false) for
              another user requires the ST_USER (Workers) permission. While MFA is enabled, email and mobile_phone can only be added if not already
              set - an existing value cannot be changed by another user.
            example: false
            enum:
            - true
            - false
    handleSaveResponseSchema:
      type: object
      format: object
      description: Envelope built by _UpsertUsers() around one or more HandleSave() results. The overall code/status only ever reflect 200 (all
        succeeded), 207 (mixed), or 400 (all failed) - per-item codes (e.g. 403) are only found inside detail.fail[].code.
      properties:
        status:
          type: string
          description: HTTP status text derived from the overall code
          example: Bad Request
          enum:
          - Good
          - Multi-Status
          - Bad Request
        success:
          type: boolean
          description: True when at least one user was saved successfully
        code:
          type: integer
          description: Overall response code - 200 if all succeeded, 207 if mixed, 400 if all failed
          enum:
          - 200
          - 207
          - 400
        message:
          type: string
          description: Only present when every user in the request failed to save
          example: Invalid request
        detail:
          type: object
          properties:
            success:
              type: array
              description: Users that were saved, with any non-fatal warning messages
              items:
                type: object
                properties:
                  UsrID:
                    type: integer
                    description: User ID processed
                    example: 189
                  code:
                    type: integer
                    description: Always 200 for entries in this array
                    example: 200
                  message:
                    type: array
                    description: Informative messages accumulated while saving the user (always an array, ends with 'User saved successfully')
                    items:
                      type: string
            fail:
              type: array
              description: Users that failed to save, with the validation or permission error message
              items:
                type: object
                properties:
                  UsrID:
                    type: integer
                    description: User ID processed, null when the user could not be identified/created
                    nullable: true
                    example: 189
                  code:
                    type: integer
                    description: Code of the specific error for this user (400 or 403)
                    example: 400
                  message:
                    description: Validation/permission error for this user. A plain string for most HandleSave() failures; an array only for the
                      underlying-save-failed case (errors collected from MBOL::User::GetErrorMessages()).
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
    fieldsUsersSchema:
      type: object
      format: object
      properties:
        value:
          type: string
          description: Field value, when you create a new field the value is empty, when you retrieve a field the value is the field value
          example: ''
        title:
          type: string
          description: Field title, there are 30 titles available
          example:
            enum:
            - Login ID
            - First Name
            - MI
            - Last Name
            - Password
            - Company ::Site
            - E-mail
            - Address Line 1
            - Address Line 2
            - City
            - State
            - Zip
            - Country
            - Mobile Phone
            - Home Phone
            - Work Phone
            - Emergency Contact Name
            - Emergency Contact Phone
            - Birth Date
            - SSN
            - Photo
            - Hire Date
            - Term Date
            - Status
            - Locale
            - SAP
            - Notes
            - Reset Password
            - Password Never Expired
            - 2FA
        validation:
          type: object
          description: Field validation
          properties:
            maxvalue:
              type: string
              description: Field maximum value
              example: null
            maxlength:
              type: integer
              description: Field maximum length
              example: 128
            required:
              type: boolean
              description: Field required
              example: true
            minvalue:
              type: string
              description: Field minimum value
              example: null
