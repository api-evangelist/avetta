      description: Successful assignment or unassignment
      content:
        application/json:
          schema:
            type: object
            format: object
            properties:
              stats:
                allOf:
                - $ref: '#/components/schemas/statsSchema'
                - type: object
                  properties:
                    forbidden:
                      type: integer
                      description: number of forbidden assignment or unassignment
                      example: 1
                    fail:
                      type: integer
                      description: number of failed assignment or unassignment
                      example: 2
                    success:
                      type: integer
                      description: number of successful assignment or unassignment
                      example: 3
                    total:
                      type: integer
                      description: total number of registers processed
                      example: 6
              roles_users:
                allOf:
                - $ref: '#/components/schemas/messageSchema'
                - type: object
                  properties:
                    detail:
                      type: object
                      properties:
                        forbidden:
                          type: array
                          description: list of pairs of forbidden assignment or unassignment roles and users
                          items:
                            type: object
                            properties:
                              UsrID:
                                type: integer
                                description: User ID
                                example: 22822
                              RolID:
                                type: integer
                                description: Role ID
                                example: 189
                        fail:
                          type: array
                          description: list of pairs of failed assignment or unassignment roles and users
                          items:
                            type: object
                            properties:
                              UsrID:
                                type: integer
                                description: User ID
                                example: 22822
                              RolID:
                                type: integer
                                description: Role ID
                                example: 189
                        success:
                          type: array
                          description: list of pairs of successful assignment or unassignment roles and users
                          items:
                            type: object
                            properties:
                              UsrID:
                                type: integer
                                description: User ID
                                example: 22822
                              RolID:
                                type: integer
                                description: Role ID
                                example: 189
                              previous:
                                type: integer
                                description: 1 if the user/role pair was already in the requested state (no change made); 0 if this request caused
                                  the assignment or unassignment
                                example: 0
          examples:
            allRolesAssigned:
              $ref: '#/components/examples/allRolesAssigned'
            someRolesAssigned:
              $ref: '#/components/examples/someRolesAssigned'
            nonRolesAssigned:
              $ref: '#/components/examples/noneRolesAssigned'
