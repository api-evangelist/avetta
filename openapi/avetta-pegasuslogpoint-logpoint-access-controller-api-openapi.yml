paths:
  /api/v1/logpoint/{logpointId}/access/updated:
    get:
      tags:
      - pegasusLogpoint_logpoint-access-controller
      operationId: getUpdatedSitePeople_1
      parameters:
      - name: logpointId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: lastSync
        in: query
        required: false
        schema:
          type: string
      - name: excludeArchivedCardholdersForUpdatedCompanies
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: excludeArchivedUpdatedCardholders
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page.page
        in: query
        description: For results more than one page long, the page to load.
        schema:
          type: integer
          default: 0
      - name: page.size
        in: query
        description: The number of results to return per page
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/3.29.14_LogpointPersonResource'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_FullErrorResource'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/3.29.14_ErrorResource'
      security:
      - 3.29.14_security_auth: []
        3.29.14_security_apikey: []
      summary: Get updated site people 1
      x-summary-source: derived
    servers:
    - description: EPE (Test Environment)
      url: https://epe-onsitetrackeasy.com.au/onsite-rest
