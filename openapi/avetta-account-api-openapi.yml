  /account-management-gateway/v1/clients/{clientId}/suppliers/{supplierId}/external-ids:
    servers:
    - url: https://api.avetta.com
      description: PROD
    - description: MOCK
      url: https://virtserver.swaggerhub.com/Avet7/AccountManagementGateway/1.0.0
    delete:
      operationId: deleteExternalIds
      summary: Delete External Ids
      tags:
      - Account
      description: 'Deletes external ID(s) for a supplier at a specific client hierarchy level.


        **Usage Modes:**

        - **Delete all external IDs:** Omit both `externalId` and `externalIdType` to delete all external IDs associated with the supplier at the specified client level, regardless of type.

        - **Delete specific external IDs:** Provide one or more `externalId` values along with a single `externalIdType` to delete only those specific IDs of that type.


        **Important Considerations:**

        - External IDs can only be deleted if they belong to the specified `supplierId` at the given `clientId` hierarchy level.

        - When deleting specific external IDs, only one `externalIdType` can be specified per request. To delete IDs of different types, make separate API calls for each type.'
      parameters:
      - name: clientId
        in: path
        required: true
        description: The client hierarchy level where the external IDs reside. Only external IDs that belong to the supplier at this specific hierarchy level can be deleted.
        schema:
          type: number
      - name: supplierId
        in: path
        required: true
        description: The supplier whose external IDs will be deleted. The supplier must exist at the specified `clientId` hierarchy level.
        schema:
          type: number
      - name: externalId
        in: query
        required: false
        description: One or more external ID values to delete. When provided, `externalIdType` is required. To delete multiple IDs, repeat the parameter (e.g., `externalId=id1&externalId=id2&externalId=id3`).
        schema:
          type: string
        examples:
          single:
            summary: A single external ID to be deleted
            value: ?externalId=id1&externalIdType=Vendor
          multiple:
            summary: Multiple external IDs of the same type to be deleted
            value: ?externalId=id1&externalId=id2&externalId=id3&externalIdType=Vendor
      - name: externalIdType
        in: query
        required: false
        description: The type of external ID to delete. Required when `externalId` is provided. When used without `externalId`, deletes all external IDs of this type for the supplier.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Successfully deleted:
                  value: Successfully deleted the external ids
                No external Id is deleted:
                  value: No external id is deleted.
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    minLength: 1
                    type: string
                    example: Missing Auth
                  service:
                    minLength: 1
                    type: string
                    example: Gateway
                  message:
                    minLength: 1
                    type: string
                    example: 'Failed to delete externalIds: please provide the ''externalIdType'' when passing the ''externalId'' value(s).'
                  displayMessage:
                    minLength: 1
                    type: string
                    example: 'Failed to delete externalIds: please provide the ''externalIdType'' when passing the ''externalId'' value(s).'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    minLength: 1
                    type: string
                    example: Missing Auth
                  service:
                    minLength: 1
                    type: string
                    example: Gateway
                  message:
                    minLength: 1
                    type: string
                    example: Missing Auth
                  displayMessage:
                    minLength: 1
                    type: string
                    example: Missing Auth
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                x-examples:
                  example-1:
                    error: Error message.
              examples:
                example-1:
                  value:
                    error: Error message.
