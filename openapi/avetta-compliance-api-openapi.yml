      url: https://api.avetta.com
    - description: MOCK
      url: https://virtserver.swaggerhub.com/Avet7/ComplianceManagement/1.0.0
    post:
      summary: Search Supplier Flags
      description: 'Retrieves the authenticated supplier''s compliance flags, optionally filtered by site, flag type, flag colour and supplier form.


        A caller may only retrieve flags belonging to the supplier they are authenticated as. If the `supplierMongoId` in the path is not the authenticated account, the request is rejected with a `403` before any data is retrieved. API keys are issued to clients rather than suppliers, so API-key callers cannot use this endpoint.


        All request body filters are optional. An omitted field and an explicit empty array are equivalent: no filter is applied on that dimension. Supplying several filters narrows the result by all of them at once.


        The request body itself is optional. Sending no body at all is equivalent to sending `{}`, and applies no filters, returning the authenticated supplier''s flags subject to the `start` and `limit` pagination defaults.


        **Flags description**:

        `site` – overall site status

        `criteria` - the specific line item requirements status (ex: insurance, TRIR, etc)'
      operationId: searchSupplierFlags
      tags:
      - Compliance
      parameters:
      - name: supplierMongoId
        in: path
        required: true
        description: The unique identifier of the supplier. Must be the authenticated supplier.
        schema:
          type: string
      - name: start
        in: query
        description: Optional filter. The record to start with for pagination (0-based)
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Optional filter. Total number of records to be returned.
        schema:
          type: integer
          default: 10
          maximum: 50
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                siteMongoIds:
                  type: array
                  description: Optional filter. Mongo ids of the client sites to filter flags by.
                  items:
                    type: string
                flagTypes:
                  type: array
                  description: Optional filter. Accepted case-insensitively.
                  items:
                    type: string
                    enum:
                    - criteria
                    - site
                    - criteriaVariance
                    - siteVariance
                flagColors:
                  type: array
                  description: Optional filter. Accepted case-insensitively.
                  items:
                    type: string
                    enum:
                    - GREEN
                    - GRAY
                    - AMBER
                    - RED
                supplierFormIds:
                  type: array
                  description: Optional filter. Mongo ids of specific supplier forms to filter flags by.
                  items:
                    type: string
            examples:
              example-1:
                value:
                  siteMongoIds:
                  - 69fa77c6d677987468bf114f
                  flagTypes:
                  - site
                  - criteria
                  flagColors:
                  - RED
                  - AMBER
                  supplierFormIds:
                  - 6a553dde3b00003b05a36b0d
      responses:
        '200':
          description: The supplier's compliance flags. `flags` is an empty array when nothing matches the filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        siteMongoId:
                          type: string
                        supplierMongoId:
                          type: string
                        flagType:
                          type: string
                          enum:
                          - criteria
                          - site
                          - criteriaVariance
                          - siteVariance
                        flagResult:
                          type: integer
                          description: GREEN=0, GRAY=10, AMBER=20, RED=30.
                        supplierMessage:
                          type: string
                        createdDate:
                          type: string
                        updatedDate:
                          type: string
                        files:
                          type: array
                          items: {}
                        supplierFormIds:
                          type: array
                          items:
                            type: string
                        reasonForSiteFlagColor:
                          type: array
                          items: {}
                        isSiteForced:
                          type: boolean
              examples:
                example-1:
                  value:
                    flags:
                    - id: 6a553dde3b00007705a36b18
                      siteMongoId: 69fa77c6d677987468bf114f
                      supplierMongoId: 6a452a8317c94c6737e3c30b
                      flagType: criteria
                      flagResult: 30
                      supplierMessage: New Brunswick Letter of Good Standing must be submitted by the supplier and approved according to client requirements for compliance
                      supplierFormIds:
                      - 6a553dde3b00003b05a36b0d
        '400':
          description: Bad Request. A malformed Mongo id, an unrecognised flagType or flagColor, or a malformed body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid siteMongoIds: ''not-an-object-id'' is not a 24-character hexadecimal ObjectId.'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Could not authenticate request.
                  code:
                    type: string
                    example: AUTH.102
        '403':
          description: Forbidden. The requested supplier is not the authenticated supplier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Requested data does not belong to the authenticated supplier.
                  code:
                    type: string
                    example: CMG.3001
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                x-examples:
                  example-1:
                    error: Error message.
              examples:
                example-1:
                  value:
                    error: Error message.
