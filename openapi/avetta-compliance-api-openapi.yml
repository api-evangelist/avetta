    post:
      summary: Create Variance Flag
      description: 'The API allows users to add “basic variance” through API with the status “Approved” to create a new variance flag.


        The client can only create a variance on a Site or Criteria flag, will not allow to create a variance on SiteVariance or CriteriaVariance flag, will NOT update the existing variance if the variance already exists on the Site and Criteria flag.


        The client can only create one and only one variance against a RED/GREY/AMBER/GREEN supplier flag, the new flag''s color must be different from the Site or Criteria flag’s, and the `flagColor` must be one of these 3 values: Amber, Green, Red.'
      operationId: createVariance
      tags:
      - Compliance
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client, it can be either corporate, hub or site
        schema:
          type: number
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                siteId:
                  type: number
                  description: The site billing id.
                supplierId:
                  type: number
                  description: The supplier billing id.
                flagId:
                  type: number
                  description: The original flag display id.
                flagColor:
                  type: string
                  description: The new flag's color, must be either Green, Amber or Red, and must be different from the original flag color.
                varianceEndDate:
                  type: string
                  description: The End date of the new variance, in format yyyy-MM-dd, and must be a future date.
                comment:
                  type: string
                  description: The optional comment for the new variance.
                files:
                  type: array
                  description: The optional file(s) attached to the new variance, the total size of the file(s) must be less than 10 MB.
                  items:
                    type: string
                    format: binary
              required:
              - siteId
              - supplierId
              - flagId
              - flagColor
              - varianceEndDate
      responses:
        '201':
          description: The display id of new variance flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/1.0.0_controllers.v1.messages.CreateVarianceResponse'
              examples:
                SampleResponse:
                  value:
                    flagId: '4376761826'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                type: string
                example: 'Error creating variance blue is invalid, Invalid flagColor: blue. Allowed values are: Green, Amber, Red'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                x-examples:
                  example-1:
                    error: Unexpected error occurred.
              examples:
                example-1:
                  value:
                    error: Unexpected error occurred.
