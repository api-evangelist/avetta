  /compliance-management-gateway/v1/suppliers/{supplierMongoId}/supplier-forms:
    servers:
    - description: PROD
      url: https://api.avetta.com
    - description: MOCK
      url: https://virtserver.swaggerhub.com/Avet7/ComplianceManagement/1.0.0
    get:
      summary: Get Supplier Forms
      description: 'Retrieves the authenticated supplier''s forms together with the question group metadata behind them - workflow definitions (including each status''s `crmId`), rejection reasons and labels.


        A caller may only retrieve forms belonging to the supplier they are authenticated as. If the `supplierMongoId` in the path is not the authenticated account, the request is rejected with a `403` before any data is retrieved. API keys are issued to clients rather than suppliers, so API-key callers cannot use this endpoint.


        Forms hidden by visibility settings are excluded: a form is returned only if it is associated with at least one of the supplier''s connected sites, and - where its question group carries a `visibleAfterDays` schedule - only once `validStartDate + visibleAfterDays` has elapsed. A form with no `validStartDate` is not returned when its question group has that setting.


        `showCompleted` defaults to **true**. A form counts as completed only when `percentageComplete` is 100 **and** its workflow status has `crmId: closed`; either alone is not sufficient.'
      operationId: getSupplierForms
      tags:
      - Compliance
      parameters:
      - name: supplierMongoId
        in: path
        required: true
        description: The unique identifier of the supplier. Must be the authenticated supplier.
        schema:
          type: string
      - name: siteMongoId
        in: query
        description: Optional filter. Mongo id of the client site to filter forms by.
        schema:
          type: string
      - name: formType
        in: query
        description: Optional filter on the question group's form type.
        schema:
          type: string
          enum:
          - auditGuard
          - docuGuard
          - insureGuard
      - name: expiresAfter
        in: query
        description: Optional filter. Returns only forms expiring strictly after this date (YYYY-MM-DD).
        schema:
          type: string
      - name: showCompleted
        in: query
        description: Whether completed forms are included. Defaults to true.
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: The supplier's forms and the question groups they reference.
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplierForms:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        displayId:
                          type: string
                        supplierMongoId:
                          type: string
                        questionGroupId:
                          type: string
                        questionGroupVersionId:
                          type: string
                        workflowStatusId:
                          type: string
                        validStartDate:
                          type: string
                        validEndDate:
                          type: string
                        expirationDate:
                          type: string
                        siteMongoIds:
                          type: array
                          items:
                            type: string
                        percentageComplete:
                          type: integer
                  questionGroups:
                    type: array
                    items:
                      type: object
                      properties:
                        versionId:
                          type: string
                        formType:
                          type: string
                        questionGroupText:
                          type: string
                        workflow:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            availableStatuses:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                  crmId:
                                    type: string
                        rejectionReasons:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              displayId:
                                type: string
                              shortText:
                                type: string
                              longText:
                                type: string
                        labels:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              displayText:
                                type: string
                              description:
                                type: string
        '400':
          description: Bad Request. A malformed Mongo id, an unrecognised formType, or an unparseable expiresAfter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid supplierMongoId: ''abc'' is not a 24-character hexadecimal ObjectId.'
                  code:
                    type: string
                    example: CMG.1059
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Could not authenticate request.
                  code:
                    type: string
                    example: AUTH.102
        '403':
          description: Forbidden. The requested supplier is not the authenticated supplier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Requested data does not belong to the authenticated supplier.
                  code:
                    type: string
                    example: CMG.3001
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
