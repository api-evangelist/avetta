      description: 'This API retrieves supplier total scores and site details for a specified client.


        `Parameters:`


        - `clientId` (path parameter) — required. Can be the billing ID of a corporate, hub, or site.

        - `supplierId` (query parameter) — optional.

        If provided, returns only active total scores for the specified supplier and its associated site details.

        If not provided, returns all total scores for active suppliers and sites connected to the client.


        - `start` and `limit` (query parameters) — optional. The maximum number of records returned, cannot exceed 500.


        **RESPONSE:**


        Returns a list of suppliers and their associated scorecards (site-level total scores) for the given client.'
      parameters:
      - schema:
          type: integer
          example: '123456'
        name: clientId
        in: path
        required: true
      - schema:
          type: integer
          example: '250488390'
        name: supplierId
        in: query
        required: false
      - schema:
          type: string
          example: '1'
        name: start
        in: query
        required: false
      - schema:
          type: string
          example: '100'
        name: limit
        in: query
        required: false
      responses:
        '200':
          description: Supplier scorecards retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
