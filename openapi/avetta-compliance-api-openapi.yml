                                type: string
                                example: '250097468'
                              siteName:
                                type: string
                                example: C&W Services (CWS) US - General Supplier Prequalification
                              totalScore:
                                type: integer
                                example: 80
              examples:
                WithScorecards:
                  summary: Supplier with scorecards
                  value:
                    totalCount: 1
                    suppliers:
                    - supplierId: 250488390
                      supplierName: Elite Cleaning Co., Inc., d/b/a Elite Building Services
                      scorecards:
                      - siteId: '250097468'
                        siteName: C&W Services (CWS) US - General Supplier Prequalification
                        totalScore: 80
                EmptyScorecards:
                  summary: Supplier with no scorecards
                  value:
