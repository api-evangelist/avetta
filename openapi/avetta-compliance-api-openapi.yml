openapi: 3.2.0
info:
  title: Avetta Compliance API
  version: 1.0.0
  description: 'Operations tagged Compliance across 2 of this provider''s published API definitions: avetta-connect-dist.json, avetta-connect-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.avetta.com
  description: Production (as named in the Client API Service documentation examples)
tags:
- name: Compliance
  x-displayName: Compliance
paths:
  /api/v1/suppliers/count:
    servers:
    - description: PROD
      url: https://api.avetta.com
    - description: MOCK
      url: https://virtserver.swaggerhub.com/Avet7/ComplianceManagement/1.0.0
    get:
      description: Retrieves the number of suppliers returned from the `Get Suppliers` endpoint.
      parameters:
      - description: Optional value to return records after the specified date and time [yyyy-MM-dd hh:mm:ss]
        example: '2016-07-23 05:10:57'
        in: query
        name: modifiedAfter
        required: false
        schema:
          type: string
      - description: Optional filter, returns total count of records with the specified `status`
        in: query
        name: status
        schema:
          enum:
          - active
          - disconnected
          - inactive
          - pending
          - rejected
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                  - total_records: 1845
              schema:
                description: ''
                items:
                  properties:
                    total_records:
                      type: number
                  required:
                  - total_records
                  type: object
                minItems: 1
                type: array
                uniqueItems: true
                x-examples:
                  example-1:
                  - total_records: 1845
            example-1:
              examples:
                response:
                  value:
                  - total_records: 0
          description: OK
          headers: {}
        '400':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    code: 3
                    message: Bad Request
              schema:
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                type: object
          description: Bad Request
          headers: {}
        '500':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    code: '3'
                    message: Broad Error message
              schema:
                properties:
                  code:
                    type: string
                  message:
                    type: string
                type: object
          description: Internal Server Error
          headers: {}
      summary: Get Suppliers Count v1
      tags:
      - Compliance
      operationId: getApiV1SuppliersCount
      x-operation-id-source: derived
  /api/v1/suppliers/{supplierId}:
    servers:
    - description: PROD
      url: https://api.avetta.com
    - description: MOCK
      url: https://virtserver.swaggerhub.com/Avet7/ComplianceManagement/1.0.0
    get:
      description: 'Retrieves a list of multiple supplier data. By default, only suppliers that have active connections to clients will be returned in this endpoint.

        * The `flags` array contains the supplier’s flag for a particular `client_id`.

        * The `client_id` field is the identifier of a specific site within your account hierarchy.

        * The `system_flag` field shows the overall flag color for a particular supplier/contractor for that `client_id`.

        * The `system_flag_details` array contains the detail of your individual flaggable data and its current flag color. This provides specific detailed reasons for the current overall flag color, `system_flag` for in regards to that specific `client_id`.

        * The **updated_date** field(which the `modifiedAfter` applies to) helps you quickly identify the latest updates to your suppliers. It reflects not only changes you or the supplier make but also internal system adjustments, such as updates to evaluations or categories. This means a supplier you haven''t recently interacted with might still appear as "recently updated" due to these behind-the-scenes activities. It''s designed to ensure you always have the most current information at your fingertips, aiding in maintaining compliance within your supply chain.

        > When `supplierId` path parameter is provided, a single supplier object related to the provided Supplier Id is returned. The `start`, `limit`, and `modifiedAfter` parameters will be ignored.'
      parameters:
      - name: supplierId
        in: path
        required: true
        description: Unique identifier for a specific supplier
        schema:
          type: string
      - description: The record to start with for pagination (0-based, not 1-based).
        example: 1
        in: query
        name: start
        required: false
        schema:
          default: 0
          type: number
      - description: The total number of records to return, maximum of 500.
        example: 500
        in: query
        name: limit
        required: false
        schema:
          default: 500
          type: number
      - description: 'Optional parameter. The modifiedAfter parameter will filter out any records with updated_date values older than the value of the parameter supplied.

          **Please note**: updated_date does NOT keep track of the last time one of the fields in the payload has changed. In fact, it keeps track of the last change anywhere in the entire supplier model (an internal model, of which only certain fields are exposed in this endpoint). Changes that can result in updating this updated_date value include changes made by the supplier, changes made by the client (e.g. applying or removing tags), and also some changes made by the system. Example: modifiedAfter=2016-07-23 05:10:57'
        in: query
        name: modifiedAfter
        required: false
        schema:
          type: string
      - description: Optional filter to indicate the connection status of the supplier.
        in: query
        name: status
        schema:
          enum:
          - active
          - disconnected
          - inactive
          - pending
          - rejected
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                  - id: 89010
                    name: Bob's Plumbing Services
                    dba_name: Bob's Plumbing Services, LLC
                    company_url: www.bobsplumbing.com
                    description: Providing plumbing services
                    primary_contact:
                      email: bob.smith@fakeemail.com
                      fax: 555 555 4567
                      first_name: Bob
                      id: '123'
                      last_name: Smith
                      phone: 555 555 1234
                    address:
                      address_line1: 123 Main St
                      address_line2: Suite 100
                      city: Irvine
                      country: United States
                      country_subdivision: California
                      postal_code: '92614'
                    billing_address:
                      address_line1: 123 Main St
                      address_line2: Suite 100
                      city: Irvine
                      country: United States
                      country_subdivision: California
                      postal_code: '92614'
                    account_status: Active
                    updated_date: '2022-04-25 01:39:54'
                    external_id:
                    - client_id: 123
                      type: Vendor
                      value: '123'
                    supplier_tags:
                    - client_id: '123'
                      tags:
                      - id: '223'
                        name: Sample Tag
                    flags:
                    - client_id: 123
                      client_name: Oil Rig
                      forced_expiration: '2018-06-30 00:00:00'
                      is_forced: 'True'
                      system_flag: Amber
                      system_flag_details:
                      - flag: Amber
                        forcedExpiration: '2018-06-30 00:00:00'
                        idForced: true
                        reasons:
                        - General Liability is missing
                      - flag: Green
                        forcedExpiration: ''
                        idForced: true
                        reasons:
                        - ''
                    trades:
                    - Elevator, lift, escalator repair and maintenance services
                    - Escalator installation
                    - Elevator installation
                    service_types:
                    - On-Site
              schema:
                description: ''
                items:
                  properties:
                    account_status:
                      minLength: 1
                      type: string
                    address:
                      properties:
                        address_line1:
                          minLength: 0
                          type: string
                        address_line2:
                          minLength: 0
                          type: string
                        city:
                          minLength: 1
                          type: string
                        country:
                          minLength: 1
                          type: string
                        country_subdivision:
                          minLength: 0
                          type: string
                        postal_code:
                          minLength: 1
                          type: string
                      required:
                      - address_line1
                      - address_line2
                      - city
                      - country
                      - country_subdivision
                      - postal_code
                      type: object
                    billing_address:
                      properties:
                        address_line1:
                          minLength: 0
                          type: string
                        address_line2:
                          minLength: 0
                          type: string
                        city:
                          minLength: 1
                          type: string
                        country:
                          minLength: 1
                          type: string
                        country_subdivision:
                          minLength: 0
                          type: string
                        postal_code:
                          minLength: 1
                          type: string
                      required:
                      - address_line1
                      - city
                      - country
                      - country_subdivision
                      - postal_code
                      type: object
                    company_url:
                      minLength: 0
                      type: string
                    dba_name:
                      minLength: 0
                      type: string
                    description:
                      minLength: 0
                      type: string
                    external_id:
                      items:
                        properties:
                          client_id:
                            type: number
                          type:
                            minLength: 1
                            type: string
                          value:
                            minLength: 1
                            type: string
                        required:
                        - client_id
                        - type
                        - value
                        type: object
                      minItems: 0
                      type: array
                      uniqueItems: true
                    flags:
                      items:
                        properties:
                          client_id:
                            type: number
                          client_name:
                            minLength: 1
                            type: string
                          forced_expiration:
                            minLength: 0
                            type: string
                          is_forced:
                            minLength: 1
                            type: string
                          system_flag:
                            minLength: 1
                            type: string
                          system_flag_details:
                            items:
                              properties:
                                flag:
                                  minLength: 1
                                  type: string
                                forcedExpiration:
                                  minLength: 0
                                  type:
                                  - string
                                  - 'null'
                                idForced:
                                  type: boolean
                                reasons:
                                  items:
                                    type: string
                                  minItems: 1
                                  type: array
                                  uniqueItems: true
                              required:
                              - flag
                              - forcedExpiration
                              - idForced
                              type: object
                            minItems: 0
                            type: array
                            uniqueItems: true
                        required:
                        - client_id
                        - client_name
                        - forced_expiration
                        - is_forced
                        - system_flag
                        type: object
                      minItems: 1
                      type: array
                      uniqueItems: true
                    id:
                      type: number
                    name:
                      minLength: 1
                      type: string
                    primary_contact:
                      properties:
                        email:
                          minLength: 1
                          type: string
                        fax:
                          minLength: 0
                          type: string
                        first_name:
                          minLength: 1
                          type: string
                        id:
                          type: string
                        last_name:
                          minLength: 1
                          type: string
                        phone:
                          minLength: 0
                          type: string
                      required:
                      - id
                      - first_name
                      - last_name
                      - email
                      - phone
                      - fax
                      type: object
                    service_types:
                      items:
                        type: string
                      type: array
                    supplier_tags:
                      items:
                        properties:
                          client_id:
                            type: string
                          tags:
                            items:
                              properties:
                                id:
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                              required:
                              - id
                              - name
                              type: object
                            minItems: 1
                            type: array
                            uniqueItems: true
                        required:
                        - client_id
                        type: object
                      minItems: 0
                      type: array
                      uniqueItems: true
                    trades:
                      items:
                        type: string
                      minItems: 0
                      type: array
                      uniqueItems: true
                    updated_date:
                      minLength: 1
                      type: string
                  required:
                  - id
                  - name
                  - dba_name
                  - company_url
                  - description
                  - primary_contact
                  - address
                  - billing_address
                  - account_status
                  - updated_date
                  - external_id
                  - supplier_tags
                  - flags
                  - trades
                  - service_types
                  type: object
                minItems: 0
                type: array
                uniqueItems: true
          description: OK
          headers: {}
        '400':
          content:
