  /api/v1/connections:
    servers:
    - description: PROD
      url: https://api.avetta.com
    - description: MOCK
      url: https://virtserver.swaggerhub.com/Avet7/ComplianceManagement/1.0.0
    get:
      description: 'Retrieves a list of Connections based on the provided apikey and query parameters.


        This endpoint retrieves the connections for all site accounts whose status is `active` or `pending`.

        Only when passing `supplierId` and `clientId` do the connections for all site accounts whose status is `active`, `pending` and `deactivated` get returned.


        This endpoint retrieves information pertaining to `site` flags.

        If a variance has been applied to a specific connection site, `isForced` would be true, and the flagDetails object in the response would contain the relevant information about the variance. In the case where `isForced` is false, flagDetails would be empty.


        `flagModifiedAfter` will account only for `site` flag changes in the last 30 days. If a client passes the `flagModifiedAfter` param, they are restricted to only the `start`, `limit`, and `clientId` parameters.


        **Note:** The `flagModifiedAfter` is capped to 30 days. Any date larger than this will default it to 30 days.'
      parameters:
      - description: The record to start with for pagination (0-based, not 1-based)
        in: query
        name: start
        schema:
          default: 0
          minimum: 0
          type: number
      - description: The total number of records to return, maximum of 500
        in: query
        name: limit
        schema:
          default: 500
          maximum: 500
          minimum: 1
          type: number
      - description: Optional filter for a supplier
        in: query
        name: supplierId
        schema:
          type: number
      - description: Optional filter for a client account
        in: query
        name: clientId
        schema:
          type: string
      - description: Optional filter for a supplier given its external reference id
        in: query
        name: externalId
        schema:
          type: string
      - description: Optional value to filter the connections which were updated after the specified date and time [yyyy-MM-dd hh:mm:ss]. If no value is specified, it will return records from the past 3 months.
        in: query
        name: modifiedAfter
        schema:
          type: string
      - description: Optional value to filter the Connections based on updatedDate of the "site" flags after the specified date and time [yyyy-MM-dd hh:mm:ss].  The available range is up to 30 days. If you send anything beyond this range, it will be ignored and set to 30 days ago.
        in: query
        name: flagModifiedAfter
        schema:
          type: string
      - description: Returns records with the specified `status`
        in: query
        name: status
        schema:
          default: All statuses (active, inactive, disconnected, pending, rejected)
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                response:
                  value:
                  - supplierId: 89010
                    supplierName: Bob's Plumbing Services
                    clientId: 123
                    clientName: Oil Rig
                    status: Active
                    flagColor: Red
                    isForced: 'No'
