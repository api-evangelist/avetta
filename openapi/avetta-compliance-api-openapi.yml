    get:
      summary: Get Supplier Flags
      description: 'This endpoint allows clients to retrieves flags data (clientId path parameter denotes corporate, hub, or site).

        The `modifiedAfter` parameter can extend up to 1 year from the current date if `supplierId` is provided; otherwise, it cannot exceed 7 days from the current date. The `limit` parameter cannot exceed 500 records.


        **Fields**: `forcedBy`, `varianceStartDate`, `varianceEndDate` in response body will return data only if the flag is a `siteVariance` or `criteriaVariance` and empty if it is a `criteria` or `site`


        **Fields**: `calculationId`, `calculationDescription` in response body will return data if the flag is a `siteVariance`, `criteriaVariance`, or `criteria` and empty if it is a `site` or `siteVariance`


        **Flags description**:

        `site` – overall site status

        `siteVariance` – forced overall site status

        `criteria` - the specific line item requirements status (ex: insurance, TRIR, etc)

        `criteriaVariance` - forced line item status'
      operationId: getSupplierFlags
      tags:
      - Compliance
      parameters:
      - name: clientId
        in: path
        required: true
        description: The unique identifier of the client.
        schema:
          type: integer
      - name: supplierId
        in: query
        description: Optional filter to return flags only applied at a given supplier
        schema:
          type: integer
      - name: flagType
        in: query
        description: Optional filter for flagType.
        schema:
          type: string
          default: criteria, criteriaVariance, site, and siteVariance
      - name: flagColor
        in: query
        description: Optional filter for flagColor.
        schema:
          type: string
          default: Green, Gray, Amber, and Red
      - name: calculationId
        in: query
        description: Optional filter for a calculationId.
        schema:
          type: integer
      - name: flagId
        in: query
        description: Optional filter for a flagId.
        schema:
          type: string
      - name: modifiedAfter
        in: query
        description: Optional filter on the flags updatedDate. When the `supplierId` is provided, the available range is the last 12 months. When the `supplierId` is not provided, the available range is capped at the last 7 days.
        schema:
          type: string
          default: 7 days
      - name: start
        in: query
        description: Optional filter. The record to start with for pagination (0-based)
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Optional filter. Total number of records to be returned.
        schema:
          type: integer
          default: 100
          maximum: 500
      responses:
